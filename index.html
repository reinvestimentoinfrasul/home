<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Padrões Técnicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F3EF;
    --surface: #FFFFFF;
    --ink: #1D2630;
    --ink-soft: #5B6572;
    --ink-faint: #8A93A0;
    --line: #E3E0D8;
    --accent: #2B5F8A;
    --accent-soft: #E7EEF3;
    --danger: #A8402F;
    --danger-soft: #F5E7E3;
    --ok: #2E7D5B;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(29,38,48,0.06), 0 4px 16px rgba(29,38,48,0.05);
  }
  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  header.app-header{
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 20px 28px;
    position: sticky; top:0; z-index: 20;
  }
  .header-inner{ max-width: 1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:38px; height:38px; border-radius:8px;
    background: linear-gradient(135deg, var(--accent), #163C58);
    color:#fff; font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:13px;
    display:flex; align-items:center; justify-content:center;
    letter-spacing: -0.5px;
  }
  .brand h1{ font-size:17px; font-weight:600; margin:0; letter-spacing:-0.2px;}
  .brand p{ margin:2px 0 0; font-size:12.5px; color:var(--ink-soft); }
  .header-actions{ display:flex; gap:8px; align-items:center; }

  button{
    font-family: inherit; font-size: 13.5px; cursor:pointer;
    border-radius: 8px; border:1px solid var(--line);
    background: var(--surface); color: var(--ink);
    padding: 9px 14px; font-weight:500;
    transition: border-color .15s, background .15s, transform .1s;
  }
  button:hover{ border-color: var(--accent); }
  button:active{ transform: scale(0.97); }
  button.primary{ background: var(--accent); color:#fff; border-color: var(--accent); }
  button.primary:hover{ background:#204a6d; }
  button.danger-btn{ color: var(--danger); border-color: var(--danger-soft); }
  button.danger-btn:hover{ border-color: var(--danger); background: var(--danger-soft); }
  button.ghost{ border-color: transparent; background:transparent; }
  button.ghost:hover{ background: var(--accent-soft); border-color: transparent; }
  button:disabled{ opacity:.45; cursor:default; }
  button:disabled:hover{ border-color: var(--line); background: var(--surface); }

  main{ max-width: 1100px; margin: 0 auto; padding: 24px 28px 80px; }

  .toolbar{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:18px;
  }
  .search-box{
    flex:1 1 280px; position:relative;
  }
  .search-box input{
    width:100%; padding: 11px 14px 11px 38px; border-radius: 8px;
    border:1px solid var(--line); background:var(--surface); font-size:14px; color:var(--ink);
    font-family: inherit;
  }
  .search-box input:focus{ outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none; }
  select{
    padding: 10px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-family:inherit; font-size:13.5px;
  }
  select:focus{ outline:none; border-color:var(--accent); }

  .status-row{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
    font-size:12.5px; color:var(--ink-soft); flex-wrap:wrap; gap:8px;
  }
  .status-row .sync-info{ display:flex; align-items:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block; }
  .dot.stale{ background:#C9A227; }

  .grid{ display:flex; flex-direction:column; gap:10px; }

  .card{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow);
    display:flex; overflow:hidden;
  }
  .card-tab{ width:5px; flex-shrink:0; }
  .card-body{ padding:14px 16px; flex:1; min-width:0; }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .card-tags{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .id-chip{
    font-size:11.5px; padding:3px 7px; border-radius:5px; background:#F0EEE9; color:var(--ink-soft);
    font-weight:500; letter-spacing:0.3px;
  }
  .cat-chip{
    font-size:11.5px; padding:3px 8px; border-radius:5px; font-weight:600; letter-spacing:0.2px;
  }
  .tipo-chip{
    font-size:11.5px; padding:3px 8px; border-radius:5px; background:#EEF1F4; color:#3D4C5A; font-weight:500;
  }
  .tag-chip{
    font-size:11.5px; padding:3px 8px; border-radius:5px; background:#F5F0E8; color:#7A5B22; font-weight:500;
  }
  .card-actions{ display:flex; gap:4px; flex-shrink:0; }
  .icon-btn{
    border:none; background:transparent; padding:5px; border-radius:6px; color:var(--ink-faint);
  }
  .icon-btn:hover{ background:var(--accent-soft); color:var(--accent); }
  .icon-btn.del:hover{ background:var(--danger-soft); color:var(--danger); }

  .card-text{
    font-size:13.8px; color:var(--ink); white-space:pre-wrap; line-height:1.55;
  }
  .card-text.clamped{
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .expand-link{
    font-size:12.5px; color:var(--accent); background:none; border:none; padding:6px 0 0; font-weight:500;
    cursor:pointer;
  }

  .empty-state{
    text-align:center; padding: 60px 20px; color:var(--ink-soft);
  }
  .empty-state svg{ margin-bottom:14px; opacity:.5; }
  .empty-state h3{ margin:0 0 6px; color:var(--ink); font-size:16px; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(29,38,48,0.45); display:flex; align-items:flex-start;
    justify-content:center; padding: 5vh 20px; z-index:100; overflow-y:auto;
  }
  .modal{
    background:var(--surface); border-radius:14px; width:100%; max-width:640px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25); animation: modalIn .18s ease-out;
  }
  @keyframes modalIn{ from{ opacity:0; transform: translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .modal-header{ padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .modal-header h2{ font-size:16px; margin:0; font-weight:600; }
  .modal-body{ padding:20px 24px; display:flex; flex-direction:column; gap:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.4px; }
  .field input, .field textarea, .field select{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    font-family:inherit; font-size:14px; color:var(--ink); background:var(--bg);
  }
  .field textarea{ min-height:140px; resize:vertical; line-height:1.5; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--accent); background:var(--surface); }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .modal-footer{ padding:16px 24px 22px; display:flex; justify-content:flex-end; gap:10px; border-top:1px solid var(--line); }
  .field-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; }

  .confirm-box p{ font-size:14px; color:var(--ink-soft); margin:0; }
  .confirm-box .id-chip{ margin-top:8px; display:inline-block; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px; font-size:13.5px;
    box-shadow:0 8px 24px rgba(0,0,0,0.2); z-index:200; opacity:0; transition:opacity .2s, transform .2s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
  .toast.error{ background: var(--danger); }

  .loading-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:100px 20px; color:var(--ink-soft); gap:10px; }
  .spinner{ width:22px; height:22px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent); animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#D8D4CB; border-radius:6px; }

  @media (max-width: 640px){
    main{ padding:18px 14px 60px; }
    header.app-header{ padding:16px; }
    .field-row{ flex-direction:column; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">CP</div>
      <div>
        <h1>Central de Padrões Técnicos</h1>
        <p id="subtitle-count">carregando…</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="ghost" id="btn-refresh" title="Recarregar dados do servidor">↻ Atualizar</button>
      <button class="ghost" id="btn-export" title="Exportar para Excel">⇩ Exportar .xlsx</button>
      <button class="primary" id="btn-new">+ Novo registro</button>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="text" id="search-input" placeholder="Buscar por id, categoria, tipo, tag ou texto…">
    </div>
    <select id="filter-categoria"><option value="">Todas as categorias</option></select>
    <select id="filter-tipo"><option value="">Todos os tipos</option></select>
  </div>

  <div class="status-row">
    <div class="sync-info"><span class="dot" id="sync-dot"></span><span id="sync-text">Sincronizado</span></div>
    <div id="result-count"></div>
  </div>

  <div id="content">
    <div class="loading-screen"><div class="spinner"></div><span>Carregando base de dados…</span></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const SEED_DATA = [{"id": 536, "categoria": "ELÉTRICA", "tipo": "Instalação", "tag": "TCC", "texto": "Antes de autorizar o serviço via carro oficina, é necessário que sejam verificadas as condições abaixo: \n\n1. O equipamento a ser instalado é novo. Se sim, a fixação e instalação está a cargo do fornecedor e não há motivo para gerar custo de instalação com o carro oficina. Deve ser acionado o fornecedor para a instalação via FALE COM O CESUP. \n\n2. Já existe ponto elétrico e lógico para a instalação do equipamento. Em caso negativo deve ser acionado o carro oficina para a instalação dos pontos. \n\n3. O equipamento é remanejado. A instalação está a cargo da BBTS, pois será necessária a configuração do equipamento. \n\nFavor retornar o questionamento utilizando o status \"Complemento dependência demandante\""}, {"id": 628, "categoria": "ELÉTRICA", "tipo": "plataforma", "tag": "SPDA", "texto": "Os cabos furtados são do tipo cabo cobre nu #35mm2 e não tem item contratual no carro oficina.\nEncaminhamos para providências de atendimento alternativo, por meio do Carro Engenharia, conforme IN-327-1 - 1.6.5.1.1.\nTrata-se de sinistro, furto de cabeamento de SPDA."}, {"id": 666, "categoria": "GERAL", "tipo": "CDA", "tag": "SISBB", "texto": "MOD1\nCABE AO EXECUTANTE OBSERVAR DISPOSIÇÕES DA IN1154-1 ITEM 6.1, QUANTO\nA VEDAÇÕES, DUPLIC PEDIDOS E FRACIONAMENTOS. Experimente CDA Plat.BB  \n\nMOD2\nCABE AO EXECUTANTE OBSERVAR DISP.IN1154-1 QUANTO a Valor de mercado\nVEDAÇÕES, DUPLIC PEDIDOS E FRACIONAMENTOS. Experimente CDA Plat.BB_"}, {"id": 559, "categoria": "GERAL", "tipo": "Orçamento Aprovado", "tag": "SIMPLEX", "texto": "Quantitativos de serviços analisados e deferidos conforme aba ORÇAMENTOS e observações no HISTÓRICO."}, {"id": 658, "categoria": "GERAL", "tipo": "corretiva", "tag": "sesmt", "texto": "Para análise e atendimento de solicitações do SESMT (vistoria e notificação), abrir chamado no aplicativo SCAP com a cópia do documento emitido pelo SESMT.\nhttps://cesuprede.intranet.bb.com.br/scap/#/cadastro"}, {"id": 600, "categoria": "ATENDIMENTO", "tipo": "Devolvida para Dependência", "tag": "Serviço_não_contratual", "texto": "Prezados,\n\nServiço não contratual do Carro Oficina.\nOrientamos a utilizar o contrato de limpeza devendo ser utilizada a limpeza com máquinas de jato de água a alta pressão. Caso o contrato de limpeza também não contemple os serviço das pastilhas, orientamos a dependência a utilizar alternativamente o Zápido e os eventos CDA de Pequenas despesas de Pronta entrega e Pagamento, conforme IN-1154 (item de Contratação Direta).\n\nConcluir a Ordem de Serviço com o status CONCLUÍDO DESPESAS DE PEQUENO VULTO"}, {"id": 331, "categoria": "CIVIL", "tipo": "", "tag": "recomposição calçada", "texto": " Ao CESUP Suprimentos,\nFavor acionar fornecedor para recompor calçada considerando os seguintes serviços:\n\nRefazer o quadrante danificado (área aproximada 1x1,5m)\n\n2.1 - Demolicao manual de concreto simples (0,10m³)\n2.18 - Remocao de entulho com cacamba metalica, inclusive limpeza, transporte, carga, descarga e descarte conforme legislacao ambiental - Material de descarte (alvenaria, estruturas metalicas, madeiramento, revestimentos ceramico (3m³)\n5.4 - Concreto fck = 15 MPa, controle tipo \"B\", e = 5 cm, e armado com tela de aco CA-60 (1,5m²)\n\nConforme solicitação da fiscalização, anexar à RAT o croqui com  as medidas da execução. "}, {"id": 635, "categoria": "ATENDIMENTO", "tipo": "ELÉTRICA", "tag": "PPCI", "texto": "Ao Cesup Plataforma,\n\nEncaminhamos para análise e condução, após análise de segundo nível verificamos a necessidade de adequação nas instalações de prevenção e combate a incêndio.\nInstalação de luminárias de emergência somente podem ser instaladas com projeto de prevenção de incêndio aprovado."}, {"id": 645, "categoria": "ATENDIMENTO", "tipo": "ELÉTRICA", "tag": "PPCI", "texto": "Pedimos orientar a Agência que registre SCAP para condução de AVCB junto ao CBMPI pelo Cesup Plataforma.\nPara adequação nas instalações de prevenção e combate a incêndio.\nInstalação de luminárias de emergência somente podem ser instaladas com projeto de prevenção de incêndio aprovado.\n\nCaminho do SCAP:\nhttps://cesuprede.intranet.bb.com.br/scap/#/cadastro\n\nDevolver esta OS com o status \"Complemento dependência demandante\", para conclusão."}, {"id": 672, "categoria": "ATENDIMENTO", "tipo": "ELÉTRICA", "tag": "PPCI", "texto": "Prezados,\n\nNeste caso, como envolve o projeto de iluminação de emergência e inclusão de novos pontos, pedimos que a agência registre SCAP para condução de AVCB pela da Equipe de Reinvestimento.\nInstalação de luminárias de emergência somente podem ser instaladas com projeto de prevenção de incêndio aprovado.\n\nCaminho do SCAP:\nhttps://cesuprede.intranet.bb.com.br/scap/#/cadastro"}, {"id": 563, "categoria": "GERAL", "tipo": "ponto novo", "tag": "posto", "texto": "Sr. Gerente,\n\nPara a criação de novos postos de trabalho nas dependências é necessário abrir solicitação vis SCAP, após aprovação e autorização da SUPER ADM.\nApós a autorização, a plataforma jurisdicionante fará estudo de alteração de layout pra adequação dos espaços. "}, {"id": 623, "categoria": "ATENDIMENTO", "tipo": "Padrão", "tag": "Plataforma", "texto": "Ao CESUP Plataforma, \nEncaminhamos para parecer a respeito da criação dos novos pontos lógicos e da mudança de leiaute proposta."}, {"id": 637, "categoria": "ATENDIMENTO", "tipo": "Serviço aprov.", "tag": "Plataforma", "texto": "Serviço autorizado.\nFornecedor deve apresentar relatório técnico fotográfico e orçamento previamente a execução dos serviços."}, {"id": 424, "categoria": "CIVIL", "tipo": "Indeferida", "tag": "pintura piso calçada", "texto": "  Prezados,\nIndeferimos a pintura total de pisos e calçadas. Os pisos não devem receber pintura pois pode ocasionar alteração do coeficiente de atrito estabelecido conforme normas técnicas vigentes.\n\nOrientamos efetuar a limpeza dos pisos externos utilizando o contrato de limpeza da dependência, através de limpeza mais eficiente com utilização de lavadoras de alta pressão (tipo \"WAP\"). Consultar em: https://super.intranet.bb.com.br/superadm/ambiencia\n   "}, {"id": 380, "categoria": "CIVIL", "tipo": "Encaminhado para CESUP Plataforma Jurisdicionante", "tag": "Perfil A B", "texto": "Encaminhamos para condução da Plataforma Jurisdicionante por tratar-se de prédio Perfil A/B (IN 328-1 item 3.3 e 4.1)."}, {"id": 514, "categoria": "GERAL", "tipo": "Corretiva", "tag": "Perfil", "texto": "4. Administração da Manutenção Predial\n\n4.1. Prédios perfis A e B\n\n4.1.1. Cabe aos Administradores prediais, ao Cesup Rede São Paulo e ao Cesup Rede Brasília, administrar a Manutenção Predial dos imóveis perfil A e B."}, {"id": 665, "categoria": "GERAL", "tipo": "CDA", "tag": "PDS", "texto": " CABE AO EXECUTANTE OBSERVAR AS DISPOSIÇÕES DA IN1154-1 ITEM 6.1, QUANTO a conformidade e VEDAÇÕES, DUPLICIDADE DE PEDIDOS E FRACIONAMENTOS. Pedido dentro dos limites mensal e anual. IN 193: É vedado pela UAC qualquer alteração de layout, por parte da Rede Física, mesmo que pequenas, sem a prévia autorização da engenharia ( 3.5.5. e 3.5.5.4. IN 193)AMPLIAÇÃO DAS CONDIÇÕES DE SEGURANÇA DEVEM SER PRECEDIDAS DE PARECER DA DISIN/GESIN "}, {"id": 564, "categoria": "GERAL", "tipo": "Projetos", "tag": "mapoteca", "texto": "Prezados,\n\nFavor anexar a esta OS o projeto de instalações de rede local para podermos analisar o orçamento.\n\nFavor anexar os projetos das dependências na mapoteca digital para futuras consultas."}, {"id": 679, "categoria": "ATENDIMENTO", "tipo": "PONTO NOVO", "tag": "LÓGICO", "texto": "Sr. gerente,\n\nNo relatório tem o pedido de instalação de novos pontos elétrico/lógicos no Atendimento.\nFavor informar:\n- haverá mudança de leiaute para inclusão de novas mesas de atendimento ou outro equipamento?\n- Quais equipamentos serão instalados?"}, {"id": 620, "categoria": "GERAL", "tipo": "Encerrada", "tag": "layout", "texto": "Prezados,\n\nconsiderando que a dependência está no modelo 98, com plataforma de atendimento em piso elevado, e sem leiaute seguro, recomendamos a abertura de SCAP, para modernização do padrão visual.\n\nUtilizar o link abaixo, qualificando o assunto como Estudo de Leiaute, Análise de investimento, Adequação de Rede.\n\nhttps://cesuprede.intranet.bb.com.br/scap/#/cadastro"}, {"id": 524, "categoria": "GERAL", "tipo": "CFTV", "tag": "Instalação", "texto": "Sr. Gerente,\n\nO carro oficina não pode executar o serviço de instalação de equipamentos.\n\nA habilitação de pontos de CFTV no rack e ativação das câmeras, deve ser solicitada à BBTS.\nPara solicitar à BBTS, deve-se abrir um chamado via Help Desk e solicitar o serviço (eventual) de INSTALAÇÃO, pois não se trata de chamado comum de manutenção. \nChamados corretivos (comuns) não serão atendidos para instalação."}, {"id": 675, "categoria": "ATENDIMENTO", "tipo": "CFTV", "tag": "fornecimento", "texto": "o fornecimento de equipamentos de CFTV é feito através do contrato 202085580066 - DOSI (Disponibilidade Operacional de Sistema de Imagem), sob gestão da USI. Esse contrato pode ser acionado através da Plataforma Digital de Suprimentos. Intranet>Plataforma>Disec>Menu(lateral esquerda)>Manutenção/Serviços> Ordem de Serviço>Solicitar. Abrir Ordem de Serviço selecionando:\nManutenção (Atendimento);\nCFTV Acion. (Acionamento);\n9999999999999 Diversos (Nr Universal de Bem);\nAtendimento Varejo (Ambiente);\nServiço Eventual Instalação (Tipo de Serviço/Demanda);\n1 (Quantidade);\nun (Unidade);\nInformar o total de equipamentos necessários (câmera e DVR) na descrição do problema."}, {"id": 625, "categoria": "ATENDIMENTO", "tipo": "Fale Com Cesup", "tag": "FalecomCesup", "texto": " Olá, (nome da pessoa)\n\"Resposta com informação/solução\"\n\nEstou a disposição pelos contatos do humanograma se necessário.\n\nPor favor não deixe de avaliar o meu atendimento.\n(Seu nome) -  Cesup Projetos e Manutenção\n\n*O Fale com Cesup é o seu canal de comunicação com a Disec. Avalie este atendimento, Acesse: Mensagens da Dependência > Encerrar/Reabrir (clique na estrela)\n "}, {"id": 643, "categoria": "CIVIL", "tipo": "", "tag": "Fachada", "texto": "Prezados,\n\no contrato de limpeza da dependência prevê a limpeza semestral da fachada.\n\nOrientamos a abrir um chamado na Plataforma BB > Administrativo > Manutenção> Ordem de Serviço > Solicitar > Abrir Ordem de Serviço > Selecionar: Serviços > Serviço de Limpeza PDS > Limpeza Permanente > Irregularidade > Inexecução Contratual, e informar a necessidade de limpeza da fachada."}, {"id": 638, "categoria": "ATENDIMENTO", "tipo": "corretiva", "tag": "equipe residente", "texto": "Prezados,\nA Dependência está localizada em prédio PERFIL B e deve ser atendida pelo contrato de equipe residente conforme IN-328.\n"}, {"id": 673, "categoria": "CIVIL", "tipo": "Empolamento", "tag": "Empolamento ", "texto": "O empolamento é o volume de vazios de um material. Para construção, consideramos o coeficiente de empolamento para calculo da expansão de volume ocorrida no processo de demolição. Conforme literatura informada bem como usualmente utilizado em obras, se considera o coeficiente de empolamento para alvenaria na ordem de 50%. Existem tabelas que correlacionam o tipo de material (terra, argila, cimento, etc) ao correto coeficiente de empolamento do material, porém não seria prático ficarmos pesquisando o material de constituição de cada item para aplicação do coeficiente, portanto, considero o acréscimo de 30% de coeficiente de empolamento para materiais em geral, salvo tratar-se de entulho gerado por alvenaria e rocha (50%), areia (15%), terra comum (25%), argila (40%).\n"}, {"id": 644, "categoria": "GERAL", "tipo": "ponto novo", "tag": "elétrica lógica", "texto": " Ao Cesup Plataforma,\n\nPedimos anuência da Plataforna para instalação dos pontos lógicos no suporte.\nFavor anexar projeto do local para podermos dimensionar os circuitos.  "}, {"id": 554, "categoria": "ELÉTRICA", "tipo": "Ponto Elétrico", "tag": "corredor", "texto": "Sr. Gerente,\n\nNão é prevista na IN a instalação de pontos de energia no corredor de abastecimento para utilização de contadora de cédulas ou outros equipamentos que não sejam os TAA/TOP.\n\nTodas as soluções de segurança que envolvam procedimentos, infraestrutura e equipamentos não especificadas, homologadas e também não descritas em norma, deverão ser submetidas previamente à GESIN/SP para a avaliação. "}, {"id": 661, "categoria": "ELÉTRICA", "tipo": "Encaminhar a Plataforma", "tag": "CFTV", "texto": "Devido a alteração no Plano de Segurança da agência (IN-416 - 7.1.7.1 ) pedimos analisar o pleito da dependência. \nReforma de infraestrutura ou ampliação de sistema de  ALARME deve ter projeto e anuência do CESUP Plataforma. \nFavor indicar a posição em planta."}, {"id": 552, "categoria": "Elétrica", "tipo": "Ponto lógico", "tag": "certifica", "texto": "Obs:. Conforme previsto em contrato:\n38. A CONTRATADA, antes do Recebimento por parte da fiscalização do CESUP Patrimônio PR, deverá proceder aos testes de performance de todo o cabeamento (certificação), com vistas à comprovação da conformidade com a norma EIA/TIA 568, no que tange a continuidade, polaridade, identificação, curto-circuito, atenuação, NEXT (Near End Cross Talk – diafonia). Para isso deverá ser utilizado testador de cabos UTP categoria 5e - SCANNER, nível 2 (350 Mhz), conforme norma EIA/TIA - TSB-67.\n39. A CONTRATADA deve apresentar os relatórios gerados pelo aparelho, datados (coincidente com a data do teste) e rubricados pelo Responsável Técnico da CONTRATADA.\n40. Não serão aceitos testes por amostragem. Todos os cabos UTP deverão ser testados, na extremidade da tomada e na extremidade do painel distribuidor (bidireccionalmente)\nO relatório gerado pelo aparelho deve obrigatoriamente ser anexado a esta OS para viabilizar o faturamento.   "}, {"id": 547, "categoria": "GERAL", "tipo": "CDA", "tag": "CDA", "texto": "Sr. Gerente,\n\nA empresa que prestava serviço para o carro oficina teve seu contrato rescindido.\nA equipe de contratações está envidando esforços para contratar uma nova empresa mas o atendimento neste período ficará prejudicado.\n\nComo alternativa a serviços necessários e urgentes, orientamos buscar profissional ou empresa local que possa atender a este serviço e pagamento via CDA-Pequeno vulto.\n\nOutra opção é abertura de chamado no ZÁPIDO, conforme IN 328-1-16: Interface Digital para a Contratação de Pequenas Despesas de Pronta Entrega e Pagamento de Manutenção Predial - Zápido, disponível no na Plataforma BB 3.0 - Negócios - Administrativo - manutenção - Zápido."}, {"id": 548, "categoria": "GERAL", "tipo": "CDA", "tag": "CDA", "texto": "Sr. Gerente,\n\nA empresa que prestava serviço para o carro oficina teve seu contrato rescindido.\nA equipe de contratações está envidando esforços para contratar uma nova empresa mas o atendimento neste período ficará prejudicado.\n\nComo alternativa a serviços necessários e urgentes, orientamos buscar profissional ou empresa local que possa atender a este serviço e pagamento via CDA-Pequeno vulto.\n\nOutra opção é abertura de chamado no ZÁPIDO, conforme IN 328-1-16: Interface Digital para a Contratação de Pequenas Despesas de Pronta Entrega e Pagamento de Manutenção Predial - Zápido, disponível no na Plataforma BB 3.0 - Negócios - Administrativo - manutenção - Zápido."}, {"id": 649, "categoria": "ATENDIMENTO", "tipo": "", "tag": "CDA", "texto": "Quanto a aquisição de chaves, a agência deverá utilizar CDA:\nAQUISIÇÃO DE CHAVES (NOTA FISCAL DE VENDA) - evento 1241\nCONFECÇÃO DE CHAVES (NOTA FISCAL DE SERVIÇO) - evento 800\n\nIndeferir a OS após orientação.\n\nOrientar a dependência que a troca de fechadura pode ser realizada via Carro Oficina"}, {"id": 640, "categoria": "CIVIL", "tipo": "", "tag": "Benfeitoria", "texto": "Prezados,\n\nRetornamos para a dependência informando que foi solicitada a notificação do proprietário.\n\nA notificação será realizada pelo 7419 CESUP SUPRIMENTOS Setor de Patrimônio Bens de Uso Comodato, Cessão e Benfeitorias Necessárias Imóveis.\n\nGentileza dar ciência e devolver esta Ordem de Serviço usando status COMPLEMENTO DEPENDÊNCIA DEMANDANTE em Plataforma BB > Administrativo > Manutenção > Pendência de Providências > Selecionar a OS"}, {"id": 546, "categoria": "GERAL", "tipo": "Rack", "tag": "BBTS", "texto": "Item 19.12 - A organização do rack é de atribuição do contrato da BBTS, qualquer intervenção pelo carro oficina é vedada. A contratada poderá ser responsabilizada pode eventuais danos a equipamentos instalados no interior do rack. Excluir do orçamento todo e qualquer valor orçado referente à organização dos racks."}, {"id": 551, "categoria": "GERAL", "tipo": "Plataforma", "tag": "amb900", "texto": "Prezados,\n\nEncaminhamos Os para análise e providências, pois trata-se de obra de amb900 em andamento.\n\nCaso a solicitação não faça parte da referida obra, favor retornar esta OS ao CESUP Suprimentos com a autorização de execução dos serviços."}, {"id": 677, "categoria": "ATENDIMENTO", "tipo": "DOSA", "tag": "ALARME", "texto": "À dependência:\nApós a infra concluída orientamos acionar a BBTS para instalação e configuração do alarme.\nO acionamento do contrato de alarme com a BBTS é realizada pelo 0800 729 0123."}, {"id": 481, "categoria": "GERAL", "tipo": "", "tag": "#zapido", "texto": "Orientamos abertura de chamado no ZÁPIDO, conforme IN 328-1-16: Interface Digital para a Contratação de Pequenas Despesas de Pronta Entrega e Pagamento de Manutenção Predial - Zápido, disponível no na Plataforma BB 3.0 - Negócios - Administrativo - manutenção - Zápido."}, {"id": 630, "categoria": "ATENDIMENTO", "tipo": "Abertura", "tag": "#textoabertura", "texto": "Fale com o Cesup\n\nEmail: cesup.atd.demaiseqp@bb.com.br, suzanabossi@bb.com.br, lunascimento@bb.com.br\n\nTelefone: 41 3259-0358"}, {"id": 678, "categoria": "ATENDIMENTO", "tipo": "Elétrica", "tag": "#tesouraria #Teclado #painel #", "texto": "Serviço autorizado para execução direta.\n\nPassar infraestrutura e instalar ponto lógico simples próximo à porta da tesouraria, em local indicado pelo gerente.\n\nO Teclado é instalado pela BBTS.\n"}, {"id": 497, "categoria": "GERAL", "tipo": "Encerrado Patrimônio", "tag": "#telefonia", "texto": " Prezados, esse serviço não faz parte do escopo dos serviços de carro oficina. Problemas com telefonia, favor abrir chamado pela plataforma. Ao abrir a Plataforma BB -> no canto superior direito, clicar no ícone em forma de headset (suporte técnico) -> buscar a palavra \"tronco\" no buscador -> Requisição | Atendimento a ramais e troncos de telefonia -> Atendimento a ramais e troncos de telefonia Clique para solicitar  "}, {"id": 595, "categoria": "ATENDIMENTO", "tipo": "2º Atend. Sinistro", "tag": "#sinistro2", "texto": " Sr fornecedor, executar o atendimento conforme orçamento aprovado pelo Cesup Plataforma XXXXX, assessor(a) de eng. XXXXX, no valor de R$ XXXXX:\nFazer constar no RAT e na planilha de faturamento:\n#projeto #sinistro2\n#agrupamento XXXXX   \nNÃO REALIZAR ITENS NÃO CONTRATUAIS\nEsclarecemos que o pagamento do RAT se dará apenas após o registro da conformidade pelo Cesup Plataforma. "}, {"id": 594, "categoria": "ATENDIMENTO", "tipo": "1º Atend. Sinistro", "tag": "#sinistro1", "texto": "-1 º atend.: Atender o ponto considerando apenas os itens correlatos ao Sinistro, previstos em contrato, PRÉ-EXISTENTES ao ocorrido e até o valor limite de R$ 30.000,00. Priorizar serviços que permitam a reabertura do ponto, mesmo que de forma parcial, sob orientações e acompanhamento do Cesup Plataforma jurisdicionante. Apresentar relatório técnico-fotográfico do \"antes/depois\", nos padrões exigidos, anexando-o na aba \"Documentos\". Se o 1º atend. (limitado à R$ 30.000,00) for insuficiente, o orçamento e o relatório fotográfico deverão ser fornecidos para a recomposição total da agência (anexar os docs. na própria OS - aba \"Documentos\" e preencher a aba \"Orçamento\"). Encaminhar tal levantamento em até 48h juntamente com o RAT do 1º atend. (utilizar a opção \"Orçamento Realizado pelo Fornecedor\"). Informar se haverá a necessidade de itens não contratuais, prazo para conclusão dos serviços (se autorizados) e a confirmação de disponibilidade técnica para eventual atendimento. Fazer constar no RAT e na planilha de faturamento: #sinistro1"}, {"id": 510, "categoria": "GERAL", "tipo": "Ao Suprimentos", "tag": "#sinistro", "texto": "Ao Suprimentos,\nTrata-se de sinistro-chuvas/vendaval - acionar Fornecedor para o fluxo de 1o. atendimento Sinistro."}, {"id": 556, "categoria": "ELÉTRICA", "tipo": "Encerrada pelo CESUP Patrimonio", "tag": "#SinalizaçãoLED", "texto": "Manutenção na Sinalização Externa de LED não faz parte do escopo do contrato de carro oficina, este serviço deve ser realizado pelo fornecedor dos equipamentos. Favor abrir um Fale com CESUP solicitando reparo/manutenção da Sinalização Externa de LED para os equipamentos com defeito. "}, {"id": 550, "categoria": "CIVIL", "tipo": "", "tag": "#sinalização externa", "texto": "#Instalação PLACAS DE SINALIZACAO : Modelos de Placas de Estacionamento \n\nPrezados,Trata-se de item não contratual do carro oficina. Favor adotar procedimentos descritos na IN 323-1 seção 2.9.3, transcrita abaixo:\n\"Os serviços de mão de obra para instalação das peças, podem ser contratados localmente pela sistemática de Pequenas Despesas \nde Pronta Entrega e Pagamento utilizando-se o evento CDA 99-Manutenção Predial Ordinária - Mão de Obra, constante da \n\"Tabela Manutenção Predial\".\""}, {"id": 438, "categoria": "CIVIL", "tipo": "", "tag": "#sinalização externa", "texto": "  Prezados,\nPor gentileza acionar fornecedor para elaborar relatório técnico e orçamento para revitalização completa da sinalização externa letreiro, prisma, pórtico de acesso, totem (recuperação de estrutura, pintura automotiva, policarbonato, película, etc).\n- O relatório técnico precisa estar subsidiados de fotos do lado interno e externo dos ambientes. As fotos devem ser amplas, todos os ângulos, de perto, de longe e de todo contexto do ambiente;\n- O relatório deve conter o memorial de cálculo dos quantitativos que subsidiaram o orçamento;\n- Apresentar croqui;\n- Atentar para a qualidade do relatório para entendimento completo da demanda.  "}, {"id": 622, "categoria": "1º Nivel", "tipo": "Sinalização", "tag": "#Sinalização", "texto": "Prezados, \n\nA solicitação de sinalização deve ser realizada na Loja Virtual, na Plataforma BB- Administrativo - Suprimentos - Loja Virtual - Solicitar Produtos e Serviços, utilizando o PBMS genérico para sinalização 99.05.020.70002. \n\nNo campo justificativa, informar: nome e número da configuração desejada, conforme sinalização, especificações disponíveis na IN 323; Dizeres/Numeração : nome da dependência, horários, etc... (IN 323)"}, {"id": 463, "categoria": "CIVIL", "tipo": "", "tag": "#sinalização", "texto": "  Prezados,\nTrata-se de item não contratual para atendimento pelo contrato de carro oficina.\n\nPara Solicitar Sinalização Interna acesse a loja virtual pelo caminho: Plataforma BB>Administrativo>Suprimentos> Loja Virtual> Solicitar Produtos e Serviços, utilizando PBMS genérico para sinalização 99.05.020.70002.\n\nNo campo justificativa, informar: Nome e numero da configuração desejada, conforme especificação da IN:323. "}, {"id": 527, "categoria": "Acessibilidade", "tipo": "Demandas SESMT", "tag": "#SESMT", "texto": " Encaminhamos demanda para esteira especifica de acessibilidade para tratamento. \nNão serão realizadas adequações isoladas que não resultem na obtenção do atestado de acessibilidade da unidade, tendo em vista a existência de um TAC firmando entre o Banco e Ministério Público Federal (MPF). "}, {"id": 662, "categoria": "GERAL", "tipo": "Encerrada", "tag": "#SESMT", "texto": "Prezados,\n\nPara adequação de acessibilidade e outros itens de segurança, apontados em vistoria do SESMT, ressaltamos que os itens precisam ser detalhados e especificados em projeto.\n\nFavor solicitar ao SESMT o projeto com o layout da dependência, quantitativos e especificações para execução, a partir disso, abrir uma nova OS de carro oficina anexando o projeto no pedido.\n\nO Carro Oficina poderá realizar os itens contratuais que não alterem significativamente o layout da dependência."}, {"id": 612, "categoria": "GERAL", "tipo": "Encerrada pelo Patrimônio Engenharia", "tag": "#SemResposta", "texto": "Encerramos esta OS devido a ausência de resposta/informações da dependência.\n\nCaso o serviço ainda seja necessário, favor abrir nova OS com os seguintes esclarecimentos:\n- Se é instalação de ponto novo ou manutenção de ponto existente.\n\nNo caso de ponto novo:\n- Especificar o equipamento que será ligado ao novo ponto;\n- Descrever o motivo (Ex: aumento na dotação de pessoal, equipamento novo, remanejo de equipamento, etc.);\n- Se for pedido externo, favor anexar o pedido na aba documentos desta OS (Ex: Disin, BBTS, PF, CMS, CMA, etc.);\n- Se haverá alteração no layout e descrever local da instalação;\n\nUtilizar o botão \"Incluir observação\" se necessário."}, {"id": 674, "categoria": "ELÉTRICA", "tipo": "Carro oficina", "tag": "#secador", "texto": "A opinião acadêmica mais difundida é que os secadores de mão elétricos seriam o pior método para enxugarmos as mãos sob a ótica da higiene e saúde, especialmente no caso dos sopradores de ar quente. Diversos estudos realizados pela Universidade de Westminster, de Leeds (https://onlinelibrary.wiley.com/doi/full/10.1111/jam.13014), pelo Instituto de tecnologia de Massachusetts (MIT) e outros trabalhos publicados pelo Journal of Applied Microbiology mostram que usar o método de sopro de ar aumenta o número de bactérias em nossas mãos e espalham micróbios pelo ar, contaminando o ambiente. Além disso, a maior demora no processo de secagem faz com que as pessoas desistam do método. Temos três aspectos importantes a serem levados em consideração no momento de secar nossas mãos: (1) eficiência de secagem, (2) remoção de bactérias e (3) contaminação cruzada, e em todos eles o papel toalha apresentou resultados mais positivos do que o secador elétrico de mãos. A conclusão do estudo da Mayo Clinic diz que a secagem apropriada das mãos após a lavagem é um componente essencial na efetividade da higiene delas, uma forma comprovadamente eficaz na prevenção de doenças e, do ponto de vista da higiene, o papel toalha é superior ao secador elétrico de mãos e é recomendado especialmente para ambientes hospitalares. Em outras palavras, usar papel toalha ao invés do secador elétrico de mãos nos ajuda a evitar a transmissão de doenças. Sob a ótica da sustentabilidade, o custo ambiental de ambos os equipamentos é similar, considerando-se todo o ciclo de vida dos dois produtos."}, {"id": 319, "categoria": "CIVIL", "tipo": "", "tag": "#SCAP", "texto": " Abrir SCAP para a plataforma - Exemplo OS 190065247 "}, {"id": 610, "categoria": "ELÉTRICA", "tipo": "Encerrada pelo Patrimônio Engenharia", "tag": "#SCAP", "texto": "Prezados,\n\nInformamos que acréscimo de câmeras na dependência requer adequação de layout e atualização de projetos, por esse motivo deve ser submetido ao CESUP Plataforma. O pedido pode ser registrado no aplicativo \"SCAP\": https://cesuprede.intranet.bb.com.br/demandas/cadastro/"}, {"id": 619, "categoria": "ATENDIMENTO", "tipo": "Encerrada pelo Patrimônio Engenharia", "tag": "#SCAP", "texto": "Para avaliação da necessidade de alteração de layout é necessário abrir SCAP. Favor justificar o motivo da demanda na abertura do SCAP."}, {"id": 654, "categoria": "ELÉTRICA", "tipo": "", "tag": "#SCAP", "texto": "Prezados,\n\nDemandas que alterem o layout/configurações atuais da dependência devem ser solicitada através do SCAP (https://cesuprede.intranet.bb.com.br/scap/#/cadastro) para o Cesup Plataforma avaliar a viabilidade do atendimento, bem como realizar os estudos e orçamentos correspondentes."}, {"id": 412, "categoria": "CIVIL", "tipo": "", "tag": "#SCAP", "texto": "Prezados,\nCarenagem nova não é item contratual de carro oficina. \nOrientamos cadastrar solicitação ao CESUP Plataforma pelo aplicativo SCAP: <https://cesuprede.intranet.bb.com.br/demandas/cadastro/>"}, {"id": 422, "categoria": "CIVIL", "tipo": "", "tag": "#SCAP", "texto": " Prezados,\nInformamos que para pedido de adequação de layout (neste caso e conforme informado pela dependência: retirada de guiche de caixa, alteração de acesso à tesouraria e serviços correlatos), devem ser submetidos ao CESUP Plataforma.\nO contato e o pedido pode ser feito via email ou registrando um chamado no aplicativo \"Scap\": \nhttps://cesuprede.intranet.bb.com.br/demandas/cadastro/\ncesup.platbelem.pa@bb.com.br\n "}, {"id": 526, "categoria": "GERAL", "tipo": "Retorno ao fornecedor", "tag": "#scanner", "texto": "Prezado fornecedor. \n\nPara autorização de novo cabeamento é necessário apresentação de relatório do penta scanner.\n\nFavor desenhar o caminho do cabo no CAD anexado na aba documentos."}, {"id": 601, "categoria": "GERAL", "tipo": "Encerrada pelo Patrimônio Engenharia", "tag": "#saldo", "texto": " Sr. Gerente,\n\nO contrato de carro oficina da região está atualmente sem saldo disponível. A equipe de contratações está envidando esforços para contratar uma nova empresa mas o atendimento neste período ficará prejudicado.\n\nComo alternativa a serviços necessários e urgentes, orientamos buscar profissional ou empresa local que possa atender a este serviço e pagamento via CDA-Pequeno vulto.\n\nOutra opção é abertura de chamado no ZÁPIDO, conforme IN 328-1-16: Interface Digital para a Contratação de Pequenas Despesas de Pronta Entrega e Pagamento de Manutenção Predial - Zápido, disponível no na Plataforma BB 3.0 - Negócios - Administrativo - manutenção - Zápido "}, {"id": 659, "categoria": "ELÉTRICA", "tipo": "", "tag": "#Sala Online", "texto": "Encerramos,\n\nOrganização de sala online é atribuição exclusiva da BBTS. Favor abrir chamado via Plataforma BB -> Administrativo. Selecione Manutenção -> Rede Lógica -> Insira um número para contato -> Reorganização de Sala Online. "}, {"id": 252, "categoria": "CIVIL", "tipo": "", "tag": "#SAA", "texto": "     SAA - Porta de Acesso corredor de abastecimento dos TAAs\n\nIN 416 item 10.1.2.2. Em dependências que não contam com serviços terceirizados (abastecimentos de TAA ou recolhimento de envelopes), seu uso é vedado e a porta deve ser lacrada, por meio da instalação de anteparo pelo lado interno, de forma a impossibilitar sua abertura. As chaves (inclusive cópias) devem ser guardadas em cofre da dependência, e caso a unidade volte a dispor do abastecimento terceirizado, o anteparo deve ser retirado.           "}, {"id": 505, "categoria": "GERAL", "tipo": "DEVOLVIDO FORNECEDOR", "tag": "#responsaveltecnico", "texto": "AO RESPONSÁVEL TÉCNICO -  ENGENHEIRO ELETRICISTA - JACKSON ROSA DE MELLO - CREA - 192828 - CPF: 069.700.336-19\n\nRESPONDER COM SUA CHAVE.\n\nPrezado fornecedor, foram verificadas irregularidades/falta de qualidade na prestação de seus serviços conforme segue: \n\n- Incapacidade técnica para a execução do item 19.51 do contrato.\n\n O prazo máximo para a solução dos problemas apontados é de até 48 horas a contar deste comunicado, sob pena de aplicação das sanções administrativas previstas em contrato. \n\n#48h"}, {"id": 597, "categoria": "GERAL", "tipo": "Retorno ao fornecedor", "tag": "#repac", "texto": "Prezados, \n\nO atendimento do contrato não está vinculado à repactuação. \n\nQuando essa for concluída, será retroativa aos atendimentos (RATs) concluídos.\n\nO não atendimento das OS implicará nas sanções e multas previstas no contrato vigente."}, {"id": 608, "categoria": "ATENDIMENTO", "tipo": "Indeferida", "tag": "#renap", "texto": " Sr. Gerente,\n\nOs projetos Conectividade, NCD e RENAP que tratam da instalação de fibra óptica nas dependências, são geridos pela DITEC, as OS referentes a esses projetos são abertas de forma massificada. Caso a operadora de telefonia necessite de algum serviço relacionado à infraestrutura, a mesma deve declinar da instalação e comunicar a necessidade diretamente para DITEC. "}, {"id": 390, "categoria": "CIVIL", "tipo": "Retorno ao fornecedor", "tag": "#relatorioirregular", "texto": "Prezado fornecedor, foram verificadas irregularidades/falta de qualidade na prestação de seus serviços conforme segue:\n\nConforme conversado com o Responsável Técnico XXX, o material técnico dele ser assinado pelo Responsável técnico habilitado junto ao Banco.\n(elencar os problemas identificados pela Engenharia)\nEXEMPLO:\nRefazer relatório técnico, memorial de cálculo e orçamento. Efetuar o levantamento da origem das infiltrações/patologias e propor as soluções técnicas para correção dos problemas e manutenção preventiva do imóvel.\n\nRever os serviços para execução da substituição do piso da sala do autoatendimento condizente com as especificações do contrato/composições de serviços.  Observa-se irregularidade e sobreposição de serviços.\n\nReitero que o Fornecedor não apresentou informações da cobertura na OS de manutenção preventiva e nem a situação do piso do autoatendimento, portanto não deve ser pago novo chamado e deslocamento.\n\nSolicitamos providências imediatas dessa Contratada para a correção das irregularidades acima elencadas.\n \nO prazo máximo para a solução dos problemas apontados é de até 48 horas a contar deste comunicado, sob pena de aplicação das sanções administrativas previstas em contrato. #48h "}, {"id": 532, "categoria": "GERAL", "tipo": "Relatório", "tag": "#relatorio", "texto": "Prezado fornecedor, foram verificadas irregularidades/falta de qualidade na elaboração do relatório conforme segue:\n\n- Elaborar relatório em PDF com função CTRL +F ATIVA.\n- Preencher no relatório o número do item do contrato relacionado à foto com justificativa. \n- Indicar o quantitativo \n- Em caso de parte variável elaborar croqui e anexar próximo a foto em questão. Exemplo: \n\nItem - XX.XX - NOME DO ITEM - Quantidade : XX UN - Justificativa: xxxxxxxxxxxxxxx \n\nSolicitamos providências imediatas dessa Contratada para a correção das irregularidades acima elencadas. \n\nO prazo máximo para a solução dos problemas apontados é de até 48 horas a contar deste comunicado, sob pena de aplicação das sanções administrativas previstas em contrato. #48h "}, {"id": 537, "categoria": "GERAL", "tipo": "relatorio", "tag": "#relatorio", "texto": "\"Prezado fornecedor,\n\n Foram verificadas irregularidades/falta de qualidade na prestação de seus serviços conforme segue:\n \n(texto da irregularidade/falta de qualidade constatada pelo 2º nível).\n \nSolicitamos providências imediatas dessa Contratada para a correção das irregularidades acima elencadas.\n \nO prazo máximo para a solução dos problemas apontados é de até 48 h a contar deste comunicado, sob pena de aplicação das sanções administrativas previstas em contrato.\n \nA ausência de registros e/ou permanência das irregularidades reportadas até o prazo concedido (48h) ensejará o \"ENCERRAMENTO AUTOMÁTICO\" desta OS e o direcionamento para aplicação das sanções cabíveis por INEXECUÇÃO.\" \n \n #48h \n"}, {"id": 642, "categoria": "GERAL", "tipo": "#rede", "tag": "#rede", "texto": "- Selecionar a letra do drive e digitar o endereço:\n\nL – Projetos                     \\INTRABB.BB.COM.BRSJP01$BB9101ENG1PUBLICO$\n\nL – Manutenção              \\INTRABB.BB.COM.BRSJP01$BB9101ENG2PUBLICO$\n\nOu                                     \\10.105.40.108_x0008_b9101eng2$publico\n\nM                         \\INTRABB.BB.COM.BRSJP01$BB9101PUBLICO$\n\nOu                       \\10.105.40.108_x0008_b9101$publico\n\n- Para conectar será pedido o usuário da rede:\n\nDigitar                Usuário:    Intrabbfxxxxxxx\n\nSenha:       da Intrabb\n\nPronto! Será possível acessar os arquivos sem a conexão com a máquina do Banco"}, {"id": 533, "categoria": "ELÉTRICA", "tipo": "Encerrada", "tag": "#Ramal", "texto": "Prezados,\n\n- O carro oficina não presta este tipo de serviço. O carro é responsável pela infraestrutura de cabeamento telefônico, caso tenha ocorrido algum problema na infraestrutura, rompimento/furto de cabos, favor reabrir OS para carro oficina;\n- Problemas na sala online, são de atribuição exclusiva da BBTS;\n- Para problema com a telefonia, o chamado deve ser aberto via Suporte Técnico da Plataforma BB. Esta solicitação deve ser realizada via Plataforma BB, clicar na lupa (canto superior direito): \"Suporte técnico e Novo BB Resolve\" -> Buscar no Suporte Técnico -> Busque a palavra \"Inoperante\" -> Encontre o modelo -> Clicar em \"Leia mais\" e depois em \"Preciso de Suporte técnico\"."}, {"id": 560, "categoria": "CIVIL", "tipo": "PROTETOR DE ACRÍLICO", "tag": "#PROTETOR DE ACRÍLICO", "texto": "Conforme Orientações da DISEC para COVID 19 - https://disec.intranet.bb.com.br/coronavirus/exibir?pCdCat=60\n\nA contratação deve ser feita localmente, pela dependência, observando as especificações contidas aqui, desenvolvidas tanto para os padrões de ambiência 98, 2.0 e Estilo. Quanto ao mobiliário de bancos incorporados, o anteparo poderá ser utilizado com a possibilidade da realização de ajustes que se fizerem necessários, tendo como base o padrão definido. As especificações indicadas são iguais às definidas para os guichês de caixa e o anteparo tem como objetivo proteger o espaço da interlocução e não isolar o funcionário.\n Fica a Dica: Utilize o Zápido e ganhe tempo.\nVeja como fazer:\nPara aquisição e pagamento, deverão ser observados os procedimentos para compra de pequenas despesas de pronta entrega e pagamento (IN 1154-1.6). O valor unitário de referência para este item é de R$ 300,00, admitindo-se, em casos onde comprovadamente não seja possível a aquisição por preço semelhante, o valor máximo de R$ 500,00/peça. \nObs.: A aquisição e o pagamento devem ocorrer, impreterivelmente, até 30 junho de 2021, em função de alocação orçamentária.\nComo em todas as contratações, as dependências devem observar a melhor alternativa dentre as apresentadas e envidar esforços para negociação da melhor oferta junto ao fornecedor.\nNa especificação técnica do anteparo há opções de materiais, como o poliestireno (PS) cristal (incolor), que são mais acessíveis ao mercado, representando um melhor custo x benefício para a aquisição.\nConverse com o fornecedor e verifique o tipo de documento fiscal que irá emitir, pois há tributação específica para o caso de aquisição de peças e outra para a realização do serviço de instalação. Não é possível o pagamento de notas que contenham ambos os itens (NF única de prestação de serviços com emprego de material).\n\nProcedimentos para pagamento:\na) Caso o fornecedor emita uma nota fiscal de venda de material, utilize o evento CDA 4242 para pagamento.\nNeste caso, a incidência de impostos federais para pagamento a pessoa jurídica PJ é de 5,85%\nb) Já se o fornecedor for emitir uma nota fiscal de prestação de serviços, utilize o evento CDA 4247.\nNeste caso, a incidência de impostos federais para pagamento a pessoa jurídica é de 9,45%.\n"}, {"id": 513, "categoria": "GERAL", "tipo": "Encerrada pelo CESUP PATRIMÔNIO", "tag": "#projetomassificado", "texto": "#NAT. ENCAMINHAR PARA #PAD.\n\nO carro oficina foi acionado, no entanto, não atendeu a OS.\n\nPara condução do projeto massificado aguardar início de um novo contrato e abrir nova OS."}, {"id": 657, "categoria": "ELÉTRICA", "tipo": "", "tag": "#projeto", "texto": "Segue anexo o projeto que temos disponível."}, {"id": 21, "categoria": "ELÉTRICA", "tipo": "Orçamento Aprovado", "tag": "#Preventiva", "texto": "Relatório e orçamento analisados.\n\nAlguns itens foram indeferidos pois não foi comprovada a necessidade para as intervenções propostas, de acordo com o relatório. \nQuantitativos também podem ter sido ajustados à necessidade para as intervenções propostas/devidas, de acordo com a comprovação verificada no relatório. \nFrisamos que a falta de comprovação de serviços necessários à manutenção da dependência não poderá trazer prejuízos a esta, sob pena de retorno ao imóvel e complementação dos serviços sem ônus ao banco.\n\nOrçamento deferido, favor proceder à execução do serviço.      "}, {"id": 651, "categoria": "ELÉTRICA", "tipo": "", "tag": "#Preventiva", "texto": "Necessidade do item não foi evidenciada nem justificada no relatório técnico fotográfico"}, {"id": 656, "categoria": "ELÉTRICA", "tipo": "", "tag": "#preventiva", "texto": "Os itens de Montagem e Desmontagem de estação de trabalho (13.5 e 13.9) já contemplam mão de obra para infraestrutura lógica e elétrica."}, {"id": 530, "categoria": "ELÉTRICA", "tipo": "Encaminhado para CESUP Plataforma Jurisdicionante", "tag": "#PPCI", "texto": "Prezados,\n\nEncaminhamos para análise e condução, após análise de segundo nível verificamos a necessidade de adequação nas instalações de prevenção e combate a incêndio.\n\nConforme IN 327-1\n1.4.3.1. O Cesup Rede/Plataforma é responsável por conduzir, assessorar e acompanhar o desenvolvimento dos projetos dos seguintes eventos: \n1.4.3.1.5. Adequações em instalações de prevenção e combate à incêndios - PPCI, independente do valor.\n\n\n"}, {"id": 529, "categoria": "ELÉTRICA", "tipo": "Ponto variável", "tag": "#Ponto ", "texto": "Substituído pelo item 19.4 - Para circuitos monofásicos ou bifásicos o item correto é o 19.4. O item 19.2 somente é utilizado para circuitos elétricos trifásicos.\n"}, {"id": 590, "categoria": "ATENDIMENTO", "tipo": "Orç. Aprov. Eng. Plataforma", "tag": "#plataforma", "texto": "Sr. Fornecedor, execução do(s) serviço(s) autorizada pelo Cesup Plataforma XXXXX. - Engenharia, assessor(a) XXXXX. Fazer constar no RAT e na planilha de faturamento:\n#plataforma\n#projeto #XXXXX (equipe de atendimento: alterar o projeto conforme cada caso)\n#agrupamento XXXXX (equipe de atendimento: informar o agrupamento. Caso inexistente, suprimir essa linha no acionamento)\n**** NÃO REALIZAR ITENS NÃO CONTRATUAIS ****\nEsclarecemos que o pagamento do RAT se dará apenas após o registro da conformidade pelo Cesup Plataforma."}, {"id": 540, "categoria": "CIVIL", "tipo": "Placas Aereas ", "tag": "#placas aereas", "texto": "Trata-se de item não contratual para atendimento pelo contrato de carro oficina. \n\nPara Solicitar Sinalização Interna acesse a loja virtual pelo caminho: Plataforma BB>Administrativo>Suprimentos> Loja Virtual> Solicitar Produtos e Serviços, utilizando PBMS genérico para sinalização 99.05.020.70002. \n\nNo campo justificativa, informar: Nome e numero da configuração desejada, conforme especificação da IN:323. "}, {"id": 660, "categoria": "CIVIL", "tipo": "Corretiva/Preventiva", "tag": "#pintura #fachada #altura", "texto": "Prezados,\n\nConforme NR 18 – Condições e Meio Ambiente de Trabalho na Indústria da Construção – Item 18.15.2.4 – As montagens de andaimes dos tipos fachadeiros, suspensos e em balanço devem ser precedidas de projeto elaborado por profissional legalmente habilitado, Item 18.15.11 – Os projetos de andaimes do tipo fachadeiro, suspensos e em balanço devem ser acompanhados pela respectiva Anotação de Responsabilidade Técnica e Item 18.15.18 - As torres de andaimes não podem exceder, em altura, quatro vezes a menor dimensão da base de apoio, quando não estaiadas.\n\nVisto itens acima apresentados, informamos que a execução não poderá ocorrer via contrato de carro oficina pois a altura da(s) fachada(s) excede(m) o limite vide item 18.15.18 bem como não constam itens em contrato que contemplem a emissão de ART para projetos de andaimes do tipo fachadeiro bem como a apresentação de projeto elaborado por profissional legalmente habilitado, estando assim em desacordo ao solicitado na NR 18.\n\nInstruímos proceder com abertura de SCAP (Intranet BB > Portal da Disec > Scap) para análise e condução via Cesup Plataforma Jurisdicionante.\n"}, {"id": 515, "categoria": "ELÉTRICA", "tipo": "Preventiva", "tag": "#Pintura", "texto": "O item de pintura já remunera os serviços de recortes necessários."}, {"id": 667, "categoria": "ELÉTRICA", "tipo": "", "tag": "#PF", "texto": "Encerramos,\n\nA USI e a Disec (Engenharia, Relacionamento e Suprimentos de Bens) estão alinhando a melhor forma de atender as demandas de Cofres e Caixas de Armas, além de outras adequações para atender o Plano de Segurança conforme a nova Portaria da PF."}, {"id": 589, "categoria": "ATENDIMENTO", "tipo": "Orç. Aprov. Eng. Patrimônio", "tag": "#patrimônio", "texto": " Sr. Fornecedor, serviço (s) autorizado(s) pelo Cesup Patrimônio PR - Engenharia, assessor(a) XXXXX no valor de R$ XXXXX. Fazer constar no RAT e na planilha de faturamento:\n#patrimonio\n#projeto #manutencao\n**** NÃO REALIZAR ITENS NÃO CONTRATUAIS **** "}, {"id": 615, "categoria": "ATENDIMENTO", "tipo": "Padrão", "tag": "#Patrimonio", "texto": "Prezados,\n\nConforme IN 328-1:\n\n7.1.9.2. Cabe ao Cesup Patrimônio/Manutenção Atendimento as atividades relativas ao atendimento dos contratos de Carro Oficina em primeiro nível e compreende: \n\n      7.1.9.2.5. Monitorar prazos e tempos de atendimento; "}, {"id": 599, "categoria": "ATENDIMENTO", "tipo": "PAD orientada", "tag": "#padorientada", "texto": " Empresa não realizou atendimento e a OS será encaminhada para PAD.\n\nOrientamos a dependência a utilizar alternativamente o Zápido e os eventos CDA de Pequenas despesas de Pronta entrega e Pagamento, conforme IN-1154 (item de Contratação Direta).\nPoderá ser utilizado os eventos CDA 3395 para mão de Obra e 3465 para Material\n\nConsultar a IN-1154 para confirmação dos eventos.  "}, {"id": 486, "categoria": "GERAL", "tipo": "Observação", "tag": "#orientaçãoagência", "texto": " A agência\n\nPrezados, para a efetividade da intervenção, os serviços deverão ser fiscalizados durante a execução, antes da assinatura da RAT, incluindo, na mesma, observações que achar pertinentes.\nPeço que, dentro do possível, um funcionário designado da agência tire fotos da execução, observando materiais instalados e retirados. \nEssas fotos poderão ser anexadas na aba documentos nesta OS.\nE se tiver dúvidas, registre observações nesta OS. "}, {"id": 512, "categoria": "ELÉTRICA", "tipo": "Retorno ao suprimentos", "tag": "#orçamento", "texto": " Autorizada manutenção de pontos. Caso a solução exija intervenções de maior complexidade (ex.: pontos novos com troca de cabeamento, tubulação, quebra de piso/parede, etc), apresentar relatório técnico fotográfico, croquis e orçamento para análise e autorização.\n "}, {"id": 553, "categoria": "ELÉTRICA", "tipo": "Retorno ao suprimentos", "tag": "#orçamento", "texto": "Favor acionar o fornecedor para confecção de relatório técnico fotográfico e orçamento para análise e autorização dos serviços.  "}, {"id": 596, "categoria": "ATENDIMENTO", "tipo": "Pedido de Orçamento", "tag": "#orcamento", "texto": "   Sr. fornecedor: a pedido do setor de engenharia do Cesup Patrimônio PR, favor apresentar orçamento nos padrões exigidos (ORÇAMENTO + RELATÓRIO FOTOGRÁFICO + CROQUI), incluindo o orçamento na respectiva aba \"Orçamento\" e o relatório fotográfico na aba \"Documentos\". Fazer constar no RAT e na planilha de faturamento:\n#projeto #orcamento\n#patrimônio\n "}, {"id": 501, "categoria": "ELÉTRICA", "tipo": "Orçamento Aprovado", "tag": "#orçamento", "texto": "Relatório/Orçamento analisados e aprovados.\n\nFavor proceder à execução do serviço."}, {"id": 646, "categoria": "ELÉTRICA", "tipo": "Subestação", "tag": "#NR10 #reciclagem", "texto": "Deve ser realizado um treinamento de reciclagem bienal e sempre que ocorrer\nalguma das situações a seguir:\na) troca de função ou mudança de empresa;\nb) retorno de afastamento ao trabalho ou inatividade, por período superior a três meses;\nc) modificações significativas nas instalações elétricas ou troca de métodos, processos e\norganização do trabalho."}, {"id": 676, "categoria": "ATENDIMENTO", "tipo": "#subestação", "tag": "#NR10", "texto": "IN-328\n\n7.3.7.3.2 É vedada a contratação de serviços de manutenção de subestação, de qualquer natureza, pela própria dependência, inclusive com verba de pequeno vulto. Referidos serviços somente poderão ser contratados pelo Cesup Projetos e Manutenção/Manutenção Engenharia, desde que fiscalizados pelo Cesup Rede São Paulo e Cesup Rede Brasília ou por CDA no fluxo de Engenheiro Presente. "}, {"id": 629, "categoria": "ELÉTRICA", "tipo": "", "tag": "#nobreak", "texto": "Prezados\n\n- Antes de requisitar troca de nobreak é necessário solicitar manutenção via BBTS (Plataforma 3.0).\n- Em caso de necessidade de substituição, a BBTS emitirá laudo de condenação e após análise do laudo será solicitada compra do item (IN 336).\n- Para avaliação de acréscimo de equipamento a dependência deve abrir uma solicitação via SCAP <https://cesuprede.intranet.bb.com.br/demandas/cadastro>, na abertura deve informar a quantidade necessária e onde cada equipamento será utilizado."}, {"id": 650, "categoria": "ELÉTRICA", "tipo": "BBTS", "tag": "#nobreak", "texto": "Laudo indeferido. \nNão há fotos da data de fabricação do banco de bateria, número de bem ou indicação de problemas no painel do nobreak."}, {"id": 519, "categoria": "GERAL", "tipo": "Encerrada pelo CESUP Patrimonio", "tag": "#NAT", "texto": " Ordem de Serviço não atendida. #NAT \nEncerramos esta OS para possibilitar a instauração de processo administrativo contra o Fornecedor. #PAD\n\n- A dependência poderá realizar contratação direta de fornecedores locais, ou de cidades maiores da região, via pequenas despesas de pronta entrega e pagamento (IN 1154);\n- Informações sobre os eventos CDA que devem ser utilizados estão disponíveis na IN 1154 item 6.1.1.2.1.1;\n- Conforme IN 1154. Separar as despesas material e mão de obra  = Imóvel Próprio 3392 (mão de obra) e 3462 (material) // Imóvel Terceiro 3395 (mão de obra) e 3465 (material);\n- Citar essa ordem de serviço nas observações do CDA, informando que o serviço não foi atendido pelo carro oficina.\n\n\n\n        "}, {"id": 520, "categoria": "GERAL", "tipo": "Encerrada pelo CESUP Patrimonio", "tag": "#NAT", "texto": " Ordem de Serviço não atendida. #NAT \nEncerramos esta OS para possibilitar a instauração de processo administrativo contra o Fornecedor. #PAD\n\n- A dependência poderá abrir uma nova OS para 2ª tentativa de atendimento, ou poderá realizar contratação direta de fornecedores locais via pequenas despesas de pronta entrega e pagamento (IN 1154) ou abertura de chamado no ZÁPIDO, conforme IN 328-1-16: Interface Digital para a Contratação de Pequenas Despesas de Pronta Entrega e Pagamento de Manutenção Predial - Zápido, disponível no na Plataforma BB 3.0 - Negócios - Administrativo - manutenção - Zápido.\n\n- Informações sobre os eventos CDA que devem ser utilizados estão disponíveis na IN 1154 item 6.1.1.2.1.1\n\n      "}, {"id": 521, "categoria": "GERAL", "tipo": "Devolvida para Dependencia", "tag": "#NAT", "texto": "Ordem de Serviço não atendida. #NAT \n\n- Solicitamos incluir fotos (aba documentos) dos serviços/ambientes que necessitarem do auxílio desta engenharia para a execução do serviço. Sabendo que este atendimento alternativo será através  de contratação direta de fornecedores locais via pequenas despesas de pronta entrega e pagamento (IN 1154).  "}, {"id": 522, "categoria": "GERAL", "tipo": "Encerrada pelo CESUP Patrimonio", "tag": "#NAT", "texto": " **** Lembrar de cadastrar a OS no portal de atendimento (controle NAT) ****\n\n Ordem de Serviço não atendida. #NAT \nEncerramos esta OS para possibilitar a instauração de processo administrativo contra o Fornecedor. #PAD\n\n- Este CESUP Patrimônio/Atendimento do Carro Oficina buscará orçamento para contratação direta de fornecedores locais via pequenas despesas de pronta entrega e pagamento (IN 1154). Uma vez obtido o orçamento, entraremos em contato com esta dependência por email para obter a concordância do gestor dos valores prospectados.\n\n\n  "}, {"id": 604, "categoria": "ATENDIMENTO", "tipo": "Dependência Informa Inexecução - Envio 2º nível", "tag": "#nat", "texto": " Cliente informa que não houve atendimento pelo carro oficina. Segue para análise.   "}, {"id": 653, "categoria": "GERAL", "tipo": "Encerrada pelo CESUP Patrimonio", "tag": "#NAT", "texto": "Ordem de Serviço não atendida. #NAT\nEncerramos esta OS para possibilitar a instauração de processo administrativo contra o Fornecedor. #PAD\n\nDemandas que alterem o layout/configurações atuais da dependência devem ser solicitada através do SCAP (https://cesuprede.intranet.bb.com.br/scap/#/cadastro) para o Cesup Plataforma avaliar a viabilidade do atendimento, bem como realizar os estudos e orçamentos correspondentes."}, {"id": 508, "categoria": "GERAL", "tipo": "Observacao Interna", "tag": "#NAT", "texto": "  Prezados, Tendo em vista o não atendimento da OS pelo carro oficina, buscamos atendimento alternativo para contratação via CDA (despesa pequeno vulto). \n\nEncaminhamos orçamento para apreciação.\n\nAguardamos manifestação e nos colocamos à disposição. \n"}, {"id": 298, "categoria": "CIVIL", "tipo": "", "tag": "#nao conformidade", "texto": "  \nLembrar que temos o texto padrão para retorno das OS ao Fornecedor para correção/ajuste dos serviços com a marcação #48h (marcação a ser incluída ao final do texto para viabilizar o acompanhamento).\n\n-------------------------------------------------------------------------------------------------------------------------------------\n\"Prezado fornecedor, foram verificadas irregularidades/falta de qualidade na prestação de seus serviços conforme segue:\n \n(texto da irregularidade/falta de qualidade constatada pelo 2º nível).\n \nSolicitamos providências imediatas dessa Contratada para a correção das irregularidades acima elencadas.\n \nO prazo máximo para a solução dos problemas apontados é de até 48 horas a contar deste comunicado, sob pena de aplicação das sanções administrativas previstas em contrato.\n \n#48h (marcação a ser incluída ao final do texto para viabilizar o acompanhamento)\n   "}, {"id": 491, "categoria": "ELÉTRICA", "tipo": "MASSIFICADA", "tag": "#MEDIDOR", "texto": " Serviço padrão :\n1)\tEfetuar instalação um ponto elétrico de tomada padrão(3 pinos, 2P+t) acima do quadro geral de baixa tensão. Derivar circuito do próprio quadro ou da tomada mais próxima.\n\n\nQuando o quadro elétrico for embutido:\n1)\tO medidor pode ficar na lateral ou em cima, tomando cuidado para não danificar os cabos da rede que normalmente vem de cima do quadro elétrico. Neste caso o carro oficina deverá abrir um buraco na parede, passar o eletroduto e deixar um conduíte com espaço para instalação dos TCs do dispositivo e a tomada para alimentação. Haja visto normalmente os cabos de alimentação virem pela parte de cima, o carro oficina terá que quebrar a parede LATERALMENTE para abrir caminho para colocação da infraestrutura. A empresa que irá instalar o dispositivo de análise de energia irá instalar os TC(para medição da corrente), conectar o dispositivo na tomada(alimentação) e fixar o medidor na parede. \n\n\nInstalação do dispositivo para análise da energia é constituído de das etapas:\n1)\tCarro Oficina faz a infra necessária. Para quadros não-embutidos faz a derivação acima do quadro ou na lateral. Quadros embutidos será necessário quebrar a parede. Deixa a infra pronta para a empresa que irá instalar o equipamento de medição.\n2)\tA empresa instala o Transformador de Corrente(dispositivo que faz a leitura da corrente que está indo para o quadro elétrico), liga o equipamento na tomada e fixa o equipamento no local.\n "}, {"id": 493, "categoria": "ELÉTRICA", "tipo": "MASSIFICADA", "tag": "#MEDIDOR", "texto": "  Proceder à instalação da infra necessária para instalação do medidor.\n\nO medidor poderá ficar na lateral ou em cima, tomando cuidado para não danificar os cabos da rede que normalmente vem de cima do quadro elétrico. \nNeste caso o carro oficina deverá abrir um buraco na parede, passar o eletroduto e deixar um conduíte com espaço para instalação dos TCs do dispositivo e sua tomada de alimentação.\n Haja visto normalmente os cabos de alimentação virem pela parte de cima, o carro oficina terá que quebrar a parede LATERALMENTE para abrir caminho para colocação da infraestrutura.\n A empresa que irá instalar o dispositivo de análise de energia irá instalar os TC(para medição da corrente), conectar o dispositivo na tomada(alimentação) e fixar o medidor na parede. \n  "}, {"id": 598, "categoria": "ELÉTRICA", "tipo": "Retorno ao atendimento", "tag": "#massificados", "texto": "Prezados,\n\nConforme orientação dos gerentes não cabe atendimento alternativo para projetos massificados.\n\nReabrir OS ou aguardar novo contrato."}, {"id": 528, "categoria": "CIVIL", "tipo": "Mapa Tátil", "tag": "#MAPATÁTIL", "texto": "MAPA TÁTIL:                                                                                                                                                                    \n\nAntes de solicitar um Mapa Tátil (sinalização) é necessário solicitar o layout da agência ao Cesup Plataforma. Caso não possua o layout abra um Fale com o Cesup, para que sua demanda seja encaminhada ao Cesup Plataforma.\n\nCaso já possua o layout da agência registre sua solicitação no aplicativo Sislog, com o PBMS 99.05.020.070.002. Informe na solicitação que o layout está sendo encaminhado em (data) por e-mail à Bens4 (7419).  Encaminhe o layout do mapa tátil para o prefixo 7419 através do email: cesup.bens.consum@bb.com.br a/c equipe Bens4, com o nº da solicitação Sislog.\n\n \n\nSUPORTE PARA MAPA TÁTIL\n\nPara solicitar o suporte do mapa tátil grave uma solicitação no Sislog utilizando o PBMS 71 10 170 50038. Justifique seu pedido, informando trate-se de um item novo ou substituição de um existente. Caso possua alguma dúvida ou necessite entrar em contato com a Plataforma Jurisdicionante abra um Fale com o Cesup, clique no botão \"NOVA MENSAGEM\" e relate o sua dúvida ou problema para que um colega do CESUP  possa ajuda-lo."}, {"id": 541, "categoria": "CIVIL", "tipo": "Mapa Tátil", "tag": "#mapatátil", "texto": " MAPA TÁTIL\n\nPrezados, \nTrata-se de item não contratual para o carro oficina. \n\nSeguir orientações: \nO Mapa Tátil deve ser solicitado via loja virtual.\nPara solicitar acesse pelo caminho: Plataforma BB > Administrativo > Suprimentos > Loja Virtual> Solicitar Produtos e Serviços."}, {"id": 632, "categoria": "1º NIVEL", "tipo": "CORRETIVA", "tag": "#mapatátil", "texto": " Sr. Gerente, \nTrata-se de item não contratual para o carro oficina. \n\nO Mapa Tátil deve ser solicitado via loja virtual.\n\nPara solicitar acesse pelo caminho: Plataforma BB > Administrativo > Suprimentos > Loja Virtual> Solicitar Produtos e Serviços. "}, {"id": 636, "categoria": "ATENDIMENTO", "tipo": "Preventiva", "tag": "#manutponto", "texto": "Item 19.5 - apresentar imagem durante a manutenção, com a caixa de tomadas aberta e após a manutenção com a caixa montada e fixada. Somente poderão ser faturada a manutenção de pontos cujas imagens solicitadas estejam no relatório de serviços executados.\n\nItem 19.12  - A CONTRATADA, antes do Recebimento por parte da fiscalização do CESUP Patrimônio PR, deverá proceder aos testes de performance de todo o cabeamento (certificação), com vistas à comprovação da conformidade com a norma EIA/TIA 568, no que tange a continuidade, polaridade, identificação, curtocircuito, atenuação, NEXT (Near End Cross Talk – diafonia). Para isso deverá ser utilizado testador de cabos UTP categoria 5e - SCANNER, nível 2 (350 Mhz), conforme norma EIA/TIA - TSB-67.\nA CONTRATADA deve apresentar os relatórios gerados pelo aparelho, datados (coincidente com a data do teste) e rubricados pelo Responsável Técnico da CONTRATADA.\n Não serão aceitos testes por amostragem. Todos os cabos UTP deverão ser testados, na extremidade da tomada e na extremidade do painel distribuidor (bidireccionalmente).\nO relatório gerado pelo aparelho deve obrigatoriamente ser anexado a esta OS para viabilizar o faturamento.  Somente poderão ser faturada a manutenção de pontos que estejam certificados e com a identificação da tomada coincidente com o relatório do Pentascanner."}, {"id": 617, "categoria": "ATENDIMENTO", "tipo": "Padrão", "tag": "#manutenção", "texto": "Prezados,\n\nManutenção na Sinalização Externa de LED não faz parte do escopo do contrato de carro oficina, este serviço deve ser realizado pelo fornecedor dos equipamentos. Favor abrir um Fale com CESUP solicitando reparo/manutenção/garantia da Sinalização Externa de LED para os equipamentos com defeito.\n\nO letreiro desta agência foi acionado pela plataforma e está na garantia conforme contrato nº XXXXXX Fornecedor: XXXXXX."}, {"id": 565, "categoria": "ELÉTRICA", "tipo": "", "tag": "#letreiros", "texto": "Letreiros LED com contratos anteriores a 2019 não tem garantia. \n\nA manutenção deverá ser realizada pelas nossas equipes.\n\nAs data de instalação SINEX de cada prefixo e os números de contratos podem ser consultados pelo link:\n\nhttps://pxl0hosp0076.dispositivos.bb.com.br/cesup_projetos/gestaoDemandas.php\n\n "}, {"id": 607, "categoria": "ELÉTRICA", "tipo": "", "tag": "#letreiros", "texto": "  Prezados,\n\nSobre o desligamento do letreiro e do pórtico.\n\nConforme IN 329-2:\n\n1.1.9.6 Desligue a iluminação da programação visual externa juntamente com o término do funcionamento do autoatendimento.\n\nAmbos ficam ligados durante o funcionamento da SAA.\n\nO acionamento do letreiro se dá via fotocélula (sensível a luz) e permanece ligado até o final do funcionamento da SAA.\n\nAo final do atendimento da SAA o letreiro é desligado via TIMER ou CLP.\n\nSendo assim, favor confirmar se o letreiro segue funcionando conforme descrição ou não liga em momento nenhum.\n\nFavor devolver como complemento do demandante.  "}, {"id": 647, "categoria": "ATENDIMENTO", "tipo": "Sinalização Externa", "tag": "#letreiro", "texto": "Sr. Fornecedor, nas dependências onde há sinalização padrão Varejo, proceder a revitalização externa (letreiro, totem, bandeira, medalhão e pórtico) por meio de itens previstos em contrato, a fim de executar serviços, se necessários, de substituição de película, policarbonato, pintura e troca de lâmpadas nas sinalizações.\n\nNas dependências onde há sinalização padrão Estilo, proceder a revitalização da sinalização externa (letreiro, totem, bandeira, medalhão e pórtico) por meio de itens previstos em contrato, a fim de executar serviços, se necessários, de limpeza, pintura automotiva e troca de lâmpadas nas sinalizações.\n\nEspecificações padrões de letreiro, bandeira, medalhão, totem e pórtico para agências Estilo:\n- chapa metálica lisa em alumínio e=3mm, na cor ref. Pantone 7463 (azul);\n- chapa metálica perfurada em alumínio e=3mm, na cor ref. Pantone Cool Gray 6 - 100%;\n- faixa cromada em alumínio e=0,8mm, na cor ref. Pantone Cool Gray 6 - 50%;\n- faixa cromada em alumínio com banho dourado e=0,5mm, cor ref. Pantone 108 metálico.\n- pórtico em chapa metálica #16: acabamento tipo aço escovado, na cor grafite e acabamento em pintura automotiva na cor azul metalizado ref. Pantone 7463.\n\nPara as situações que forem necessárias maiores intervenções, tais como substituição de chapa metálica, deverá ser elaborado relatório fotográfico com orçamento, para análise e aprovação do Banco.\n\nNo caso de necessidades identificadas e que não são previstas em contrato, estes serviços não deverão ser executados e essa informação deverá ser registrada no campo \"Observação\" do RAT.\n\nEm caso de dúvidas, entrar em contato. Não executar serviços diferentes do pré autorizado, ou seja: limpeza, pintura automotiva, troca de lâmpadas, película e policarbonato.\n\nCondição necessária para liberação de pagamento do serviço: anexar ao RAT relatório fotográfico do \"antes\" e \"depois\" da sinalização, inclusive com as devidas metragens e fotos panorâmicas (visão geral), além das detalhadas.\n"}, {"id": 542, "categoria": "GERAL", "tipo": "", "tag": "#lei entintamento", "texto": "  Prezados, \nAcionar fornecedor para efetuar o atendimento na data e hora informado pela agência.\nUtilizar itens:\n29.21 - Ajuste de biombo, divisorias, carenagens e mobiliario em geral\txx UN \n19.5 - Ponto eletrico - Manutencao    xx\tUN\t(SOMENTE SE NECESSÁRIO).\n19.12 - Manutencao de Ponto Logico/Telefonico /alarme/cftv   xx\tUN\t(SOMENTE SE NECESSÁRIO).\n\nObs.: - A Disec nos informou sobre a demanda mandatória- Lei do entintamento, onde é previsto a substituição de TAA`s e/ou fechamento de interno de carenagem.\n           - Caso o Gerente verifique que é necessário o fechamento interno de alguma carenagem 2.0 (que houve a supressão de TAA e não será substituído), utilizar o item 2.22 - Tapume de chapa de madeira compensada, inclusive montagem ou 13.18 - Divisoria de fechamento ou tampao, conforme padrao existente (1,50 m²). \n#leientintamento "}, {"id": 618, "categoria": "ATENDIMENTO", "tipo": "Encaminhado para CESUP Plataforma Jurisdicionante", "tag": "#led", "texto": "Prezados,\n\nForam instaladas lâmpadas não previstas na IN324 nesta dependência. \nO carro oficina não possui este item no orçamento, pois a lâmpadas T5 por LED não é homologada pela DISEC.\n\nSolicitamos verificar atendimento alternativo."}, {"id": 260, "categoria": "CIVIL", "tipo": "Encaminhado para CESUP Plataforma Jurisdicionante", "tag": "#layout", "texto": "Para condução da plataforma visto se tratar de adequação luminotécnica do ambiente"}, {"id": 558, "categoria": "GERAL", "tipo": "Encaminhado para Cesup Plataforma Jurisdicionante", "tag": "#Layout", "texto": " Solicitamos análise pelo Cesup Plataforma conforme IN 328-2, subitem 4.2.2.3.3.2\n\nMotivo: Alteração de Layout   "}, {"id": 360, "categoria": "CIVIL", "tipo": "", "tag": "#lampadas", "texto": " Lampadas e reatores\nTendo em vista a grande quantidade de lâmpadas e reatores sem a comprovação por fotos de todos os itens, deferimos o pedido com a seguinte ressalva:\n- acompanhamento do técnico para teste das lâmpadas e reatores retirados, efetuar a troca apenas das peças que estejam efetivamente queimadas ou vida útil encerrada;\n- verificar correto preenchimento da RAT, apenas com os itens substituidos;\n\nPara manutenção do quadro, observar os seguintes itens:\nverificar pontos de aquecimento, verificar fixações e conexões, verificar isolamentos defeituosos, verificar as identificações dos circuitos, verificar limpeza e estado de conservação dos quadros elétricos, verificar continuidade do aterramento.\nCaso sejam diagnosticados eventuais problemas, favor apresentar orçamento e relatório (inclusive com fotos) para solução.\nNo relatório devem ser incluídas as informações:\n- Bitola do ramal de entrada;\n- Leitura das correntes em cada fase do ramal de entrada em plena carga, com todos os equipamentos ligados (principalmente os de refrigeração);\n- Leitura das tensões entre as fases e entre fase e neutro;\n- Diagnóstico sobre balanceamento das cargas.  "}, {"id": 241, "categoria": "ELÉTRICA", "tipo": "Indeferido", "tag": "#Infravermelho", "texto": " Prezados,\n\nEm consonância com o Programa de Eficiência Energética do BB, orientamos substituir as câmeras existentes por câmeras de infravermelho para dependência. O pedido deve ser efetuado pela Plataforma BB -> Negócios (canto superior direito) -> Administrativo -> Suprimentos (ícone carrinho de compras) -> Loja Virtual -> Solicitar Produtos e Serviços -> Pesquisar\n\nNome Configuração: CAMERA DOME FIXA VARIFOCAL INFRAVERMELHO\nNome Pbms: CFTV - CAMERA\nPode Solicitar: Sim\nNº Pbms: 58.36.60.190055\n\nEm caso de dúvidas para adquirir as câmeras favor abrir um Fale com CESUP. "}, {"id": 500, "categoria": "ELÉTRICA", "tipo": "Devolvida para Depdência - Maiores informações", "tag": "#informacoes", "texto": "  Prezados, \n\nFavor esclarecer se é instalação de ponto novo ou manutenção de ponto existente. \n\nCaso seja um novo ponto: \n- Especificar o equipamento que será ligado ao novo ponto;\n- Descrever o motivo (Ex: aumento na dotação de pessoal, equipamento novo, remanejo de equipamento,
