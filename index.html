<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Padrões Técnicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F3EF;
    --surface: #FFFFFF;
    --ink: #1D2630;
    --ink-soft: #5B6572;
    --ink-faint: #8A93A0;
    --line: #E3E0D8;
    --accent: #2B5F8A;
    --accent-soft: #E7EEF3;
    --danger: #A8402F;
    --danger-soft: #F5E7E3;
    --ok: #2E7D5B;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(29,38,48,0.06), 0 4px 16px rgba(29,38,48,0.05);
  }
  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  header.app-header{
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 20px 28px;
    position: sticky; top:0; z-index: 20;
  }
  .header-inner{ max-width: 1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:38px; height:38px; border-radius:8px;
    background: linear-gradient(135deg, var(--accent), #163C58);
    color:#fff; font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:13px;
    display:flex; align-items:center; justify-content:center;
    letter-spacing: -0.5px;
  }
  .brand h1{ font-size:17px; font-weight:600; margin:0; letter-spacing:-0.2px;}
  .brand p{ margin:2px 0 0; font-size:12.5px; color:var(--ink-soft); }
  .header-actions{ display:flex; gap:8px; align-items:center; }

  button{
    font-family: inherit; font-size: 13.5px; cursor:pointer;
    border-radius: 8px; border:1px solid var(--line);
    background: var(--surface); color: var(--ink);
    padding: 9px 14px; font-weight:500;
    transition: border-color .15s, background .15s, transform .1s;
  }
  button:hover{ border-color: var(--accent); }
  button:active{ transform: scale(0.97); }
  button.primary{ background: var(--accent); color:#fff; border-color: var(--accent); }
  button.primary:hover{ background:#204a6d; }
  button.danger-btn{ color: var(--danger); border-color: var(--danger-soft); }
  button.danger-btn:hover{ border-color: var(--danger); background: var(--danger-soft); }
  button.ghost{ border-color: transparent; background:transparent; }
  button.ghost:hover{ background: var(--accent-soft); border-color: transparent; }
  button:disabled{ opacity:.45; cursor:default; }
  button:disabled:hover{ border-color: var(--line); background: var(--surface); }

  main{ max-width: 1100px; margin: 0 auto; padding: 24px 28px 80px; }

  .toolbar{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:18px;
  }
  .search-box{
    flex:1 1 280px; position:relative;
  }
  .search-box input{
    width:100%; padding: 11px 14px 11px 38px; border-radius: 8px;
    border:1px solid var(--line); background:var(--surface); font-size:14px; color:var(--ink);
    font-family: inherit;
  }
  .search-box input:focus{ outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none; }
  select{
    padding: 10px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-family:inherit; font-size:13.5px;
  }
  select:focus{ outline:none; border-color:var(--accent); }

  .status-row{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
    font-size:12.5px; color:var(--ink-soft); flex-wrap:wrap; gap:8px;
  }
  .status-row .sync-info{ display:flex; align-items:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block; }
  .dot.stale{ background:#C9A227; }
  .dot.error{ background: var(--danger); }
  .dot.off{ background: var(--ink-faint); }

  .connect-banner{
    background: var(--accent-soft); border-bottom:1px solid var(--line);
  }
  .connect-banner-inner{
    max-width:1080px; margin:0 auto; padding:12px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .connect-banner-inner strong{ display:block; font-size:13.5px; color:var(--ink); }
  .connect-banner-inner > div > span{ font-size:12px; color:var(--ink-soft); max-width:60ch; display:inline-block; }
  .connect-form{ display:flex; gap:8px; flex-shrink:0; }
  .connect-form input{
    padding:9px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-family:'IBM Plex Mono', monospace; font-size:12.5px;
    width:280px;
  }
  .connect-form input:focus{ outline:none; border-color:var(--accent); }

  .conn-modal-body{ font-size:13.5px; color:var(--ink-soft); line-height:1.6; }
  .conn-modal-body ol{ padding-left:20px; margin:10px 0; }
  .conn-modal-body code{
    background:var(--accent-soft); padding:1px 6px; border-radius:4px; font-family:'IBM Plex Mono', monospace; font-size:12px;
  }
  .conn-status-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 10px;
    border-radius:20px; background:var(--accent-soft); color:var(--accent); margin-top:10px;
  }

  .grid{ display:flex; flex-direction:column; gap:10px; }

  .card{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow);
    display:flex; overflow:hidden;
  }
  .card-tab{ width:5px; flex-shrink:0; }
  .card-body{ padding:14px 16px; flex:1; min-width:0; }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .card-tags{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .id-chip{
    font-size:11.5px; padding:3px 7px; border-radius:5px; background:#F0EEE9; color:var(--ink-soft);
    font-weight:500; letter-spacing:0.3px;
  }
  .cat-chip{
    font-size:11.5px; padding:3px 8px; border-radius:5px; font-weight:600; letter-spacing:0.2px;
  }
  .tipo-chip{
    font-size:11.5px; padding:3px 8px; border-radius:5px; background:#EEF1F4; color:#3D4C5A; font-weight:500;
  }
  .tag-chip{
    font-size:11.5px; padding:3px 8px; border-radius:5px; background:#F5F0E8; color:#7A5B22; font-weight:500;
  }
  .card-actions{ display:flex; gap:4px; flex-shrink:0; }
  .icon-btn{
    border:none; background:transparent; padding:5px; border-radius:6px; color:var(--ink-faint);
  }
  .icon-btn:hover{ background:var(--accent-soft); color:var(--accent); }
  .icon-btn.del:hover{ background:var(--danger-soft); color:var(--danger); }

  .card-text{
    font-size:13.8px; color:var(--ink); white-space:pre-wrap; line-height:1.55;
  }
  .card-text.clamped{
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .expand-link{
    font-size:12.5px; color:var(--accent); background:none; border:none; padding:6px 0 0; font-weight:500;
    cursor:pointer;
  }

  .empty-state{
    text-align:center; padding: 60px 20px; color:var(--ink-soft);
  }
  .empty-state svg{ margin-bottom:14px; opacity:.5; }
  .empty-state h3{ margin:0 0 6px; color:var(--ink); font-size:16px; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(29,38,48,0.45); display:flex; align-items:flex-start;
    justify-content:center; padding: 5vh 20px; z-index:100; overflow-y:auto;
  }
  .modal{
    background:var(--surface); border-radius:14px; width:100%; max-width:640px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25); animation: modalIn .18s ease-out;
  }
  @keyframes modalIn{ from{ opacity:0; transform: translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .modal-header{ padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .modal-header h2{ font-size:16px; margin:0; font-weight:600; }
  .modal-body{ padding:20px 24px; display:flex; flex-direction:column; gap:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.4px; }
  .field input, .field textarea, .field select{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    font-family:inherit; font-size:14px; color:var(--ink); background:var(--bg);
  }
  .field textarea{ min-height:140px; resize:vertical; line-height:1.5; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--accent); background:var(--surface); }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .modal-footer{ padding:16px 24px 22px; display:flex; justify-content:flex-end; gap:10px; border-top:1px solid var(--line); }
  .field-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; }

  .confirm-box p{ font-size:14px; color:var(--ink-soft); margin:0; }
  .confirm-box .id-chip{ margin-top:8px; display:inline-block; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px; font-size:13.5px;
    box-shadow:0 8px 24px rgba(0,0,0,0.2); z-index:200; opacity:0; transition:opacity .2s, transform .2s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
  .toast.error{ background: var(--danger); }

  .loading-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:100px 20px; color:var(--ink-soft); gap:10px; }
  .spinner{ width:22px; height:22px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent); animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:#D8D4CB; border-radius:6px; }

  @media (max-width: 640px){
    main{ padding:18px 14px 60px; }
    header.app-header{ padding:16px; }
    .field-row{ flex-direction:column; }
  }
</style>

<header class="app-header">

      <button class="ghost" id="btn-export" title="Exportar para Excel">⇩ Exportar .xlsx</button>

  <div class="toolbar">

      </span>
      <input type="text" id="search-input" placeholder="Buscar por id, categoria, tipo, tag ou texto…">

<div class="toast" id="toast"></div>


<script>
// =====================================================================
// CONFIGURAÇÃO (arquivo JSON dentro deste repositório GitHub)
// GITHUB_OWNER / GITHUB_REPO / GITHUB_PATH não são segredo — identificam
// só onde os dados ficam. O TOKEN de acesso NUNCA fica escrito aqui:
// cada pessoa cola o próprio token na hora de usar, e ele fica salvo
// somente no localStorage do navegador dela. Veja o SETUP.md.
// =====================================================================
const GITHUB_OWNER  = 'COLE_AQUI_SEU_USUARIO_OU_ORGANIZACAO';
const GITHUB_REPO   = 'COLE_AQUI_O_NOME_DO_REPOSITORIO';
const GITHUB_BRANCH = 'main';
const GITHUB_PATH   = 'data/registros.json';

const GITHUB_API = 'https://api.github.com';
const TOKEN_STORAGE_KEY = 'cpt_github_token';
let currentSha = null; // sha do arquivo no GitHub, necessário para cada gravação

function repoConfigured(){
  return GITHUB_OWNER && !GITHUB_OWNER.startsWith('COLE_AQUI')
      && GITHUB_REPO && !GITHUB_REPO.startsWith('COLE_AQUI');
}

function getToken(){
  try{ return localStorage.getItem(TOKEN_STORAGE_KEY) || ''; }catch(e){ return ''; }
}
function setToken(tok){
  try{ localStorage.setItem(TOKEN_STORAGE_KEY, tok); }catch(e){}
}
function clearToken(){
  try{ localStorage.removeItem(TOKEN_STORAGE_KEY); }catch(e){}
}
function hasToken(){ return !!getToken(); }

function b64EncodeUnicode(str){
  return btoa(new TextEncoder().encode(str).reduce((s,b)=>s+String.fromCharCode(b), ''));
}
function b64DecodeUnicode(b64){
  const bin = atob(b64.replace(/\n/g, ''));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

// Leitura: funciona mesmo sem token, já que o repositório é público.
// Se houver token salvo, usamos ele mesmo assim (evita cache e dá limite
// de requisições maior).
async function ghGetFile(){
  const url = `${GITHUB_API}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}?ref=${GITHUB_BRANCH}&t=${Date.now()}`;
  const headers = { 'Accept': 'application/vnd.github+json' };
  const tok = getToken();
  if(tok) headers['Authorization'] = `Bearer ${tok}`;
  const res = await fetch(url, { headers });
  if(res.status === 404) return { records: [], sha: null }; // arquivo ainda não existe
  if(!res.ok) throw new Error(`GitHub API ${res.status}: ${(await res.json().catch(()=>({})))?.message || res.statusText}`);
  const json = await res.json();
  currentSha = json.sha;
  const text = b64DecodeUnicode(json.content);
  let records = [];
  try{ records = JSON.parse(text); }catch(e){ records = []; }
  return { records: Array.isArray(records) ? records : [], sha: json.sha };
}

// Gravação: exige token salvo localmente (é a única forma de autorizar escrita).
async function ghPutFile(records, message){
  const tok = getToken();
  if(!tok) throw new Error('Conecte seu token do GitHub para poder salvar (botão "Conectar" no topo).');
  const url = `${GITHUB_API}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`;
  const body = {
    message,
    content: b64EncodeUnicode(JSON.stringify(records, null, 2)),
    branch: GITHUB_BRANCH
  };
  if(currentSha) body.sha = currentSha;
  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${tok}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const errJson = await res.json().catch(()=>({}));
    if(res.status === 401){
      clearToken();
      updateConnectUI();
      throw new Error('Token inválido ou expirado. Conecte de novo com o botão "Conectar".');
    }
    if(res.status === 409) throw new Error('Conflito: alguém mais salvou dados enquanto você editava. Clique em Atualizar e tente de novo.');
    throw new Error(`GitHub API ${res.status}: ${errJson.message || res.statusText}`);
  }
  const json = await res.json();
  currentSha = json.content.sha;
  return true;
}

// ---------- Conexão (token local) ----------
function updateConnectUI(){
  const connected = hasToken();
  const banner = document.getElementById('connect-banner');
  const btn = document.getElementById('btn-connect');
  banner.style.display = connected ? 'none' : 'flex';
  btn.textContent = connected ? '🔓 Conectado' : '🔒 Conectar';
  btn.title = connected ? 'Clique para desconectar este navegador' : 'Conectar token do GitHub';
}

document.getElementById('btn-save-token').addEventListener('click', () => {
  const input = document.getElementById('token-input');
  const val = input.value.trim();
  if(!val){ showToast('Cole um token válido.', true); return; }
  setToken(val);
  input.value = '';
  updateConnectUI();
  showToast('Token conectado neste navegador.');
});

document.getElementById('token-input').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') document.getElementById('btn-save-token').click();
});

document.getElementById('btn-connect').addEventListener('click', () => {
  if(hasToken()){
    if(confirm('Desconectar este navegador? Você vai precisar colar o token de novo para editar.')){
      clearToken();
      updateConnectUI();
      showToast('Desconectado deste navegador.');
    }
  } else {
    document.getElementById('token-input').focus();
    document.getElementById('connect-banner').scrollIntoView({ behavior:'smooth', block:'center' });
  }
});

let allRecords = [];
let filteredRecords = [];
let expandedIds = new Set();
let isModalOpen = false;
let refreshTimer = null;

// ---------- Utilities ----------
function normalize(str){
  return (str || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, 2800);
}

function setSyncStatus(state){
  const dot = document.getElementById('sync-dot');
  const text = document.getElementById('sync-text');
  if(state === 'synced'){
    dot.className = 'dot'; text.textContent = 'Sincronizado';
  } else if(state === 'syncing'){
    dot.className = 'dot stale'; text.textContent = 'Salvando…';
  } else if(state === 'error'){
    dot.className = 'dot stale'; text.textContent = 'Erro de sincronização';
  }
}

// deterministic color for unknown categories
function hashColor(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){ hash = str.charCodeAt(i) + ((hash<<5)-hash); }
  const hue = Math.abs(hash) % 360;
  return { bg: `hsl(${hue}, 55%, 92%)`, fg: `hsl(${hue}, 55%, 30%)`, tab: `hsl(${hue}, 55%, 55%)` };
}

const KNOWN_CATS = {
  'eletrica': { bg:'#FBEFD6', fg:'#8A5A0A', tab:'#D9A404' },
  'civil': { bg:'#E7EAEE', fg:'#3F4E5E', tab:'#6B7A8F' },
  'geral': { bg:'#E1EFEA', fg:'#215A44', tab:'#3F7D6D' },
  'atendimento': { bg:'#E4EBF6', fg:'#2C4A78', tab:'#4A6FA5' },
  'acessibilidade': { bg:'#EEE6F5', fg:'#5B3B80', tab:'#8B5FBF' },
  '1o nivel': { bg:'#F2EFE6', fg:'#5B5340', tab:'#A6976F' },
};

function catStyle(categoria){
  const key = normalize(categoria).replace(/[^a-z0-9]/g, '');
  const matchKey = Object.keys(KNOWN_CATS).find(k => key.startsWith(k.replace(/[^a-z0-9]/g,'')));
  if(matchKey) return KNOWN_CATS[matchKey];
  return hashColor(normalize(categoria) || 'geral');
}

function escapeHtml(str){
  return (str || '').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}


function copyText(text, btn){
 const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();showToast("Texto copiado.");};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>showToast("Texto copiado.")).catch(fallback);} else fallback();
 if(btn){const old=btn.innerHTML;btn.innerHTML="✓";setTimeout(()=>btn.innerHTML=old,1200);}
}

// ---------- Storage (arquivo JSON no GitHub) ----------
async function persist(records){
  setSyncStatus('syncing');
  try{
    if(!repoConfigured()) throw new Error('Repositório não configurado. Edite GITHUB_OWNER/GITHUB_REPO no início do <script>.');
    await ghPutFile(records, 'Atualiza registros via Central de Padrões Técnicos');
    setSyncStatus('synced');
    return true;
  }catch(e){
    console.error(e);
    setSyncStatus('error');
    showToast('Erro ao salvar: ' + e.message, true);
    return false;
  }
}

async function initialLoad(){
  updateConnectUI();
  setSyncStatus('syncing');
  try{
    if(!repoConfigured()) throw new Error('Repositório não configurado. Edite GITHUB_OWNER/GITHUB_REPO no início do <script>.');
    const { records } = await ghGetFile();
    allRecords = records;
    setSyncStatus('synced');
  }catch(e){
    console.error(e);
    setSyncStatus('error');
    showToast('Erro ao carregar dados: ' + e.message, true);
    allRecords = [];
  }
  filteredRecords = [...allRecords];
  populateFilters(false);
  applyFilters();
}

async function silentRefresh(){ return true; }

// ---------- Filtering ----------
function populateFilters(preserveSelection){
  const catSel = document.getElementById('filter-categoria');
  const tipoSel = document.getElementById('filter-tipo');
  const prevCat = catSel.value, prevTipo = tipoSel.value;

  const cats = [...new Set(allRecords.map(r => r.categoria).filter(Boolean))].sort();
  const tipos = [...new Set(allRecords.map(r => r.tipo).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

  catSel.innerHTML = '<option value="">Todas as categorias</option>' +
    cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  tipoSel.innerHTML = '<option value="">Todos os tipos</option>' +
    tipos.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');

  if(preserveSelection){
    if(cats.includes(prevCat)) catSel.value = prevCat;
    if(tipos.includes(prevTipo)) tipoSel.value = prevTipo;
  }
}

function applyFilters(){
  const q = normalize(document.getElementById('search-input').value.trim());
  const cat = document.getElementById('filter-categoria').value;
  const tipo = document.getElementById('filter-tipo').value;

  filteredRecords = allRecords.filter(r => {
    if(cat && r.categoria !== cat) return false;
    if(tipo && r.tipo !== tipo) return false;
    if(q){
      const haystack = normalize(`${r.id} ${r.categoria} ${r.tipo} ${r.tag} ${r.texto}`);
      if(!haystack.includes(q)) return false;
    }
    return true;
  });
  render();
}

// ---------- Render ----------
function render(){
  const content = document.getElementById('content');
  const countEl = document.getElementById('result-count');
  document.getElementById('subtitle-count').textContent = `${allRecords.length} registros na base`;
  countEl.textContent = `${filteredRecords.length} de ${allRecords.length} registro${allRecords.length===1?'':'s'}`;

  if(filteredRecords.length === 0){
    content.innerHTML = `
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <h3>Nenhum registro encontrado</h3>
        <p>Ajuste a busca ou os filtros, ou cadastre um novo registro.</p>
      </div>`;
    return;
  }

  const html = filteredRecords.map(r => {
    const style = catStyle(r.categoria);
    const expanded = expandedIds.has(r.id);
    const isLong = (r.texto || '').length > 220;
    return `
      <div class="card" data-id="${r.id}">
        <div class="card-tab" style="background:${style.tab}"></div>
        <div class="card-body">
          <div class="card-top">
            <div class="card-tags">
              <span class="id-chip mono">#${escapeHtml(r.id)}</span>
              <span class="cat-chip" style="background:${style.bg}; color:${style.fg}">${escapeHtml(r.categoria || 'sem categoria')}</span>
              ${r.tipo ? `<span class="tipo-chip">${escapeHtml(r.tipo)}</span>` : ''}
              ${r.tag ? `<span class="tag-chip">${escapeHtml(r.tag)}</span>` : ''}
            </div>
            <div class="card-actions">
              <button class="icon-btn" data-action="copy" data-id="${r.id}" title="Copiar texto">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
              <button class="icon-btn" data-action="edit" data-id="${r.id}" title="Editar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
              </button>
              <button class="icon-btn del" data-action="delete" data-id="${r.id}" title="Excluir">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
              </button>
            </div>
          </div>
          <div class="card-text ${isLong && !expanded ? 'clamped' : ''}">${escapeHtml(r.texto)}</div>
          ${isLong ? `<button class="expand-link" data-action="toggle" data-id="${r.id}">${expanded ? 'ver menos' : 'ver mais'}</button>` : ''}
        </div>
      </div>`;
  }).join('');

  content.innerHTML = `<div class="grid">${html}</div>`;
}

// ---------- Modal: Add/Edit ----------
function openEditor(record){
  if(!hasToken()){
    showToast('Conecte seu token do GitHub antes de editar (botão "Conectar" no topo).', true);
    document.getElementById('connect-banner').scrollIntoView({ behavior:'smooth', block:'center' });
    document.getElementById('token-input').focus();
    return;
  }
  isModalOpen = true;
  const isNew = !record;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h2>${isNew ? 'Novo registro' : 'Editar registro #' + escapeHtml(record.id)}</h2>
        <button class="icon-btn" data-action="close" title="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field-row">
          <div class="field">
            <label>Categoria</label>
            <input type="text" id="f-categoria" value="${escapeHtml(record?.categoria || '')}" list="cat-suggestions" placeholder="Ex: ELÉTRICA">
          </div>
          <div class="field">
            <label>Tipo</label>
            <input type="text" id="f-tipo" value="${escapeHtml(record?.tipo || '')}" list="tipo-suggestions" placeholder="Ex: Instalação">
          </div>
        </div>
        <div class="field">
          <label>Tag</label>
          <input type="text" id="f-tag" value="${escapeHtml(record?.tag || '')}" placeholder="Ex: TCC">
        </div>
        <div class="field">
          <label>Texto</label>
          <textarea id="f-texto" placeholder="Texto padrão do registro…">${escapeHtml(record?.texto || '')}</textarea>
        </div>
        ${isNew ? '' : `<div class="field-hint">ID: <span class="mono">#${escapeHtml(record.id)}</span> — não editável.</div>`}
      </div>
      <div class="modal-footer">
        <button class="ghost" data-action="close">Cancelar</button>
        <button class="primary" data-action="save">${isNew ? 'Cadastrar' : 'Salvar alterações'}</button>
      </div>
    </div>
    <datalist id="cat-suggestions">${[...new Set(allRecords.map(r=>r.categoria).filter(Boolean))].map(c=>`<option value="${escapeHtml(c)}">`).join('')}</datalist>
    <datalist id="tipo-suggestions">${[...new Set(allRecords.map(r=>r.tipo).filter(Boolean))].map(t=>`<option value="${escapeHtml(t)}">`).join('')}</datalist>
  `;
  document.body.appendChild(overlay);

  function close(){ overlay.remove(); isModalOpen = false; }

  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) close();
    const action = e.target.closest('[data-action]')?.dataset.action;
    if(action === 'close') close();
    if(action === 'save') handleSave();
  });

  async function handleSave(){
    const categoria = document.getElementById('f-categoria').value.trim();
    const tipo = document.getElementById('f-tipo').value.trim();
    const tag = document.getElementById('f-tag').value.trim();
    const texto = document.getElementById('f-texto').value.trim();

    if(!categoria || !texto){
      showToast('Preencha ao menos categoria e texto.', true);
      return;
    }

    const saveBtn = overlay.querySelector('[data-action="save"]');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Salvando…';

    let nextRecords;
    if(isNew){
      const nextId = allRecords.length ? Math.max(...allRecords.map(r => Number(r.id) || 0)) + 1 : 1;
      nextRecords = [...allRecords, { id: nextId, categoria, tipo, tag, texto }];
    } else {
      nextRecords = allRecords.map(r => r.id === record.id ? { ...r, categoria, tipo, tag, texto } : r);
    }

    const ok = await persist(nextRecords);
    if(ok){
      allRecords = nextRecords;
      showToast(isNew ? 'Registro cadastrado.' : 'Alterações salvas.');
      populateFilters(true);
      applyFilters();
      close();
    } else {
      saveBtn.disabled = false;
      saveBtn.textContent = isNew ? 'Cadastrar' : 'Salvar alterações';
    }
  }
}

function openDeleteConfirm(id){
  if(!hasToken()){
    showToast('Conecte seu token do GitHub antes de excluir (botão "Conectar" no topo).', true);
    document.getElementById('connect-banner').scrollIntoView({ behavior:'smooth', block:'center' });
    document.getElementById('token-input').focus();
    return;
  }
  isModalOpen = true;
  const record = allRecords.find(r => r.id === id);
  if(!record) { isModalOpen = false; return; }
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:440px">
      <div class="modal-header"><h2>Excluir registro</h2></div>
      <div class="modal-body confirm-box">
        <p>Tem certeza que deseja excluir este registro? Essa ação não pode ser desfeita.</p>
        <span class="id-chip mono">#${escapeHtml(record.id)} · ${escapeHtml(record.categoria)}</span>
      </div>
      <div class="modal-footer">
        <button class="ghost" data-action="close">Cancelar</button>
        <button class="danger-btn" data-action="confirm-delete" style="background:var(--danger); color:#fff; border-color:var(--danger)">Excluir</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  function close(){ overlay.remove(); isModalOpen = false; }

  overlay.addEventListener('click', async (e) => {
    if(e.target === overlay) close();
    const action = e.target.closest('[data-action]')?.dataset.action;
    if(action === 'close') close();
    if(action === 'confirm-delete'){
      const btn = e.target.closest('[data-action]');
      btn.disabled = true; btn.textContent = 'Excluindo…';
      const nextRecords = allRecords.filter(r => r.id !== id);
      const ok = await persist(nextRecords);
      if(ok){
        allRecords = nextRecords;
        showToast('Registro excluído.');
        populateFilters(true);
        applyFilters();
        close();
      } else {
        btn.disabled = false; btn.textContent = 'Excluir';
      }
    }
  });
}

// ---------- Export ----------
function exportToXlsx(){
  if(typeof XLSX === 'undefined'){
    showToast('Biblioteca de exportação ainda carregando, tente novamente em instantes.', true);
    return;
  }
  const rows = allRecords.map(r => ({ id: r.id, categoria: r.categoria, tipo: r.tipo, tag: r.tag, texto: r.texto }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Planilha1');
  XLSX.writeFile(wb, 'base_conhecimento.xlsx');
}

// ---------- Events ----------
document.getElementById('search-input').addEventListener('input', applyFilters);
document.getElementById('filter-categoria').addEventListener('change', applyFilters);
document.getElementById('filter-tipo').addEventListener('change', applyFilters);
document.getElementById('btn-new').addEventListener('click', () => openEditor(null));
document.getElementById('btn-export').addEventListener('click', exportToXlsx);
document.getElementById('btn-refresh').addEventListener('click', async () => {
  setSyncStatus('syncing');
  try{
    const { records } = await ghGetFile();
    allRecords = records;
    setSyncStatus('synced');
    populateFilters(true);
    applyFilters();
    showToast('Base atualizada a partir do GitHub.');
  }catch(e){
    setSyncStatus('error');
    showToast('Erro ao atualizar: ' + e.message, true);
  }
});

document.getElementById('content').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const id = Number(btn.dataset.id);
  if(action === 'copy'){
    const record = allRecords.find(r => r.id === id);
    if(record) copyText(record.texto, btn);
  } else if(action === 'edit'){
    const record = allRecords.find(r => r.id === id);
    if(record) openEditor(record);
  } else if(action === 'delete'){
    openDeleteConfirm(id);
  } else if(action === 'toggle'){
    if(expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
    render();
  }
});

// ---------- Boot ----------
(async function boot(){
  await initialLoad();
})();
</script>
