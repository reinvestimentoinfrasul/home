ontrato de locação: 2003 1638 0001  \nSe obra da fachada foi executada pelo proprietário o mesmo deverá ser notificado para a manutenção ===> Benfeitorias Necessárias = art. 35 da lei 8.245/9."}, {"id": 355, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Indeferimos adaptações no mobiliário padronizado. Porém consultamos o SESMT para orientá-los o que seria possível fazer para melhorar as condições de trabalho do funcionário canhoto. A recomendação foi que a dependência pode solicitar teclado para canhoto, via sislog - cda - evento 56."}, {"id": 358, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Instalação de divisórias de privacidade e remanejamento de TCC"}, {"id": 104, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "", "texto": "O relatório da BBTS não traz informações suficientes. Não é possível atender ao chamado. Informações necessárias: quantidade de pontos que devem ser objeto de manutenção."}, {"id": 111, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "", "texto": "Favor informar se trata-se de criação de ponto lógico novo para o telefone ou se é instalação de aparelho.\n\nPara o segundo caso, informamos que o carro oficina não instala equipamentos."}, {"id": 371, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "OS exemplos da Aline: 190032951 / 180050597 / 190019734 / 190021038"}, {"id": 372, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Os padrões de acabamento estão normatizados na IN 739- Referências Comerciais."}, {"id": 117, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "", "texto": "Sr. Gerente,\n\nFavor confirmar informação do fornecedor.\n\nServiços de ajuste de mobiliário pode ser executado utilizando-se de mão de obra local através de CDA. Verifique na IN 1154-1.6.1.1.2.1.1 itens permitidos.\nCaso o balcão de informações esteja muito danificado, pode ser solicitada a sua substituição via SISLOG.\n\nLembramos que o custo de uma visita do carro oficina em sua dependência, mesmo que infrutífera tem o custo de R$ 579,69, portanto, para evitar despesas desnecessárias a descrição do problema na solicitação deve ser detalhada para que a melhor solução possa ser encaminhada.\n\n"}, {"id": 119, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "", "texto": "\"Prezados, …para solicitação de novas linhas telefônicas, favor solicitar pela plataforma 3.0, digitar na lupa de pesquisa: \"\"suporte técnico - registro de ocorrências\"\" e escolher:……Canal: Rede Bancárias - Agências;…Interface: Telefonia Fixa…Serviço: Escolha sua Central (INTELBRÁS)…Categoria: Linha telefônica / Fatura……Clicar em \"\"Solicitação de linha\"\" e seguir os procedimentos.\""}, {"id": 120, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "", "texto": "Sr. gerente,\n\nO fornecedor incluiu neste chamado itens não relacionados com a descrição do problema.\nSolicitamos então, verificar no relatório em anexo e confirmar a necessidade dos serviços abaixo:\n\n- Manutenção de quatro pontos elétricos - (pág. 2 do relatório)\n- Criação de três pontos elétricos - (pág 6 do relatório)\n- Ajuste de piso elevado - (pág. 14 do relatório)\n"}, {"id": 376, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Para viabilizar a análise da demanda, por gentileza disponibilizar fotos da área da intervenção (anexar na aba documentos)."}, {"id": 121, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "", "texto": "Sr. Gerente, com a falta de atendimento por parte da mantenedora, solicitamos verificar se existe prestador para estes serviços na sua cidade ou cidade próxima. Verifique em sua base de clientes PJ possíveis prestadores cujos serviços podem ser utilzados e pagos via despesa de pequeno vulto."}, {"id": 122, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "", "texto": "Orientamos a solução da execução via prestador local e pagamento por Verba de Pequenos Vultos (CDA). Orientamos a dependência orçar localmente os serviços necessários e efetuar a contratação via CDA (Eventos 099 – Mão-de-obra / 236 – Peças e Materiais) . Sugerimos a verificação dentro da própria Carteira PJ da dependência, até mesmo como forma de incentivar a economia local."}, {"id": 378, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Pedido de projetos  à plataforma (ex.: bebedouro)"}, {"id": 124, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "", "texto": "Caso falte no break em algum equipamento, solicite aquisição ou remanejamento via loja virtual na plataforma 3.0 área de trabalho da DISEC."}, {"id": 125, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "", "texto": "Solicitamos marcar no leiaute em anexo e informar quais equipamentos serão instalados naquele local."}, {"id": 126, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "", "texto": "Trata-se de substituição de lâmpadas já existentes ou nova instalação? No caso de substituição, as lâmpadas já são de LED ou haverá alteração no padrão utilizado atualmente? Favor responder e devolver a OS utilizando o status complemento dependência demandante."}, {"id": 383, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "pitura de piso: somente piso tatil\nSubstituição completa do policarbonato e adesivos do letreiro com bandeira e prisma\n29.14 - Sinalizacao externa - substituicao de policarbonato e pelicula, inclusive montagem da marca e instalacao (para medalhao, bandeira, letreiros, porticos de acesso, totens e \nsimilares)   \n29.13 - Sinalizacao externa - substituicao de pelicula (para medalhao, bandeira, letreiros, porticos de acesso, totens e similares)"}, {"id": 128, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "", "texto": "Sr. Gerente,\n\nCom a falta de atendimento por parte da contratada, solicitamos informar se o problema foi corrigido.\n\nCaso o problema seja de programação do timer, anexamos na aba documentos os manuais de programação de horário. \nCaso não seja problema somente de programação, orientamos buscar em sua cidade algum profissional que possa orçar o serviço para pagamento via CDA (programação e/ou troca do timer).\n\nNão sendo possível a correção com as opções acima, favor devolver esta mensagem para buscarmos atendimento alternativo."}, {"id": 386, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezada Ana,\nConforme conversamos hoje via telefone, o ambiente de atendimento não atendendo às Instruções Normativas (padrão 98), porém confirmo que sua dependência está no programa ambiência 900 para mudança de padrão para ambiência 2.0, motivo que encerramos esta ordem de serviço. \n\nA demanda pode ser acompanhada pelo hotsite da dirac:\nhttps://dirac.intranet.bb.com.br/ambiencia900/acompanhamento.xhtml "}, {"id": 388, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezada Kelly,\n\nConforme conversamos, orientamos abrir uma ordem de serviço via carro oficina para pedido de Levantamento e orçamento da pintura externa da agência e as demais informações necessárias para análise da demanda.\nPodemos indicar a utilização da verba ORFIX para execução do serviço de pintura externa da dependência.\nPedimos também anexar fotos para subsidiar análise.\n\nAbrir chamado do carro oficina:\nacessar Plataforma BB 3.0 / Manutenção / Solicitar\n\nAnexar fotos à ordem de serviço:\nacessar Plataforma BB 3.0 / Manutenção / consultar / Utilizar a aba \"documentos\" para inclusão das fotos.\n\n\nSobre o assunto do contrato de limpeza, já existe contrato vigente para sua dependência. É possível consultar o conteúdo do contrato na Plataforma BB 3.0 / Contratos.\n"}, {"id": 389, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezado a solicitação da referida OS trata-se de adesivo. As solicitações são feitas via SISLOG.\nHá vários tipos de placas e adesivos para sinalização e comunicação visual. Veja na IN 323-1, qual é a configuração que você precisa.\nAcredito que o adesivo/placa que sua agência precisa seja: IN 323-1 item 2.11.1.5. Placa Funções TAA_Carenagem 2.0 \n\nDê uma olhada no Guia de solicitação SINT. No Guia orienta:\n>As solicitações, obrigatoriamente, deverão ser gravadas os PBMS's abaixo:\nAgências e Unidades - utilizar o PBMS Genérico para sinalização 99.05.020.70002. Cesup Suprimentos / Plataformas - Utilizar o PBMS específicos 99.05.040.999032 Placas de Sinalização e 81.50.010.999051 Adesivos para Sinalização.\n>No campo justificativa, a dependência deve informa objetivamente:\na) o item da IN 323-1: é imprescindível a abertura da figura para visualizar a placa/adesivo pleiteada, pois existem itens que apresentam mais de um componente por figura;\nb)Nome e número da configuração específica do componente, informada na figura;\nc)Dizeres/numeração: nome da dependência, horários, numeração de guiche/mesa, modelos A, B função, etc."}, {"id": 135, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Não há legenda nas imagens para identificar a que se referem, tosas as imagens devem identificar o quadro e indicar qual o problema apresentado. Deve ser apresentado diagrama dos quadros com a indicação das medições por fase como complemento das imagens."}, {"id": 136, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "O Relatório não foi assinado pelo engenheiro eletricista responsável pela contratada."}, {"id": 138, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Sr. Fornecedor, tratando-se EXCLUSIVAMENTE de manutenção, está autorizada a execução dos serviços necessários ao atendimento da demanda limitado aos quantitativos informados até o valor máximos de R$ 4.000,00 e desde que não envolva as seguintes situações: alteração de leiaute/padrão existente; intervenção de maior complexidade e/ou que exija análise técnica; descrição do tipo de serviço/quantidade divergente; e demanda fracionada/duplicada ou pedido de garantia de serviçosjá executados em outra OS. Em qualquer desses casos ou se os serviços necessários ultrapassarem o limite de R$ 4.000,00, a OS deverá ser devolvida com as justificativas adequadas e apresentação de orçamento para análise técnica, se for o caso. Para casos de itens não contratuais, favor devolver a OS informando tal constatação."}, {"id": 394, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezado fornecedor,\nAs especificações das placas estão anexadas na aba documentos (proibido uso de celular e capacete).\nInstalar conforme altura definida na especificação e nos seguintes ambientes: Sala de autoatendimento e no atendimento.\nNa placa do proibido uso de capacete, incluir o numero da legislação vigente do Estado de Pernambuco."}, {"id": 139, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Item não atende aos requisitos do contrato. A empresa deve abster-se de utilizar este item."}, {"id": 396, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezado Humberto,\n\nConforme conversamos via telefone dias 31/07 e 06/08, informei que a Instrução Normativa 739-1 item 2.9.1.1.7.4  define que os guarda-volumes, precisam ser locados no ambiente da sala de autoatendimento, localizados antes da PGDM, em posição visível pelo sistema CFTV e pelo vigilante. Deve ser fixado no chão ou parede para evitar sua utilização como barreira ou escudo em ações delitivas.\n\nAnalisando as fotos disponibilizadas haverá dificuldade em fixar o guarda-volumes \"maior\", pois o local indicado há divisória de vidro. Sendo assim podíamos relocar o guarda-volumes \"menor\", porém será necessário garantir a visibilidade de ambos pelo sistema de CFTV e pelo Vigilante.\n\nOpção 1:\nEm minha análise sob a ótica da arquitetura o posicionamento do guarda-volumes maior está adequado e o correto seria retirar o guarda-volumes menor, pois como está instalado serve de escudo, desatendendo a IN referida.\n\nOpção 2:\nPedimos informar se há interesse em relocar o guarda-volumes \"menor\" e alterar o posicionamento  das câmeras. Em caso afirmativo, favor anexar fotos amplas de todo ambiente para que possamos visualizar o local de todas as câmeras da sala de autoatendimento para avaliação do Eng.Eletricista.\n\n\n"}, {"id": 142, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "A manutenção preventiva não prevê criação de pontos novos. O relatório de vistoria deve apresentar em imagens e descrição quais e quantos pontos necessitam manutenção."}, {"id": 398, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezado Thiago,\nIndeferimos o remanejamento do TCC via carro oficina, pois implica em mudança de layout no ambiente de caixa e no caso de sua agência é necessário instalar divisórias de privacidade padronizada - IN 322-1 item 4.2.20.\nNossa orientação é enviar email à Plataforma jurisdicionante, solicitando adequação do ambiente de caixa para instalação de divisórias de privacidade, remanejamento do TCC, remanejamento das longarinas e serviços correlatos.\n\ncesup.platspaulo.sp@bb.com.br"}, {"id": 144, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Rever quantitativos devido ao indereferimento de outros itens correlacionados"}, {"id": 402, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\n\nIndeferimos o remanejamento da mesa para o local indicado haverá problemas de acessibilidade, portanto é inviável.\nRecomendamos que a dependência solicite ao Cesup Plataforma reforma para adequação de layout conforme normativos internos e normas técnicas vigentes."}, {"id": 147, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Remoção e reinstalação de forro não deve causar danos ao material. placas de forro foram projetadas para serem removidas e reinstaladas sem necessidade de demolição. "}, {"id": 148, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Item a ser verificado após o serviço executado, apresentar junto com a RAT imagens do local onde houver necessidade de demolição (quebra e recomposição)."}, {"id": 404, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\nAUTORIZADO ATENDIMENTO EMERGENCIAL até os limites contratuais.\n\nPara serviços de maior complexidade (ex.: impermeabilização) ou itens não contratuais ou que extrapolem os limites pré autorizados, executar apenas serviços paliativos para a contenção dos riscos e apresentar relatório técnico-fotográfico com orçamento para a solução definitiva do problema.\n- O relatório técnico precisa estar subsidiados de fotos do lado interno e externo dos ambientes. As fotos devem ser amplas, todos os ângulos, de perto, de longe e de todo contexto do ambiente;\n- O relatório deve conter o memorial de cálculo dos quantitativos que subsidiaram o orçamento;\n- Apresentar croqui;\n- Atentar para a qualidade do relatório para entendimento completo da demanda."}, {"id": 150, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "A solicitação é do relatório a ser gerado com as imagens e medições realizadas nas três visitas realizadas. "}, {"id": 406, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\nAutorizamos executar os serviços e quantitativos deferidos na aba orçamento (para situação emergencial de abastecimento na dependência).\n\nOrientamos a agência efetuar a abertura do pedido de estudo de viabilidade para solução definitiva do problema relatado.\nCESUP Rede Plataforma -  Canal de registro do pedido:\nhttps://cesuprede.intranet.bb.com.br/demandas/cadastro/\n"}, {"id": 151, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "As medições de tensão e corrente, obrigatórias em uma visita técnica, trazem informações a respeito de sobrecargas e/ou possíveis causas do problema."}, {"id": 152, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "A solicitação é do relatório a ser gerado com as imagens e medições realizadas nas três visitas realizadas. Caso o técnico não tenha realizado medições, deverá sim retornar e refazer o serviço.\nAs medições de tensão e corrente, obrigatórias em uma visita técnica, trazem informações a respeito de sobrecargas e/ou possíveis causas do problema.\n"}, {"id": 408, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\nAutorizamos executar os serviços e quantitativos deferidos na aba orçamento.\n\n- Atentar para que a instalação da grade permita a movimentação de abertura da esquadria para permitir a ventilação natural. \n- Atentar para de o afastamento da parede funcione como uma \"caixa\" com a instalação da malha em todas as faces da grade.\n- Utilizar pintura cinza claro. Referências pantone 420 C ou 427 C.\n\nUtilizar verba ORFIX."}, {"id": 153, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Execução do serviço aprovado, e valores deferidos e ajustados conforme aba orçamento neste processo.\n\nAtentar para que a infraestrutura deverá ser totalmente embutida na parede e no piso até a base da mesa. \n\nCaso necessário poderá ser incluída no orçamento abertura e recomposição de alvenaria (piso e parede)."}, {"id": 409, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\nAutorizamos executar os serviços e quantitativos deferidos na aba orçamento.\n\nObs.: Ver arquivo da NBR 16537 que define as mudanças de direção para piso tátil. Utilizar as denifições em normas para executar a colagem do piso tátil definido na rota acessível existente."}, {"id": 154, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Para o  caso de infraestrutura existente:\n19.5 - Ponto eletrico - Manutencao\n\nPara o  caso de infraestrutura inexistente:\n19.3 - Ponto eletrico simples novo - Custos fixos  \n19.4 - Ponto eletrico simples novo - Custos Variaveis"}, {"id": 155, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Prezados,\n\nO serviço já foi executado?\nHouve necessidade de quebra de forro/parede para incluir estes itens?\nAnexar imagens e RAT assinada pelo responsável pela dependência para ajustarmos o orçamento."}, {"id": 156, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Não há necessidade para as intervenções propostas, de acordo com a comprovação verificada no relatório."}, {"id": 157, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Prezados,\n\nO ponto para PAE prevê instalação de quadro de telefonia e cabo CCI 50 ligados ao DG da edificação quando não há sala técnica do BB no prédio.\n\nO ponto lógico, prevê instalação de tubulação com cabo UTP, do rack até o terminal independentemente de onde este se encontra no prédio.\nPermanece a solicitação conforme autorizado."}, {"id": 413, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\nConsiderar no relatório, orçamento e memorial de cálculo somente o reparo e a recomposição das áreas danificadas. \nNão será efetuado o retrofiting do forro no âmbito do atendimento de manutenção.\n"}, {"id": 159, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Observações:\nO contratado deve observar todas as especificações de serviço de cada item para não incluir itens não devidos ou que fiquem duplicados."}, {"id": 415, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\nEncerramos esta ordem de serviço, pois nesta data não há contrato de carro oficina vigente.\nPorém informamos que está na fase final do processo de licitação (carro oficina cobertura no Estado de PI). O contrato já foi gerado pela equipe responsável no Cesup Compras e Contratações (CTR 201974215781) com previsão de assinatura para 15/10/2019.\n\nPedimos reabrir os chamados após a formalização."}, {"id": 416, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\nFavor acionar fornecedor para efetuar manutenção na elétrica e lógica para viabilizar o uso do balcão de informações da SAA e do TDS. \n> verificar as instruções da passagem de fiação pelo mobiliário conforme arquivo (anexado na aba documentos).\n> incluir fotos das fases de execução e conclusão do serviço."}, {"id": 417, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\nIndeferimos esta ordem de serviço, pois não é item contratual do carro oficina.\n\nOrientamos solicitar substituição do item: 3.14.2.5. Sinalização Externa Atacado Mini Totem Vidro ( IN 323-1 Projetos e Especificações de Sinalização e Suporte de Merchandising), pois a dependência não está com o padrão correto (ver padrão normatizado na aba \"documentos\").\n\nInformamos que enviamos email ao CESUP Suprimentos, para que eles auxiliem a dependência na solicitação de substituição do Mini Totem de Vidro  (ver email na aba \"documentos\").\n"}, {"id": 162, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "A instalação de circuito novo já contempla todos os custos desde o quadro de distribuição até a tomada."}, {"id": 418, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\nInformamos que a substituição do letreiro não é item contratual do carro oficina. Portanto encerramos esta ordem de serviço e efetuamos o pedido de instalação da sinalização externa LED 2.0  à Equipe de Projetos, que, por sua vez fará o pedido de abertura do evento PGI (para a condução da demanda) e o acionamento de Ata de Registro de Preço Sinalização Externa LED (ver email anexado na aba documentos)."}, {"id": 163, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Intervenção não deve atingir estruturas de concreto (edificação de terceiros). Deve ser utilizada infraestrutura em aço galvanizado aparente com caixas de passagem lacradas."}, {"id": 164, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Item 19.35 já contempla driver para 8 unidades de fita para carenagem."}, {"id": 420, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\nInformamos que não há contrato de carro oficina vigente para sua o estado de Rondônia. Porém a nova contratação está na fase de habilitação com previsão de formalização para 06/01/2020.\nPedimos reabrir a demanda após esta data. "}, {"id": 165, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Conforme é do conhecimento da contratada, o item 19.1 é pago pela distância entre o quadro e o ponto de entrega, contando infrastrutura e cabeamento. Portanto, a distância, já consideradas as subidas e descidas, é de 18m para cada circuito, resultando no valor de ponto elétrico variável de 20m para cada ponto. Também não foi especificada a capacidade dos disjuntores a rerem utilizados e com os dados do fabricante dos equipamentos o disjuntor necessário é de no máximo 32A, disjuntor este incluso no item 19.1."}, {"id": 421, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\nInformamos que para incremento de mobiliário, neste caso ampliação de números de guichês de caixa, devem ser submetidos à Superintendência Administrativa de Varejo.\nO contato pode ser efetuado pelo site ou fale da Super.\nhttps://portaldarede.intranet.bb.com.br/\nhttps://falecom.intranet.bb.com.br/\n"}, {"id": 166, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "O item 12.6 é para demolição de forro, a remoção e recolocação de placa para manutenção e instalação de infraestrutura já está inclusa na mão de obra dos itens dos serviços."}, {"id": 167, "categoria": "ELÉTRICA", "tipo": "Retorno ao fornecedor", "tag": "", "texto": "Todos os quantitativos e itens aprovados estão de acordo com as medições, especificações e cláusulas contraturais."}, {"id": 423, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\nInformamos que tampa para hidrante de recalque ou para caixas de inspeção não é item contratual do carro oficina.\nOrientamos a dependência executar o serviço com fornecedores locais (serralheiro) e efetuar o pagamento via CDA r-se de manutenção pura e que envolvem questões de segurança e/ou alteração de características originais. Em caso de aprovação, solicitamos a disponibilização do projeto/layout para que possamos quantificar o item ou o envio para o CESUP SUPRIM MANUTENÇÃO, que enviará para a empresa responsável pela execução dos serviços.\n3 - OS sob condução da Plataforma. Devolvemos para busca de atendimento alternativo - ARP Obras, CDA-Engenheiro Presente, etc -  visto o carro-oficina não ter atendido. \nApós ciência, devolver OS a o CESUP SUPRIMENTOS: OS #nat Não Atendida. Seguir para #PAD contra o Fornecedor.\n4 - OS para condução da Plataforma visto se tratar de adequação de Acessibilidade e ao carro-oficina não ter atendido. O mesmo sofrerá #PAD para as devidas sanções. Buscar atendimento alternativo.\n5 - Ao CESUP Plataforma, \nEncaminhamos demanda para condução dessa plataforma visto não se tratar de manutenção predial e que envolvem questões de segurança, novas instalações e/ou alteração de características originais, bem como intervenções maiores que caracterizam reforma de ID. \n6 - À Plataforma. Como não se trata de pura manutenção e sim de incremento/alteração do PPCI, a Plataforma deverá conduzir a OS realizando/aprovando orçamento e fiscalizando os serviços. As tratativas com o fornecedor do carro-oficina deverão ser realizadas pelo CESUP Rede Plataforma, sem necessidade de trânsito ou aprovação deste CESUP Patrimônio.\n7 - Encaminhamos demanda para condução dessa plataforma visto não se tratar de manutenção predial e que envolvem questões de segurança, novas instalações e/ou alteração de características originais, bem como alteração de leiaute que pode envolver questões de PPCI e Acessibilidade.\n"}, {"id": 254, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Solicitação de orçamento/relatório (utilizar parcial ou totalmente os textos de acordo com cada demanda): \nFavor acionar a contratada para fornecimento de Relatório Técnico de Vistoria e orçamento, conforme modelo padrão do BB. Em suma, o relatório deve apresentar as indicações nas fotos das medidas que originarem os quantitativos do orçamento, bem como fotos de todas as áreas de intervenção (panorâmicas e de detalhes, internas e externas), croquis e memorial de cálculo. \nEm caso de manifestações patológicas, identificar a causa e propor a respectiva solução técnica. \nSe existirem itens não contratuais para a execução dos serviços devidos, favor precificá-los no valor de mercado e encaminhar em planilha complementar.\nVale salientar que diversas OSs solicitadas na mesma data para a mesma dependência, constituirão um único CHAMADO, com direito a um único deslocamento (Agrupador). Deste modo, para pedidos de orçamento com mais de uma OS, atentar-se para a cobrança de apenas um chamado e um deslocamento, a ser efetuado num dos orçamentos preenchidos neste portal.\n"}, {"id": 255, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Aprovação de serviços de impermeabilização:\nFavor anexar as fotos de todas as etapas deste serviço de impermeabilização ao RAT e o Termo de garantia de 5 anos dos xx m² a serem executados. Tais documentos são necessários para a garantia deste serviço, conforme previsto na NBR e para arquivamento na pasta desta dependência na Engenharia do BB.\nA dependência deve assinar o RAT mediante o fornecimento dos documentos solicitados acima.\n"}];

const STORAGE_KEY = 'database';
let allRecords = [];
let filteredRecords = [];
let expandedIds = new Set();
let isModalOpen = false;
let refreshTimer = null;

// ---------- Utilities ----------
function normalize(str){
  return (str || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, 2800);
}

function setSyncStatus(state){
  const dot = document.getElementById('sync-dot');
  const text = document.getElementById('sync-text');
  if(state === 'synced'){
    dot.className = 'dot'; text.textContent = 'Sincronizado';
  } else if(state === 'syncing'){
    dot.className = 'dot stale'; text.textContent = 'Salvando…';
  } else if(state === 'error'){
    dot.className = 'dot stale'; text.textContent = 'Erro de sincronização';
  }
}

// deterministic color for unknown categories
function hashColor(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){ hash = str.charCodeAt(i) + ((hash<<5)-hash); }
  const hue = Math.abs(hash) % 360;
  return { bg: `hsl(${hue}, 55%, 92%)`, fg: `hsl(${hue}, 55%, 30%)`, tab: `hsl(${hue}, 55%, 55%)` };
}

const KNOWN_CATS = {
  'eletrica': { bg:'#FBEFD6', fg:'#8A5A0A', tab:'#D9A404' },
  'civil': { bg:'#E7EAEE', fg:'#3F4E5E', tab:'#6B7A8F' },
  'geral': { bg:'#E1EFEA', fg:'#215A44', tab:'#3F7D6D' },
  'atendimento': { bg:'#E4EBF6', fg:'#2C4A78', tab:'#4A6FA5' },
  'acessibilidade': { bg:'#EEE6F5', fg:'#5B3B80', tab:'#8B5FBF' },
  '1o nivel': { bg:'#F2EFE6', fg:'#5B5340', tab:'#A6976F' },
};

function catStyle(categoria){
  const key = normalize(categoria).replace(/[^a-z0-9]/g, '');
  const matchKey = Object.keys(KNOWN_CATS).find(k => key.startsWith(k.replace(/[^a-z0-9]/g,'')));
  if(matchKey) return KNOWN_CATS[matchKey];
  return hashColor(normalize(categoria) || 'geral');
}

function escapeHtml(str){
  return (str || '').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- Storage ----------
async function loadFromStorage(){
  try{
    const result = await window.storage.get(STORAGE_KEY, true);
    if(result && result.value){
      return JSON.parse(result.value);
    }
  }catch(e){
    console.log('Nenhum dado encontrado ainda, semeando com dados iniciais.', e);
  }
  return null;
}

async function seedStorage(){
  await window.storage.set(STORAGE_KEY, JSON.stringify(SEED_DATA), true);
  return SEED_DATA;
}

async function persist(records){
  setSyncStatus('syncing');
  try{
    const result = await window.storage.set(STORAGE_KEY, JSON.stringify(records), true);
    if(!result) throw new Error('Falha ao salvar');
    setSyncStatus('synced');
    return true;
  }catch(e){
    console.error(e);
    setSyncStatus('error');
    showToast('Não foi possível salvar as alterações. Tente novamente.', true);
    return false;
  }
}

async function initialLoad(){
  let data = await loadFromStorage();
  if(!data || !Array.isArray(data) || data.length === 0){
    data = await seedStorage();
  }
  allRecords = data;
  populateFilters();
  applyFilters();
  setSyncStatus('synced');
}

async function silentRefresh(){
  if(isModalOpen) return;
  const data = await loadFromStorage();
  if(data && Array.isArray(data)){
    allRecords = data;
    populateFilters(true);
    applyFilters();
  }
}

// ---------- Filtering ----------
function populateFilters(preserveSelection){
  const catSel = document.getElementById('filter-categoria');
  const tipoSel = document.getElementById('filter-tipo');
  const prevCat = catSel.value, prevTipo = tipoSel.value;

  const cats = [...new Set(allRecords.map(r => r.categoria).filter(Boolean))].sort();
  const tipos = [...new Set(allRecords.map(r => r.tipo).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

  catSel.innerHTML = '<option value="">Todas as categorias</option>' +
    cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  tipoSel.innerHTML = '<option value="">Todos os tipos</option>' +
    tipos.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');

  if(preserveSelection){
    if(cats.includes(prevCat)) catSel.value = prevCat;
    if(tipos.includes(prevTipo)) tipoSel.value = prevTipo;
  }
}

function applyFilters(){
  const q = normalize(document.getElementById('search-input').value.trim());
  const cat = document.getElementById('filter-categoria').value;
  const tipo = document.getElementById('filter-tipo').value;

  filteredRecords = allRecords.filter(r => {
    if(cat && r.categoria !== cat) return false;
    if(tipo && r.tipo !== tipo) return false;
    if(q){
      const haystack = normalize(`${r.id} ${r.categoria} ${r.tipo} ${r.tag} ${r.texto}`);
      if(!haystack.includes(q)) return false;
    }
    return true;
  });
  render();
}

// ---------- Render ----------
function render(){
  const content = document.getElementById('content');
  const countEl = document.getElementById('result-count');
  document.getElementById('subtitle-count').textContent = `${allRecords.length} registros na base`;
  countEl.textContent = `${filteredRecords.length} de ${allRecords.length} registro${allRecords.length===1?'':'s'}`;

  if(filteredRecords.length === 0){
    content.innerHTML = `
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <h3>Nenhum registro encontrado</h3>
        <p>Ajuste a busca ou os filtros, ou cadastre um novo registro.</p>
      </div>`;
    return;
  }

  const html = filteredRecords.map(r => {
    const style = catStyle(r.categoria);
    const expanded = expandedIds.has(r.id);
    const isLong = (r.texto || '').length > 220;
    return `
      <div class="card" data-id="${r.id}">
        <div class="card-tab" style="background:${style.tab}"></div>
        <div class="card-body">
          <div class="card-top">
            <div class="card-tags">
              <span class="id-chip mono">#${escapeHtml(r.id)}</span>
              <span class="cat-chip" style="background:${style.bg}; color:${style.fg}">${escapeHtml(r.categoria || 'sem categoria')}</span>
              ${r.tipo ? `<span class="tipo-chip">${escapeHtml(r.tipo)}</span>` : ''}
              ${r.tag ? `<span class="tag-chip">${escapeHtml(r.tag)}</span>` : ''}
            </div>
            <div class="card-actions">
              <button class="icon-btn" data-action="copy" data-id="${r.id}" title="Copiar texto">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
              <button class="icon-btn" data-action="edit" data-id="${r.id}" title="Editar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
              </button>
              <button class="icon-btn del" data-action="delete" data-id="${r.id}" title="Excluir">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
              </button>
            </div>
          </div>
          <div class="card-text ${isLong && !expanded ? 'clamped' : ''}">${escapeHtml(r.texto)}</div>
          ${isLong ? `<button class="expand-link" data-action="toggle" data-id="${r.id}">${expanded ? 'ver menos' : 'ver mais'}</button>` : ''}
        </div>
      </div>`;
  }).join('');

  content.innerHTML = `<div class="grid">${html}</div>`;
}

// ---------- Modal: Add/Edit ----------
function openEditor(record){
  isModalOpen = true;
  const isNew = !record;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h2>${isNew ? 'Novo registro' : 'Editar registro #' + escapeHtml(record.id)}</h2>
        <button class="icon-btn" data-action="close" title="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field-row">
          <div class="field">
            <label>Categoria</label>
            <input type="text" id="f-categoria" value="${escapeHtml(record?.categoria || '')}" list="cat-suggestions" placeholder="Ex: ELÉTRICA">
          </div>
          <div class="field">
            <label>Tipo</label>
            <input type="text" id="f-tipo" value="${escapeHtml(record?.tipo || '')}" list="tipo-suggestions" placeholder="Ex: Instalação">
          </div>
        </div>
        <div class="field">
          <label>Tag</label>
          <input type="text" id="f-tag" value="${escapeHtml(record?.tag || '')}" placeholder="Ex: TCC">
        </div>
        <div class="field">
          <label>Texto</label>
          <textarea id="f-texto" placeholder="Texto padrão do registro…">${escapeHtml(record?.texto || '')}</textarea>
        </div>
        ${isNew ? '' : `<div class="field-hint">ID: <span class="mono">#${escapeHtml(record.id)}</span> — não editável.</div>`}
      </div>
      <div class="modal-footer">
        <button class="ghost" data-action="close">Cancelar</button>
        <button class="primary" data-action="save">${isNew ? 'Cadastrar' : 'Salvar alterações'}</button>
      </div>
    </div>
    <datalist id="cat-suggestions">${[...new Set(allRecords.map(r=>r.categoria).filter(Boolean))].map(c=>`<option value="${escapeHtml(c)}">`).join('')}</datalist>
    <datalist id="tipo-suggestions">${[...new Set(allRecords.map(r=>r.tipo).filter(Boolean))].map(t=>`<option value="${escapeHtml(t)}">`).join('')}</datalist>
  `;
  document.body.appendChild(overlay);

  function close(){ overlay.remove(); isModalOpen = false; }

  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) close();
    const action = e.target.closest('[data-action]')?.dataset.action;
    if(action === 'close') close();
    if(action === 'save') handleSave();
  });

  async function handleSave(){
    const categoria = document.getElementById('f-categoria').value.trim();
    const tipo = document.getElementById('f-tipo').value.trim();
    const tag = document.getElementById('f-tag').value.trim();
    const texto = document.getElementById('f-texto').value.trim();

    if(!categoria || !texto){
      showToast('Preencha ao menos categoria e texto.', true);
      return;
    }

    const saveBtn = overlay.querySelector('[data-action="save"]');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Salvando…';

    if(isNew){
      const nextId = allRecords.length ? Math.max(...allRecords.map(r => Number(r.id) || 0)) + 1 : 1;
      allRecords.push({ id: nextId, categoria, tipo, tag, texto });
    } else {
      const idx = allRecords.findIndex(r => r.id === record.id);
      if(idx >= 0){ allRecords[idx] = { ...allRecords[idx], categoria, tipo, tag, texto }; }
    }

    const ok = await persist(allRecords);
    if(ok){
      showToast(isNew ? 'Registro cadastrado.' : 'Alterações salvas.');
      populateFilters(true);
      applyFilters();
      close();
    } else {
      saveBtn.disabled = false;
      saveBtn.textContent = isNew ? 'Cadastrar' : 'Salvar alterações';
    }
  }
}

function openDeleteConfirm(id){
  isModalOpen = true;
  const record = allRecords.find(r => r.id === id);
  if(!record) { isModalOpen = false; return; }
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:440px">
      <div class="modal-header"><h2>Excluir registro</h2></div>
      <div class="modal-body confirm-box">
        <p>Tem certeza que deseja excluir este registro? Essa ação não pode ser desfeita.</p>
        <span class="id-chip mono">#${escapeHtml(record.id)} · ${escapeHtml(record.categoria)}</span>
      </div>
      <div class="modal-footer">
        <button class="ghost" data-action="close">Cancelar</button>
        <button class="danger-btn" data-action="confirm-delete" style="background:var(--danger); color:#fff; border-color:var(--danger)">Excluir</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  function close(){ overlay.remove(); isModalOpen = false; }

  overlay.addEventListener('click', async (e) => {
    if(e.target === overlay) close();
    const action = e.target.closest('[data-action]')?.dataset.action;
    if(action === 'close') close();
    if(action === 'confirm-delete'){
      const btn = e.target.closest('[data-action]');
      btn.disabled = true; btn.textContent = 'Excluindo…';
      allRecords = allRecords.filter(r => r.id !== id);
      const ok = await persist(allRecords);
      if(ok){
        showToast('Registro excluído.');
        populateFilters(true);
        applyFilters();
        close();
      } else {
        btn.disabled = false; btn.textContent = 'Excluir';
      }
    }
  });
}

// ---------- Export ----------
function exportToXlsx(){
  if(typeof XLSX === 'undefined'){
    showToast('Biblioteca de exportação ainda carregando, tente novamente em instantes.', true);
    return;
  }
  const rows = allRecords.map(r => ({ id: r.id, categoria: r.categoria, tipo: r.tipo, tag: r.tag, texto: r.texto }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Planilha1');
  XLSX.writeFile(wb, 'base_conhecimento.xlsx');
}

// ---------- Events ----------
document.getElementById('search-input').addEventListener('input', applyFilters);
document.getElementById('filter-categoria').addEventListener('change', applyFilters);
document.getElementById('filter-tipo').addEventListener('change', applyFilters);
document.getElementById('btn-new').addEventListener('click', () => openEditor(null));
document.getElementById('btn-export').addEventListener('click', exportToXlsx);
document.getElementById('btn-refresh').addEventListener('click', async () => {
  showToast('Recarregando dados…');
  await silentRefresh();
});

document.getElementById('content').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const id = Number(btn.dataset.id);
  if(action === 'copy'){
    const record = allRecords.find(r => r.id === id);
    if(record) copyText(record.texto, btn);
  } else if(action === 'edit'){
    const record = allRecords.find(r => r.id === id);
    if(record) openEditor(record);
  } else if(action === 'delete'){
    openDeleteConfirm(id);
  } else if(action === 'toggle'){
    if(expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
    render();
  }
});

// ---------- Boot ----------
(async function boot(){
  await initialLoad();
  refreshTimer = setInterval(silentRefresh, 25000);
})();
</script>
