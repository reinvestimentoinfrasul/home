 etc.); \n- Se for pedido externo, favor anexar o pedido na aba documentos desta OS  (Ex: Disin, BBTS, PF, CMS, CMA, etc.);\n- Haverá alteração no layout?\n- Descrever local da instalação;\n- Anexar fotos do local e do equipamento (aba Documentos desta OS). \n\nResponder e devolver a OS utilizando o caminho: Plataforma BB > Administrativo > Manutenção > Pendência de Providências > Selecionar a OS > utilizar o status \"Encaminhar: COMPLEMENTO DEPENDÊNCIA DEMANDANTE\" ao final da página e inserir a resposta no campo de texto para retornar ao Cesup.       "}, {"id": 494, "categoria": "CIVIL", "tipo": "Retorno ao CESUP Suprimentos", "tag": "#infiltração", "texto": "  Acionar o Carro oficina para desentupimento de calhas e descidas da cobertura da agência, para garantir o escoamento das águas pluviais.\n\nApós executadas essas medidas, e sendo elas insuficientes, a mantenedora deverá:\n1. Efetuar pequenos reparos em furos e rachaduras de telhas, calhas e canos, inclusive corrigindo o alinhamento das mesmas.\n2. Elaborar relatório técnico e orçamento para solução dos problemas de infiltrações/vazamentos, apontando suas causas e os serviços para correção dos danos (ver Observações a seguir). \n\nObservações quanto ao relatório técnico:\n- O relatório técnico precisa estar subsidiados de fotos do lado interno e externo dos ambientes, e conter memorial de cálculo e croqui da cobertura e áreas afetadas. \n- Deverão ser levantados em separado as ações para correção das infiltração, e para correção dos problemas causados nos forros e pinturas.\n- As fotos devem ser amplas, todos os ângulos, de perto, de longe e de todo contexto do ambiente. \n- O memorial de cálculo dos quantitativos que subsidiaram o orçamento; \n- O croqui deverá mostrar o telhado completo indicando calhas, ralos em lajes, e a indicação dos locais com infiltração e sua relação com os locais afetados.         "}, {"id": 498, "categoria": "CIVIL", "tipo": "Observação Interna", "tag": "#infiltração", "texto": "A Dependência Beneficiária\nPrezados,\n\nVerificar se as rotinas de limpeza de calha e ralos estão sendo executadas conforme contrato de Limpeza Terceirizada.\nInformações do contrato de Limpeza podem ser verificadas no Portal ambiência Funcionamento (https://super.intranet.bb.com.br/superadm/ambiencia)"}, {"id": 639, "categoria": "ELÉTRICA", "tipo": "Grupo Gerador", "tag": "#gerador", "texto": " GRUPO GERADOR E SUBESTAÇÃO\n\nEVENTOS\n\nMATERIAL: IMÓVEL PRÓPRIO (4297) IMóVEL TERCEIRO (4300)   \n                     \nMÃO DE OBRA: IMÓVEL PRÓPRIO (4302) IMÓVEL TERCEIRO (4305)"}, {"id": 471, "categoria": "GERAL", "tipo": "Devolvida à dependência", "tag": "#fotos", "texto": " A dependência \n\nFavor anexar FOTOS na aba Documentos as fotos gerais e detalhadas das áreas que necessitam de reparos/manutenção, para avaliação das condições e viabilidade da análise e condução desta demanda. A maneira mais fácil de anexar as fotos é incluir todas em um documento pdf, e anexar este único documento. Há limitação de 5 Mb por arquivo.\n\nAcrescentar no campo OBSERVAÇÕES mais detalhes que considerar relevantes como medidas e serviços realizados anteriormente.\n\nRetornar a OS utilizando o status \"COMPLEMENTO DEPENDÊNCIA DEMANDANTE\" "}, {"id": 602, "categoria": "ATENDIMENTO", "tipo": "OS não atendida 1ª vez - Retorno ao Fornecedor", "tag": "#fornecedor", "texto": "  Sr. Fornecedor, devolvemos para registro do RAT e conclusão imediata do atendimento ou apresentação de justificativas. A ausência de registros no portal antes do próximo retorno automático desta OS ao Cesup Patrimônio comprovando a condução do atendimento ou apresentando as devidas justificativas, implicará em sanções administrativas, inclusive aplicação de multa por inexecução contratual. Não haverá nova devolução desta OS: neste caso, sendo a demanda automaticamente retirada de seu Painel, considere a OS CANCELADA e não PROCEDA COM O ATENDIMENTO.\n  "}, {"id": 605, "categoria": "ATENDIMENTO", "tipo": "Dependência Informa Execução dos Serviços", "tag": "#fornecedor", "texto": " Sr(a). Fornecedor(a), ÚLTIMA REITERAÇÃO, conforme informação de atendimento, favor concluir devidamente a OS para conformidade da dependência demandante.\nInformamos que a não conclusão encerrará esta Ordem, que deverá ser solicitada posteriormente, via email padrão, para devolução e conclusão, para habilitação ao pagamento.\n "}, {"id": 557, "categoria": "GERAL", "tipo": "Encaminhado para Cesup Plataforma Jurisdicionante", "tag": "#Fluxo", "texto": " Solicitamos análise pelo Cesup Plataforma conforme IN 328-2, subitem 4.2.2.3.2.\n\nMotivo: Fluxo de Trabalho em andamento número 2021/XXXXX.    "}, {"id": 240, "categoria": "ELÉTRICA", "tipo": "Retorno ao suprimentos", "tag": "#Fibra", "texto": "   Prezados,\n\nproceder da seguinte forma,\n\nFazer um rasgo e instalar eletroduto de 1\" novo, deixando um guia para facilitar a passagem do cabeamento da operadora, utilizar os itens:\n6.3 - Rasgo e fechamento em alvenaria e piso\n19.11 - Ponto logico/alarme simples - Custos Variáveis   "}, {"id": 114, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "#fechadura", "texto": " Sr. Gerente,\n\nEste equipamento está em desuso em áreas internas possui alto custo de manutenção e não agrega segurança.\nA manutenção destes equipamentos é opcional e o mesmo pode ser substituído por fechadura com chave.\nCaso seja entendido que a manutenção deste equipamento é realmente necessária, solicitamos retornar para darmos andamento à solicitação. "}, {"id": 172, "categoria": "ELÉTRICA", "tipo": "Encerrado pelo Patrimônio", "tag": "#fechadura", "texto": " Não há previsão na IN 416 para instalação de fechaduras eletromagnéticas em ambientes internos. Devem ser observadas as instruções contidas na IN de segurança a respeito dos procedimentos de acesso aos ambientes restritos.  A instalação de fechaduras eletromagnéticas em ambientes internos das dependências foi cancelada.      "}, {"id": 173, "categoria": "ELÉTRICA", "tipo": "Indeferida", "tag": "#fechadura", "texto": "   Prezados,\n\nNão há previsão na IN 416 para instalação de fechaduras eletromagnéticas em ambientes internos. Devem ser observadas as instruções contidas na IN de segurança a respeito dos procedimentos de acesso de terceiros aos ambientes restritos.\n\n\n4.1.2 Dimensionamento e instalação do Sistema\n4.1.2.3 A porta de entrada do autoatendimento, obrigatoriamente, é dotada de fechadura eletromagnética que suporte cargas de tração de até 120 Kgf. A fechadura deve ser interligada ao setor específico do hall de público da Sala de Autoatendimento e contar com dispositivo que informe ao sistema de alarme o seu estado (aberta ou fechada).\n\n6.1 Condutas em Ambientes de Tesouraria e com Presença de Numerário\n6.1.1 As portas de acesso aos ambientes de tesouraria, SAO, corredor de abastecimento de TAA (e demais ambientes mesmo que eventualmente guardem ou movimentem numerário) devem permanecer trancadas, sendo abertas apenas para entrada ou saída de pessoas autorizadas.\n6.1.1.1 As chaves desses ambientes devem permanecer em poder de funcionário designado, durante o horário de funcionamento da dependência.\n\n8.1.2 As salas de telecomunicação/on-line (TC) são protegidas por controles que asseguram o acesso somente de pessoas autorizadas, sendo que suas portas e janelas permanecem trancadas. \n8.1.2.1 a chave da sala de telecomunicações/online (TC) ficará sob a guarda de funcionário responsável, designado por ordem de serviço;\n8.1.2.2 a cópia da chave da sala de telecomunicações/online (TC) deverá ser mantida em envelope lacrado e guardada no cofre ou casa forte da agência. \n\nA IN prevê instalação deste sistema apenas na porta da SAA. Não temos mais autorização para instalação de fechaduras eletromagnéticas em ambientes internos das dependências.\n\n\nPara instalação de itens de segurança não previstos na IN, a dependência pode efetuar uma consulta à USI/Gesin. Caso o pedido seja aprovado, basta abrir um chamado SCAP para o CESUP Plataforma anexando o parecer da USI/Gesin. (https://cesuprede.intranet.bb.com.br/scap/#/cadastro)   "}, {"id": 664, "categoria": "ELÉTRICA", "tipo": "", "tag": "#FaleFechadura", "texto": " Este equipamento era atendido pela BBTS, porém o novo contrato deixou de contemplá-lo. Estamos buscando meios de aditar o novo contrato para incluir essas fechaduras. Contudo nesse meio tempo, a orientação é realizar manutenções emergenciais com fornecedores locais ou regionais para pagamento via CDA. Caso precise de auxílio para encontrar fornecedores, favor devolver esse chamado anexando fotos do equipamento com defeito para que possamos ajudá-la. Pedimos também que descreva o problema, exemplo: porta travada, porta não trava, teclado não reconhece a senha, etc.\n\nEstou à disposição para demais dúvidas.\n\n\nNOME - Equipe Carro Oficina NÚMERO - Atendimento\n\n----------------------------------------------------------------------------------------------------------------------- "}, {"id": 609, "categoria": "GERAL", "tipo": "", "tag": "#Fale", "texto": "\n\n\nEspero ter atendido sua necessidade. Estou à disposição para demais dúvidas.\n\n\nNOME - Equipe Carro Oficina NÚMERO - Atendimento\n\n----------------------------------------------------------------------------------------------------------------------------------------------\n*O Fale com Cesup é o seu canal de comunicação com a Disec. Avalie este atendimento. Acesse: Mensagens da Dependência - Encerrar/Reabrir (clique na estrela)*  "}, {"id": 627, "categoria": "GERAL", "tipo": "#FALE", "tag": "#FALE", "texto": "***O Fale com Cesup é o seu canal de comunicação com a Disec. Avalie este atendimento. Acesse: Mensagens da Dependência - Encerrar/Reabrir (clique na estrela). ***"}, {"id": 518, "categoria": "CIVIL", "tipo": "", "tag": "#extintor", "texto": "Prezados,\nExtintor não é item contratual do carro oficina. Para aquisição de extintores novos acesse a loja virtual pelo caminho: Plataforma BB / Administrativo / Suprimentos / Loja Virtual / Solicitação de produtos e serviços."}, {"id": 633, "categoria": "1º NIVEL", "tipo": "CORRETIVA", "tag": "#equiperesidente #residente", "texto": "==============================\n1. OS registradas pelas agências\n\nIndeferir com o seguinte script: \n\n\n\"Sr. Gerente,\n\nSeu prefixo e/ou condomínio é atendido por contrato do tipo Equipe Residente. Desta forma, o atendimento deverá ser prioritariamente atendido por este contrato, conforme IN 328-1 - item 3.2. Sua demanda deverá ser registrada através do endereço: https://cesuprede.intranet.bb.com.br/scap .\"\n\n>>>> Se houver insistência da agência, encaminhar OS para a Plataforma avaliar outros meios para atendimento. Caso a Plataforma apresente justificativa para acionamento do carro, sendo serviços de baixa complexidade, podemos acionar sem problema. Para serviços de grande vulto, precisamos avaliar junto ao fornecedor se tal demanda não compromete o atendimento das preventivas. Havendo comprometimento das preventivas, estamos a autorizados a recusar o acionamento do carro.\"\n\n\n2. OS registradas pela Plataforma\n\nDevolver para a Plataforma com o seguinte script: \n\n\"Sr. Assessor,\n\nO prefixo e/ou condomínio em questão é atendido por contrato do tipo Equipe Residente. Desta forma, seu atendimento deverá ser prioritariamente atendido por este contrato, conforme IN 328-1 - item 3.2.\"\n\nCaso a OS retorne com a devida justificativa da Plataforma, seguimos as mesmas orientações do item 1."}, {"id": 606, "categoria": "ATENDIMENTO", "tipo": "OS não atendida 3ª vez - Encerramento", "tag": "#encerramento", "texto": "Demandante informa serviço realizado, mas dados de conclusão não foram registrados, após reiteração.\nComo informado em histórico ao fornecedor, a Ordem de Serviço deverá ser solicitada posteriormente, via email padrão, para reabertura, devolução e conclusão, para habilitação ao pagamento."}, {"id": 555, "categoria": "GERAL", "tipo": "Ponto novo", "tag": "#elétrico #lógico", "texto": " Sr. Gerente,\n\nFavor informar o motivo da necessidade de instalação de pontos novos.\n\nInformamos que a instalação de novos postos de trabalho devem ser autorizadas pela SUPER Varejo e demandadas via SCAP.\n\nCaso já exista esta autorização, ou não se tratar de incremento de postos de trabalho nem alteração de leiaute, favor marcar na planta em anexo os locais onde devem ser instalados os pontos, indicando o tipo de equipamento a ser instalado para podermos dimensionar os circuitos. "}, {"id": 626, "categoria": "ELÉTRICA", "tipo": "", "tag": "#DOSI", "texto": "Conforme Parágrafo Terceiro do contrato 2020.8558.0066 - O resultado da análise dos serviços deve conter o levantamento de quantitativos e relatório técnico fotográfico, que justifique os quantitativos lançados, observando os prazos máximos contratuais de atendimento."}, {"id": 634, "categoria": "ELÉTRICA", "tipo": "", "tag": "#DOCA", "texto": " Sr. Fornecedor,\n\nO serviço solicitado esta previsto em contrato, pois o carro oficina deve apenas instalar os pontos lógicos e elétricos conforme as \"Especificações de serviço - Execução da infraestrutura\" e os \"Diagramas de infraestrutura\" anexados nesta OS.\n\n19.10 - Ponto logico/alarme simples - Custos Fixos\n19.11 - Ponto logico/alarmesimples - Custos Variaveis\n19.3 - Ponto eletrico simples novo - Custos fixos\n19.4 - Ponto eletrico simples novo - Custos Variaveis\n\n Favor proceder à execução do serviço. "}, {"id": 614, "categoria": "ELÉTRICA", "tipo": "Retorno ao Patrimonio Atendimento", "tag": "#dilacao", "texto": "Prazo concedido conforme solicitado.\n\nCaso o serviço não seja finalizado até a data autorizada o fornecedor poderá sofrer sanções administrativas previstas em contrato.  "}, {"id": 641, "categoria": "ELÉTRICA", "tipo": "Retorno ao Patrimonio Atendimento", "tag": "#dilacao", "texto": "Prezados,\n\nNão há justificativa para dilação de prazo, serviço de baixa complexidade. Caso o serviço não seja executado, o fornecedor poderá sofrer sanções administrativas previstas em contrato.\n\nFavor proceder à execução do serviço."}, {"id": 663, "categoria": "ELÉTRICA", "tipo": "", "tag": "#dilação", "texto": "Sr. Gerente,\n\n- Conforme histórico, nosso fornecedor de carro oficina solicitou mais prazo para execução do serviço, devido a urgência, a dependência tem algum fornecedor local que possa efetuar o reparo?\n\nResponder e devolver a OS utilizando o caminho: Plataforma BB > Administrativo > Manutenção > Pendência de Providências > Selecionar a OS > utilizar o status \"Encaminhar: COMPLEMENTO DEPENDÊNCIA DEMANDANTE\" ao final da página e inserir a resposta no campo de texto para retornar ao Cesup."}, {"id": 545, "categoria": "GERAL", "tipo": "Descarte de Bens", "tag": "#descarte de Bens", "texto": "Orientar pela IN:311-1 item 2. "}, {"id": 603, "categoria": "ATENDIMENTO", "tipo": "OS não atendida 2ª vez - Envio p/ Dependência", "tag": "#dependência", "texto": "Sr. Gerente, gentileza informar com o status:  \n- COMPLEMENTO DEPENDÊNCIA DEMANDANTE se o fornecedor realizou e/ou agendou o atendimento;  \n- CONCLUÍDO DESPESAS DE PEQUENO VULTO se a dependência já realizou o serviço via CDA e deseja encerrar a Ordem de Serviço."}, {"id": 257, "categoria": "CIVIL", "tipo": "", "tag": "#cpmm", "texto": "Orientamos adquirir CPMM via SISLOG e colada com fita dupla face. PBMS: 71.10.290.222384-CAIXA PASS. MASSA METALICA CPMM."}, {"id": 503, "categoria": "ELÉTRICA", "tipo": "", "tag": "#COVID #LOCKDOWN #DECRETO", "texto": "Prezados,\nTendo em vista a situação COVID19 em todo o país, as diversas medidas restringindo \nmovimentação da população em várias cidades brasileiras, o fornecimento de material \npara execução do serviço está prejudicado em várias cidades. Fornecedor informa em\nsua mensagem data para flexibilizaçãodo isolamento social.\n \nPedimos agencia retornar esta OS quando houver condições de atendimento.\n\n"}, {"id": 517, "categoria": "GERAL", "tipo": "", "tag": "#covid", "texto": "  Prezados,\nIndicamos obter orientação corporativa junto à SUPER ADM, referente às medidas para retorno ao trabalho presencial no que tange ao distanciamento devido ao Covid. Informamos também, que até o momento, não há definição corporativa para alterar o layout via carro oficina para este fim.  "}, {"id": 474, "categoria": "CIVIL", "tipo": "", "tag": "#covid", "texto": "Prezados,\n\nEncerramos a demanda e orientamos sobre COVID-19:\n\nA orientação geral para instalação de fita de piso é:\n\nA FITA ADESIVA AMARELA P/ SINALIZAÇÃO poderá ser adquirida localmente com pagamento pelo evento CDA 1240 devido à urgência na aquisição. Na justificativa do pedido incluir: \"#COVID-19 - aquisição de fita amarela de sinalização\". \n\n\nO mesmo produto também consta como item fornecido pelo Almox PBMS 920002 - FITA ADESIVA AMARELA P/ SINALIZAÇÃO, que poderá ser solicitado pelo SISLOG-01-11 junto com o pedido normal de material de expediente da dependência.\n\n\nVocê pode encontrar mais informações sobre COVID-19 no HOTSITE da DISEC  https://disec.intranet.bb.com.br/coronavirus/"}, {"id": 489, "categoria": "GERAL", "tipo": "Retorno ao Suprimentos - Previsão de Atendimento", "tag": "#covid", "texto": "Prezados,\n\nSolicitamos a previsão de atendimento, visto que construção civil e atendimento bancário estão incluídas nas atividades essenciais do Decreto Presidencial\ne a dependência se encontra com atendimento interno. Caso exista algum decreto estadual e/ou municipal que impeça o funcionamento desses fornecedores\ndurante a pandemia, favor anexar na aba Documentos desta OS.  "}, {"id": 488, "categoria": "ELÉTRICA", "tipo": "Retorno ao Suprimentos - Autorizado", "tag": "#Conectividade", "texto": "   Serviço autorizado.\n\nServiço a ser realizado:\n\nTentar desobstruir a tubulação. Caso inviável,  efetuar tubulação de aço galvanizado (mínimo 1\"), a partir do ponto de entrega da concessionária na calçada levando a infraestrutura até a sala online. - substituir o cabo de rede por arame guia em toda tubulação. \n\nServiço autorizado. 6.3 - Rasgo e fechamento em alvenaria e piso\n19.11 - Ponto logico/alarme simples - Custos Variáveis "}, {"id": 516, "categoria": "GERAL", "tipo": "geral", "tag": "#codiv19", "texto": "Prezados,\nIndicamos obter orientação corporativa junto à SUPER ADM referente ao retorno do trabalho presencial. Informamos também que até o momento não há definição corporativa para alterar o layout via carro oficina."}, {"id": 669, "categoria": "ELÉTRICA", "tipo": "Fechadura Cofre", "tag": "#cincofort", "texto": "  - Este equipamento era atendido pela BBTS, porém o novo contrato deixou de contemplá-lo. Estamos buscando meios de aditar o novo contrato para incluir essas fechaduras. Contudo nesse meio tempo, a orientação é realizar manutenções emergenciais com fornecedores locais ou regionais para pagamento via CDA.\n\n- Caso não tenha fornecedor local para auxiliar, segue abaixo contato do Sr. Alexandre, fornecedor não contratado, que presta serviços em sistemas de intertravamento, se necessário entrar em contato para análise do problema, quando preciso favor gravar pedidos CDA para pagamento dos serviços.\n\n- Conforme IN 1154. Favor separar as despesas Material e Mão de Obra = Imóvel Terceiro 3395 (Mão de Obra) e 3465 (Material) // Imóvel Próprio 3392 (Mão de Obra) E 3462 (Material)\n\nContato\nAlexandre - telefone 18 99737-9893 - Cincofort.\n(18) 3273 4958"}, {"id": 586, "categoria": "1º NIVEL", "tipo": "PADRAO", "tag": "#chamadonormal", "texto": "   Sr fornecedor, fazer constar no RAT e na planilha de faturamento: \n#projeto #manutenção \nEM CASO DE SERVIÇO NÃO CONTRATUAL, ***NÃO REALIZAR***.     "}, {"id": 631, "categoria": "1º NIVEL", "tipo": "PADRAO", "tag": "#chamadonormal", "texto": " Prezado Fornecedor,  \n\nAutorizada a execução dos serviços dentro dos limites Contratuais.    \n\nFazer constar no RAT e na planilha de faturamento (coluna projeto): #manutenção     \n\nÉ VEDADA A EXECUÇÃO DE SERVIÇOS NÃO PREVISTOS EM CONTRATO! Caso seja constatada a necessidade de itens NÃO CONTRATUAIS para a solução do problema relatado, favor retornar a OS com as informações e aguardar orientações específicas para o fechamento da demanda.****Antes de iniciar o deslocamento até o local de atendimento, buscar contato com o gestor da dependência para garantir acesso.  \n\nCaso haja alguma restrição em função da epidemia do COVID-19, retornar esta OS com a justificativa para avaliarmos.    \n\nContato da dependência:  "}, {"id": 648, "categoria": "ELÉTRICA", "tipo": "CFTV", "tag": "#CFTV; DOSI", "texto": "   \nSr. Gerente,\n\nCom o novo contrato da BBTS, todas as manutenções de CFTV, inclusive cabeamento, devem ser atendidas pela BBTS. \n\nOrientamos abertura de manutenção de CFTV na PDS, em manutenção CFTV ACION..\n\nTodos os serviços devem ser executados através do contrato 2020.8558.0066 - Prestação de serviços de Disponibilidade Operacional de Sistema de Imagem DOSI e serviços eventuais de instalação,desinstalação e realocação de sistemas de imagens e serviços acessórios nas unidades do Banco do Brasil S.A localizadas em todo o território Nacional. "}, {"id": 60, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "#CFTV", "texto": "Favor analisar o pleito da dependência. Reforma de infraestrutura ou ampliação de sistema de CFTV ou ALARME deve ter projeto e anuência do CESUP Plataforma.  "}, {"id": 495, "categoria": "ELÉTRICA", "tipo": "", "tag": "#CFTV", "texto": " ** Agencia solicita ajuste de camera CFTV ou reparo de camera CFTV **\n\nAgência deverá acionar a BBTS (via Plataforma BB) para efetuar o ajuste.\nEntendemos que o serviço ora solicitado se enquadra em manutenção de CFTV. \n\nConforme disposto em contrato com a BBTS, a saber:\n3.1 Os serviços de disponibilidade operacional dos equipamentos/sistemas de circuito fechado de TV(CFTV), energia ininterrupta(no-break), controle de acesso(PGDM, PSDM, Eclusa, PDM) e infraestrutura de comunicação (voz, dados e segurança - sala on-line) compreendem\n3.1.1.1 Manutenção de CFTV\n3.1.1.2 Manutenção de Sala on-line\n3.1.1.3 Manutenção de no-break\n3.1.1.4 Manutenção de PGDM. "}, {"id": 624, "categoria": "GERAL", "tipo": "Devolvida para Dependência", "tag": "#CDA Serviço_não_contratual", "texto": " Prezados,\nServiço não contratual do Carro Oficina.\n\nOrientamos a dependência a utilizar alternativamente o Zápido e os eventos CDA de Pequenas despesas de Pronta entrega e Pagamento, conforme IN-1154 (item de Contratação Direta).\nPoderá ser utilizado os eventos CDA 3395 para mão de Obra e 3465 para Material\n\nConsultar a IN-1154 para maiores informações. (item 6.1.1.)\n\nEncaminhar OS como CONCLUIDO DESPESAS DE PEQUENO VULTO "}, {"id": 668, "categoria": "ELÉTRICA", "tipo": "CDA", "tag": "#CDA", "texto": "CABE AO EXECUTANTE OBSERVAR AS DISPOSIÇÕES DA IN1154-1 ITEM 6.1, QUANTO A CONFORMIDADE E VEDAÇÕES, DUPLICIDADE DE PEDIDOS E FRACIONAMENTOS. PEDIDO DENTRO DOS LIMITES MENSAL E ANUAL."}, {"id": 511, "categoria": "GERAL", "tipo": "Encerramento", "tag": "#CDA", "texto": " Buscar solução via contratação local por Pequenas Despesas de Pronta Entrega e Pagamento (verificar o evento CDA mais adequado na IN-1154 capítulo de Contratação Direta).\nItem não contratual do Carro Oficina. "}, {"id": 681, "categoria": "GERAL", "tipo": "", "tag": "#carroengenharia", "texto": " Conforme edital, os custos de transportes estão inerentes ao preço licitado, exceto para vistoria "}, {"id": 682, "categoria": "GERAL", "tipo": "", "tag": "#carroengenharia", "texto": " Sr. Fornecedor,\n\nSegue planilha revisada, discordando favor apresentar as devidas justificativas. Concordando com os valores, gentileza inserir os itens na aba orçamento para aprovação. "}, {"id": 683, "categoria": "GERAL", "tipo": "", "tag": "#carroengenharia", "texto": "Orçamento aprovado no valor de R$ XX.XXX,XX.\n\n\nCaso discorde do valor aprovado favor apresentar o relatório com medidas, memorial de cálculo e suas devidas justificativas. Concordando com o valor, gentileza proceder à execução do serviço e apresentação do relatório técnico fotográfico de conclusão."}, {"id": 684, "categoria": "GERAL", "tipo": "", "tag": "#carroengenharia", "texto": "Sr. Gerente,\n\n\nFavor conceder acesso ao fornecedor de carro engenharia, conforme abaixo, para vistoria/execução dos serviços solicitados no SCAP: "}, {"id": 685, "categoria": "GERAL", "tipo": "", "tag": "#carroengenharia", "texto": "Orçamento aprovado no valor de R$ XXXXXX.\n\n\nFavor proceder à execução do serviço, posteriormente a apresentação do relatório técnico fotográfico de conclusão.\n"}, {"id": 652, "categoria": "ELÉTRICA", "tipo": "", "tag": "#carpete", "texto": "Os itens 13.5 e 13.9 já contemplam adequação da infraestrutura necessária para instalações elétrica/lógica/telefonia aos pontos já existentes. Para pontos não utilizados pela dependência instalar tampa cega."}, {"id": 655, "categoria": "ELÉTRICA", "tipo": "", "tag": "#carpete", "texto": "Os itens 13.5 e 13.9 contemplam mão de obra necessária para infraestrutura elétrica/lógica/telefonia fixada nas estações de trabalho ou mesas de reunião."}, {"id": 549, "categoria": "CIVIL", "tipo": "CAPACHO", "tag": "#CAPACHO", "texto": "Faça a aquisição de capacho com a Verba de Pequenas Despesas de Pronta Entrega e Pagamento(CDA evento 1241) até o limite de R$ 200,00 por metro quadrado. IN1154 6.1.1.2.1.  As especificações devem seguir as do PBMS 72.20.020.326778 CAPACHO DE BORRACHA (sistema Material), a saber:\n\"Especificações: Capacho de borracha sintética (vinil entrelaçado), com costado sólido (não espumado) também em vinil, cor cinza, sem borda ou logomarca do banco. Tramas saem direto do costado. Confeccionado sem uso de cola, costura ou qualquer outro tipo de adesivo. Propriedades físicas: Gramatura mínima - 3,2kg/m², Espessura - mínima 8,0 mm, máximo 12,0 mm Propriedades especiais: lavável, não propaga chamas, inibe o crescimento de fungos e antiderrapante\".\n"}, {"id": 467, "categoria": "1º NIVEL", "tipo": "CORRETIVA", "tag": "#CAPACHO", "texto": " Prezados,\nEste item não é atendido pelo contrato de Carro oficina.\n\nOrientamos efetuar a aquisição de capacho com a Verba de Pequenas Despesas de Pronta Entrega e Pagamento(CDA evento 1241) até o limite de R$ 200,00 por metro quadrado. IN1154 6.1.1.2.1.  As especificações devem seguir as do PBMS 72.20.20.70001\n CAPACHO DE BORRACHA (sistema Material > 80 > 91).      "}, {"id": 531, "categoria": "CIVIL", "tipo": "Benfeitorias Necessárias", "tag": "#bn #benfeitorias", "texto": "Solicito que seja encaminhada a proposta de execução e acompanhamento dos serviços ao CESUP REDE- Plataforma Belém, cfe. IN 312-2:\n\n\n2.14. Benfeitorias em imóveis de terceiro\n\n2.14.1. Cesup Patrimônio\n\n2.14.1.1. Receba da Área de Engenharia a necessidade de execução de obras consideradas benfeitorias necessárias;\n\n2.14.1.2. Verifique o Contrato de Locação para identificar se existe cláusula que trata do assunto;\n\n2.14.1.3. Solicite autorização formal para a reforma e negocie para que as obras sejam custeadas pelo proprietário do imóvel;\n\n2.14.1.4. Documente a negociação e arquive no dossiê de locação:\n\n2.14.1.4.1. Caso definida a responsabilidade de execução pelo Banco, encaminhe a \"Solicitação para contratação de Obras e serviços de Engenharia\" ao Cesup Rede/Plataforma para registro de solicitação de reforma no sistema de compras;\n\n\n"}, {"id": 401, "categoria": "CIVIL", "tipo": "Orçamento Indeferido - Pagar RAT", "tag": "#BenfeitoriasNecessárias", "texto": " Ao Fornecedor\n \nIncluir a RAT de chamado e deslocamento.\nOrçamento refere-se a Benfeitorias Necessárias.\n\n\n-----------------------Observação Interna ----------------------------------\n\nConforme Lei 8245/91 e Código Civil as benfeitorias necessárias são a cargo do proprietário para adequação.\nDemanda encaminhada ao CESUP Suprimentos/Gestão de Bens de Uso, conforme Parecer de Benfeitorias Necessárias nº XXXXX cadastrado no portal da engenharia (https://engenharia.intranet.bb.com.br/portal/phtml/BenfeitoriasNecessariasConsulta.php) para providências de notificação ao proprietário por tratar-se de imóvel locado.\n\nMais informações verificar IN-312\n\n "}, {"id": 591, "categoria": "1º NIVEL", "tipo": "EMERGENCIAL", "tag": "#benfeitorias #Imov.Terceiros", "texto": " ******************************CHAMADO EMERGENCIAL******************************\nSr. fornecedor: realizar apenas atendimento paliativo para a estabilização dos riscos (não executar serviços de impermeabilização neste 1º atendimento), apresentar relatório técnico-fotográfico com orçamento para a correção definitiva do problema e retornar nesta mesma OS com o status/encaminhamento \"Orçamento Realizado pelo Fornecedor\".\nFazer constar no RAT e na planilha de faturamento:\n#projeto #benfeitorias   "}, {"id": 593, "categoria": "1º NIVEL", "tipo": "EMERGENCIAL", "tag": "#benfeitorias #Imov.Próprio", "texto": "  ******************************CHAMADO EMERGENCIAL******************************\nSr. fornecedor, autorizado o atendimento emergencial. Para serviços de maior complexidade (ex.: impermeabilização), itens não contratuais ou que extrapolem os limites pré autorizados (in loco), executar apenas serviços paliativos para a contenção dos riscos, apresentar relatório técnico-fotográfico com o orçamento para a solução definitiva do problema e retornar nesta mesma OS com o status/encaminhamento \"Orçamento Realizado pelo Fornecedor\".\nFazer constar no RAT e na planilha de faturamento:\n#projeto #manutenção\n "}, {"id": 535, "categoria": "GERAL", "tipo": "Complemento Dependência Demandante", "tag": "#bebedouro #instalação", "texto": "informar se já foi definido o local para instalação do BEBEDOURO e se os equipamentos estão disponíveis.\nCaso não possua a infraestrutura necessária (ponto elétrico e/ou ponto de água/esgoto) próximo do local de instalação, abra um SCAP para análise do Cesup Rede/Plataforma. Ao abrir o SCAP informe o local a ser instalado e, se possível, envie fotos para análise. Link do SCAP (https://cesuprede.intranet.bb.com.br/scap/#/cadastro)\n\nSe todos os itens acima estiverem atendidos, inserir fotos do local de instalação na aba \"DOCUMENTOS\", e retornar a OS utilizando o status \"COMPLEMENTO DEPENDÊNCIA DEMANDANTE\""}, {"id": 543, "categoria": "CIVIL", "tipo": "Manutenção de Bebedouro", "tag": "#BEBEDOURO", "texto": " Para manutenção de Bebedouro é preciso identificar se o problema é na infraestrutura ou no equipamento.\n\nCaso o problema seja na infraestrutura (tubulação, tomada, etc), abrir um chamado na Plataforma BB > Administrativo > Manutenção> Ordem de Serviço > Solicitar > Abrir Ordem de Serviço > Selecionar: Acionamento Carro Oficina > Tipo de serviço: Reparo/restauração. \n\nCaso o problema seja no equipamento, você tem 3 opções:\nAcionar o Zápido, disponível na Plataforma BB > Administrativo > Manutenção>  Pequenas Despesas > Zápido\n\nFazer a contratação de empresa local com pagamento via CDA (IN 1154), utilizando os eventos 3527 ou 3530 para mão de obra e 3557 ou 3560 para peças.\n\nAbrir OS no MATERIAL 40 > 01 (apenas para equipamentos em garantia).\nPara consultar se o aparelho se encontra na garantia: MATERIAL 11>99>01 - digitar o número de bem co campo 01 e no campo ao largo digitar 3 (equipamentos). Na tela que se abre, aparecerá o prazo de garantia do equipamento, normalmente contado a partir da data de instalação.\n "}, {"id": 492, "categoria": "GERAL", "tipo": "", "tag": "#bebedouro", "texto": " PARA ACIONAMENTO DE GARANTIA DE BEBEDOURO DE PRESSÃO - MATERIAL 40-01 "}, {"id": 538, "categoria": "GERAL", "tipo": "CIVIL", "tag": "#BEBEDOR ", "texto": "Prezados, \n\nO registro de solicitações de Bebedouros deve ser realizada exclusivamente pelo CESUP PLATAFORMA. Caso necessite solicitar um bebedouro abra um FALE COM O CESUP detalhando o seu pedido, informando o local de instalação e se a tomada é 127 ou 220v, se existe ou não ponto de esgoto e projeto de localização. "}, {"id": 509, "categoria": "CIVIL", "tipo": "BBTS para retirada de PGDM", "tag": "#BBTS #PGDM #troca #substituiç", "texto": " Para possibilitar a troca/substituição do piso cerâmico da SAA e Hall de Público, a Dependência deve abrir chamado na BBTS na PDS (Plataforma Digital de Suprimentos/Manutenção/Ordem de serviço/Solicitar) para: Desinstalação de PGDM para possibilitar a substituição do piso cerâmico da agência, já informando a data e hora para o serviço.\nApós a conclusão do serviço de engenharia - obra - Abrir novo chamado BBTS para: Reinstalação de PGDM após instalação de piso cerâmico na dependência.\n\nA BBTS será remunerada através de item contratual distinto do de \"remanejamento de PGDM\", pelo CESUP Patrimônio. "}, {"id": 616, "categoria": "ELÉTRICA", "tipo": "Padrão", "tag": "#BBTS", "texto": "Prezados,\n\nOrientamos primeiramente abrir chamado a BBTS para verificar as câmeras de CFTV e se for o caso emitir laudo de troca de cabeamento das câmeras."}, {"id": 189, "categoria": "ELÉTRICA", "tipo": "Encerrado pelo Patrimônio", "tag": "#BBTS", "texto": "A prestação de serviços de disponibilidade operacional dos sistemas de circuito fechado de TV (CFTV), energia ininterrupta (No-break), controle de acesso (PGDM – Porta Giratória Detectora de Metais, PSDM – Porta Semigiratória Detectora de Metais, Eclusa, PDM - Portal Detector de Metais, e Sistema de Intertravamento de Portas) e infraestrutura de comunicação (voz, dados e segurança – Sala on-line) são de atribuição exclusiva do contrato 2018-8558-0014 BBTS. Solicitamos abrir chamado via Plataforma 3.0. Caso haja necessidade de serviços não cobertos pela BBTS e realizáveis pelo carro oficina, orientamos abrir nova OS e anexar o laudo emitido pela BBTS.   "}, {"id": 562, "categoria": "ELÉTRICA", "tipo": "Bateria", "tag": "#bateria", "texto": "Sr. Gerente,\n\nExiste ARP para aquisição de banco de bateria para no break.\n\nO pedido é feito pelo Cesup Suprimentos BENS. \nCabe à BBTS o atendimento e emissão de laudo, após o deferimento pela engenharia os documentos seguem para essa equipe do 7419 para acionamento da ARP.\n\nCaso já possua este laudo, favor abrir um FALE com do CESUP e solicitar a aquisição.\n\nO Pedido via ARP é menos oneroso e é pago como investimento, não impactando diretamente no resultado da dependência."}, {"id": 561, "categoria": "ELÉTRICA", "tipo": "item", "tag": "#ans", "texto": "  Item não relacionado ao serviço. A utilização de itens indevidos gera análise de irregularidade contratual. ANS  "}, {"id": 217, "categoria": "ELÉTRICA", "tipo": "Preventiva", "tag": "#ana", "texto": "         Orçamento analisado\nAlguns itens foram indeferidos pois a não foi comprovada a necessidade para as intervenções propostas, de acordo com o relatório.\nAlguns quantitativos foram ajustados à necessidade para as intervenções propostas/devidas, de acordo com a comprovação verificada no relatório. Frisamos que a falta de comprovação de serviços necessários à manutenção da dependência não poderá trazer prejuízos a esta, sob pena de retorno ao imóvel e complementação dos serviços sem ônus ao banco.\nOrçamento deferido, favor proceder à execução do serviço.                   "}, {"id": 196, "categoria": "ELÉTRICA", "tipo": "Encerrado pelo Patrimônio", "tag": "#alarme", "texto": "Sr. Gerente,\n\nAlarme de incêndio não possui cobertura em contrato de manutenção.\n\nSugerimos acionar empresa local para verificação do problema e pagamento dos serviços por CDA.\n\nImportante - Não autorizar execução de serviço sem ter CDA aprovado no sistema.  "}, {"id": 670, "categoria": "CIVIL", "tipo": "Acessibilidade", "tag": "#acessibilidade", "texto": "Prezado gerente,\n\nDemandas solicitadas pelo SESMT devem ser precedidas de projetos disponibilizados pelo mesmo. Caso este não tenha fornecido, favor aguardar a adequação de acessibilidade que será realizada em todas as agências de forma programada.\n\nReforço o entendimento de que o banco possui um Termo de Ajuste de Conduta - TAC com o Ministério público com prazo para atendimento, sendo que as instalações existentes atendem aos requisitos de acessibilidade da norma anterior NBR 9050/2004, aceitos até vencimento do prazo do TAC antigo. Além disso, algumas alterações pontuais, descaracterizarão o antigo projeto aprovado e também não atenderão a todas as exigências da nova norma 9050/2020 de acessibilidade.\n\nO novo TAC adequará toda a acessibilidade das agências para atendimento integral às normas vigentes de acessibilidade, sendo que toda a readequação da dependência será executada através de programa que contemplará a rede de agências conforme cronograma estabelecido com o MP. Gentileza aguardar, salvo se existir alguma notificação de órgão externo ao BB."}, {"id": 256, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": " Solicitar fotos à dependência (exemplo):\n\nFavor anexar na aba \"Documentos\" as fotos gerais e detalhadas das sinalizações externas que necessitam de reparos/manutenção, bem como informar suas dimensões, para avaliação das condições e viabilidade da análise e condução desta demanda.\nApós a inserção das fotos na aba \"DOCUMENTOS\", retornar a OS utilizando o status \"COMPLEMENTO DEPENDÊNCIA DEMANDANTE\"\n "}, {"id": 523, "categoria": "CIVIL", "tipo": "IN", "tag": "", "texto": "IN 739-1, item 2.5.1.3:  Entre SAA e o Hall de Público não devem ser instaladas persianas nem películas que bloqueiem a visualização entre os espaços, sob pena de se perderem as condições de segurança"}, {"id": 525, "categoria": "CIVIL", "tipo": "AVCB", "tag": "", "texto": "Os serviços de Eng. e Arq para regularização de AVCB com limite de até R$ 4.000,00 poderão ser contratados pela dependência com pagamento via CDA. IN:1154-1 item 6 - Tabela de Manutenção Prédial Evento 3112.  \nO EVENTO DESTINA-SE AO PAGAMENTO DE PESSOA FÍSICA E JURÍDICA. REGISTRAR AS DESPESAS COM CONTRATAÇÕES LOCAIS DE ENGENHEIROS, ARQUITETOS OU DESPACHANTES PARA EXECUÇÃO DE CROQUIS, PROJETOS, LAUDOS, EMISSÃO DE ART OU RRT E ACOMPANHAMENTO DO PROCESSO DE OBTENÇÃO DO AVCB JUNTO AO CORPO DE BOMBEIROS PARA PROCESSOS SIMPLIFICADOS E RENOVAÇÕES QUE NÃO REQUEIRAM OBRAS NA EDIFICAÇÃO, ATÉ O LIMITE DE R$ 4.000,00. ANTES DA CONTRATAÇÃO, NEGOCIE COM VÁRIOS PROFISSIONAIS/EMPRESAS PARA OBTENÇÃO DO MENOR PREÇO E A MELHOR PRESTAÇÃO DE SERVIÇO. REGISTRAR PEDIDO CDA E AGUARDAR AUTORIZAÇÃO DO GESTOR ORCAMENTÁRIO ANTES DE CONTRATAR EMPRESA/PROFISSIONAL. EFETUAR PAGAMENTO SOMENTE APÓS RECEBER DA EMPRESA/PROFISSIONAL O AVCB EMITIDO PELO CORPO DE BOMBEIROS E NÃO HAVER PENDÊNCIAS. AO NEGOCIAR COM PROFISSIONAL PESSOA FÍSICA, ATENTAR PARA CUSTO ARCADO A MAIOR EXCLUSIVAMENTE PELO BB DE CONTRIBUIÇÃO AO INSS DE 22,5% SOBRE O VALOR DO PEDIDO CDA (IN 238-1, ITEM 2.2.1.1) - NÃO HÁ PAGAMENTO DE INSS PELO BB EM CASO DE CONTRATAÇÃO DE PESSOA JURÍDICA. NÃO UTILIZAR PARA RECOLHIMENTO DE TAXAS. ACIONAR APENAS UM PEDIDO CDA POR PROCESSO DE OBTENCAO DE AVCB."}, {"id": 271, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": " Região sem contrato de carro oficina vigente. Previsão para contratação: 02/02/2020.\nOrientamos a dependência buscar atendimento alternativo com fornecedores locais e pagamento via CDA-Pequeno vulto.\nSe houver dificuldade, retornar FALE COM O CESUP para auxiliarmos na busca de fornecedores locais.\n "}, {"id": 18, "categoria": "ELÉTRICA", "tipo": "Retorno ao suprimentos", "tag": "", "texto": "Orientamos que seja acionado contrato de ar condicionado.\nNa maioria dos casos, terão custo inferior ao Carro Oficina (o Carro Oficina prevê chamado e deslocamento, além do custo de material e mão-de-obra).  O mantenedor de ar condicionado também poderá efetuar ajustes no comando/automação das máquinas, quando for necessário, serviço que as empresas de Carro Oficina não detém conhecimento.\nEstá previsto no  contrato de ar condicionado manutenção no quadro elétrico que atende as máquinas."}, {"id": 534, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": " Conforme IN 739-1:\n2.4.4.2. Por questões mercadológicas e de segurança as vitrines do BB deverão ser envidraçadas e manter sua transparência.\n2.4.4.3. Essa condição deve permitir a visualização interna da SAA pelos transeuntes, bem como a visualização externa pelos clientes e funcionários. \n2.4.5.5. É vetada a utilização de películas de qualquer tipo nos vidros das Agências.  "}, {"id": 282, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Orientamos a dependência buscar atendimento alternativo com fornecedores locais e pagamento via CDA-Pequeno vulto, visto o contrato estar sem saldo.\nSe houver dificuldade, retornar a OS para auxiliarmos na busca de fornecedores locais.\n "}, {"id": 36, "categoria": "ELÉTRICA", "tipo": "Retorno ao suprimentos", "tag": "", "texto": " Serviço autorizado.\n\nSubstituição das lâmpadas azuis por fita LED conforme abaixo:\n\n01 unidade - 19.35 - Fita de LED\n05 unidades - 19.5 - Ponto eletrico - Manutencao\n\nA fita de LED possui 5m, deve ser dividida por 8 para instalação em cada Carenagem. O item já contempla fonte de alimentação para 5m de fita.\nDeve ser feita adaptação dos pontos elétricos para o novo tipo de lâmpada. "}, {"id": 53, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma - Perfil B", "tag": "", "texto": " Encaminhamos OS por se tratar de prédio perfil B. "}, {"id": 54, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Prezados,\n\nA mapoteca centralizada está desatualizada/ sem projetos. Favor fazer o upload dos projetos desta agência para futuras consultas."}, {"id": 92, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": " conforme consta na IN 327-1  Condução de Obras de Engenharia, item 1.4.3.1. O Cesup Rede/Plataforma é responsável por conduzir, assessorar e acompanhar o desenvolvimento dos projetos destes eventos. Após análise de segundo nível verificamos a necessidade de elaboração de projetos conforme descrito abaixo: \n\nInstalações elétricas - CFTV - Projeto para modernização/Inclusão de pontos novos\n\nQuando o projeto estiver atualizado, solicitamos anexar a esta OS para darmos andamento à solicitação. "}, {"id": 97, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": " Sr. Gerente,\n\nCom a falta de atendimento por parte da contratada, solicitamos informar se o problema foi corrigido.\n\nCaso o problema seja de programação do timer, anexamos na aba documentos os manuais de programação de horário. \nCaso não seja problema somente de programação, orientamos buscar em sua cidade algum profissional que possa orçar o serviço para pagamento via CDA (programação e/ou troca do timer).\n\nNão sendo possível a correção com as opções acima, favor devolver esta mensagem para buscarmos atendimento alternativo. \n\nGentileza dar ciência e devolver esta OS usando status \"Complemento Dependência Demandante\" em Plataforma BB > Administrativo > Manutenção > Pendência de Providências >  Selecionar a OS > utilizar o status \"complemento dependência demandante\""}, {"id": 611, "categoria": "", "tipo": "", "tag": "", "texto": "  "}, {"id": 357, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\nEsclarecemos que sinalização horizontal é a demarcações das vagas (regulares ou preferenciais com a simbologia de identificação). Analisando as fotos as vagas estão demarcadas.\n\nA sinalização vertical não é item contratual do carro oficina. Orientamos a dependência solicitar a compra da placa através de pedido via SISLOG: PBMS: 99 _5 _40 999032 (+) PLACAS DE SINALIZACAO :   Modelos de Placas de Estacionamento Cfe. IN 323-1 item: 2.13.6.9. Sinalização Interna Seg. Trabalho Características do Sitema Placas Estacionamento, indicando na descrição a placa desejada. \nOs modelos das placas estão anexadas na aba documentos.\n"}, {"id": 613, "categoria": "ELÉTRICA", "tipo": "", "tag": "", "texto": "- Todas as movimentações em forro e piso elevado são consideradas na mão de obra prevista para o trabalho, devendo as áreas de intervenção ser entregues livres de defeitos e imperfeições;"}, {"id": 621, "categoria": "ATENDIMENTO NIV", "tipo": "AVCB", "tag": "", "texto": " Para regularização de medidas de combate a incêndio, procure orientações atualizadas na página do SESMT.\nLink\nhttps://sesmt.intranet.bb.com.br/seguranca/hotsite/avcb.jsp\n\nCaso tenha recebido orientações do SESMT para acionamento do Carro Oficina, inclua o e-mail na aba documentos, e encaminhe a OS como COMPLEMENTO DEPENDÊNCIA DEMANDANTE.\n"}, {"id": 368, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": " OS #PAD \n\nEncerramos a OS para possibilitar a instauração de #PAD contra o Fornecedor. O relatório do fornecedor não condiz com o problema da demanda a ser solucionada. Falta de qualidade técnica da empresa.\n\nA condução alternativa desta OS:\n\nEncaminhado parecer de benfeitoria necessária ao CESUP Patrimônio/Gestão do uso de imóveis para ações junto ao proprietário para verificação e resolução de problemas de infiltrações.  "}, {"id": 123, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "", "texto": " Sr. Gerente,\n\nTrata-se de instalação de infraestrutura ou ativação de câmera?\nPara instalar câmera em ponto existente, orientamos acionar a BBTS via Plataforma BB.\nCaso seja necessária infraestrutura (cabeamento), favor retornar esta OS para darmos continuidade ao atendimento. "}, {"id": 400, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados,\n\nNo Banco do Brasil, a Bandeira Nacional deverá ser instalada em mastro no interior das dependências.\nPara instalação de mastros internos utilizar a Pequenas Despesas de pronta entrega da IN 1154 evento 2880. O Carro oficina não instala este item.\nUtilizar as instruções da IN 323-1 item 2.22.7.\n\nSe legislação local exigir instalação de mastro externo abrir SCAP via endereço:\nhttps://cesuprede.intranet.bb.com.br/scap/#/cadastro\n\nSolicito encerrar a OS com o Status CONCLUIDO DESPESAS DE PENQUENO VULTO"}, {"id": 414, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Prezados, \nDevido a ausência de contrato carro oficina vigente para sua região, orientamos abertura de chamado no ZÁPIDO, conforme IN 328-1-16: Interface Digital para a Contratação de Pequenas Despesas de Pronta Entrega e Pagamento de Manutenção Predial - Zápido, disponível no na Plataforma BB 3.0 - Negócios - Administrativo - manutenção - Zápido  ou buscar atendimento alternativo com fornecedores locais e pagamento via CDA-Pequeno vulto."}, {"id": 671, "categoria": "ELÉTRICA", "tipo": "COFRE ARMAS", "tag": "", "texto": "O atendimento a qualquer demanda referente a portaria 18.045/2023 será feito de forma massificada, conforme estratégia em definição pelo BB. A portaria entrou em vigor em 01/05/2023 e as adequações têm prazo de 1 ano para serem realizadas"}, {"id": 680, "categoria": "", "tipo": "", "tag": "", "texto": ""}, {"id": 430, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "  Prezados,\nPara subsidiar a análise, por gentileza incluir fotos do ambiente da intervenção bem como esclarecer a necessidade deste remanejamento.\nObs.:  - Utilizar a aba \"documentos\" para inclusão das fotos.\n           - As fotos precisam ser de perto, de longe e do contexto do ambiente.  "}, {"id": 445, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": " Prezados,\nTrata-se de itens não contratuais via carro oficina. Proceder conforme IN 336-1Suprimento de Bens Móveis e Materiais Item 3.2 Reforma e Manutenção de Mobiliário e Equipamentos de Uso:\nitem 3.2. Reforma e Manutenção de Mobiliário e Equipamentos de Uso.\nCaso não se enquadre em manutenção seguir IN 336-1Suprimento de Bens Móveis e Materiais Item 3.2 Reforma e Manutenção de Mobiliário e Equipamentos de Uso:\nitem 2. Suprimentos de Mobiliário e Equipamentos de Uso > 2.1. Todas as Unidades do Banco \n\n\n "}, {"id": 465, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": " Acionar a contratada para fornecimento de Relatório Técnico de Vistoria e orçamento, conforme Modelo padrão do BB.\nO relatório deve apresentar as indicações nas fotos das medidas que originarem os quantitativos do orçamento, bem como fotos de todas as áreas de intervenção por ambiente  (panorâmicas e de detalhes, internas e externas), croquis e memorial de cálculo.\nDevem ser destacadas as causas das infiltrações, detalhando forma de solução e orçamento.\nNo primeiro atendimento devem ser adotadas medidas preventivas como verificação da cobertura (telhado), desentupimentos de calhas e outros serviços úteis para reduzir e evitar o agravamento de situações de riscos. "}, {"id": 222, "categoria": "ELÉTRICA", "tipo": "Preventiva", "tag": "", "texto": " Orçamento analisado, \n \nAlguns itens foram indeferidos pois a não foi comprovada a necessidade para as intervenções propostas, de acordo com o relatório. Frisamos que a falta de comprovação de serviços necessários à manutenção da dependência não poderá trazer prejuízos a esta, sob pena de retorno ao imóvel e complementação dos serviços sem ônus ao banco.\nOrçamento deferido, favor proceder à execução do serviço. "}, {"id": 245, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Encaminhamos esta OS, pois verificamos a necessidade de alteração no layout para inclusão de novos pontos lógicos. Há necessidade de estudo de layout e atualização dos projetos.   "}, {"id": 246, "categoria": "ELÉTRICA", "tipo": "Devolvida à dependência", "tag": "", "texto": "Prezados,\n\nfavor esclarecer se é instalação de novos pontos elétricos ou manutenção de pontos existentes.\n\nCaso seja um novo ponto:\n- descrever o motivo (Ex: equipamento novo,  remanejo de equipamento, (qual equipamento?), somente para tomada de uso geral;  etc.)\n- descrever o local da instalação;\n- anexar fotos do local e do equipamento (aba Documentos desta OS);"}, {"id": 502, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Prezados,\n\nEncaminhamos para análise e condução, pois o item não consta no contrato de carro oficina.\n\nConforme a IN 328-2, no fluxo de atendimento do item 4.2.2.3.1.1. da IN 328-2, a demanda deverá ser encaminhada para análise e condução do terceiro nível (Cesup Plataforma) nas seguintes ocasiões:\n*Quando há a necessidade de vistoria na dependência para fiscalização do serviço;\n*Quando os serviços são de reinvestimento (Orfix); \n*Quando os serviços de manutenção não constam no contrato do carro oficina."}, {"id": 504, "categoria": "GERAL", "tipo": "Fiscalização serviço", "tag": "", "texto": "Prezado administrador, segue orientações quanto a fiscalização dos serviços executados carro oficina.\n\nIN 328 -1 Manutenção Predial\n\nServiços em concordância com as orientações do CESUP SUPRIM PR e o disposto na  IN 328, item 8.2.1.1.8.2.\nContratos de Carro Oficina\n8.2.1. Dependência Beneficiária\n8.2.1.1. Cabe ao Administrador Predial do imóvel:\n8.2.1.1.1. verificar se os serviços constantes no RAT (Relatório de Atendimento Técnico) foram efetivamente realizados, sanando a demanda iniciada na Ordem de Serviço aberta pela dependência."}, {"id": 1, "categoria": "ELÉTRICA", "tipo": "Retorno ao suprimentos", "tag": "", "texto": "Reencaminhar ao fornecedor para atendimento. Ao invés de acionar o carro oficina, recomendamos que a agência acione a mantenedora de ar condicionado(ou outra empresa especializada em ar condicionado na região), PAGANDO VIA CDA, para efetuar estes ajustes, visto que na maioria dos casos terão custo inferior ao Carro Oficina. Elas também poderão efetuar ajustes no comando/automação das máquinas, quando for necessário, serviço que as empresas de Carro Oficina não detém conhecimento."}, {"id": 261, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Para condução da Plataforma visto se tratar de nova infraestrutura - instalação de TCC."}, {"id": 262, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Para condução da Plataforma visto se tratar de nova infraestrutura - incremento de segurança."}, {"id": 263, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Encaminhamos demanda para condução dessa plataforma visto não se tratar de manutenção predial e que envolvem questões de segurança, novas instalações e/ou alteração de características originais."}, {"id": 264, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "SUPORTE PARA MAPA TÁTIL:\nSolicitar compra de novo suporte via SISLOG:\nPBMS: 71 10 170 _50038 (+)  SUPORTE PARA MAPA TATIL\nContrato: 201974210197 7417 NORMAL           16/01/2021 510153391 SULAR INDUSTRIA DE\nRegistro de Preços para aquisição de Suporte para Mapa Tátil para todo o país.\n"}, {"id": 267, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "DEVOLVER AO SUPRIMENTOS\nOS sob condução da Plataforma. O CESUP REDE Plataforma pode solicitar serviços ao carro-oficina sem necessidade de avaliação da engenharia do CESUP Patrimônio. Eles têm autonomia decisória como 3° nível de atendimento.\n"}, {"id": 12, "categoria": "ELÉTRICA", "tipo": "Retorno ao suprimentos", "tag": "", "texto": "Encaminhar demanda de substituição das luminárias. Verificar com fornecedor a possibilidade de instalar Item 10.31 – utilizando luminária led conforme especificação a seguir:\nTipo: Luminária circular de embutir (luminária, driver e rabicho), com Led com fluxo luminoso acima de 1.600 lúmens e eficácia luminosa acima de 80 lm/W, emissão de luz na cor branco neutro, aro em alumínio injetado com acabamento em pintura eletrostática na cor branca, difusor recuado em acrílico translúcido, driver 700 a 1050 mA (conforme potência da luminária)."}, {"id": 273, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "À Dependência, devido ao não atendimento do Fornecedor carro-oficina solicitamos a inclusão de fotos na aba Documentos para nossa análise de melhor atendimento alternativo para o caso."}, {"id": 276, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Revisão Elétrica:\nNecessária manutenção do quadro elétrico, verificar Checklist para manutenção dos quadros: Verificar pontos de aquecimento; Verificar fixações e conexões; Verificar necessidade de instalação de placas de policarbonato para proteção; Verificar isolamentos defeituosos; Verificar as identificações dos circuitos; Verificar continuidade do aterramento; Verificar limpeza e estado de conservação dos quadros elétricos; Medir e anotar as correntes e tensões de fase sobre o disjuntor geral do QGBT, com todos os equipamentos em funcionamento. Caso seja verificado incoerência entre as medições efetuadas e dimensionamento dos disjuntores e cabeamento, apresentar relatório com as seguintes informações: - Bitola do ramal de entrada; - Leitura das correntes em cada fase do ramal de entrada com os equipamentos de refrigeração ligados (plena carga); - Leitura das tensões entre as fases e entre fase e neutro; - Diagnóstico sobre balanceamento das cargas; - Fotos nítidas do quadro, cabeamento e disjuntores.\n"}, {"id": 279, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "A dependência deverá buscar atendimento alternativo com fornecedores locais e pagamento via CDA-Pequeno vulto visto a construtora A Constrular ter sido suspensa.\n\nSe houver dificuldade, retornar a OS para auxiliarmos na busca de fornecedores locais.\n"}, {"id": 280, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "À Dependência, devido a ausência de contrato de carro-oficina vigente para a sua região, solicitamos incluir fotos na aba Documentos para os serviços em que necessitarem do auxílio desta engenharia para busca de Fornecedores locais para execução dos serviços e pagamento via CDA-pequeno vulto pela dependência."}, {"id": 284, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Não autorizamos a exclusão de um serviço inerente ao serviço da Preventiva que será pago com verba de investimento ORFIX já prevista pelo BB para substituí-la por um CDA verba ORTAD a qual será necessária autorização da DISEC."}, {"id": 29, "categoria": "ELÉTRICA", "tipo": "Retorno ao suprimentos", "tag": "", "texto": "Relatório analisado, alguns itens do orçamento foram ajustados às necessidades do serviço e especificações do contrato.\n                                                                                                                                                                                                                                                                       Itens extras, quando necessários para recomposição de forro ou paredes devem ser incluídos na RAT e validados pelo gerente da dependência, sendo assim incluídos no pagamento."}, {"id": 285, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Por se tratar de incremento de soluções, encaminhamos ao CESUP REDE Plataforma para as avaliações e soluções solicitadas.\nInformamos que o contrato do carro oficina está sem saldo e deverá ser buscado atendimento alternativo - ARP Obras, CDA-Engenheiro Presente, etc\n"}, {"id": 287, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Deverá ser buscada outra forma de atendimento visto a região estar desassistida de contrato carro oficina."}, {"id": 288, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Devido a ausência de contrato carro oficina vigente para o estado do Piauí, devolvemos para busca de atendimento alternativo - ARP Obras, CDA-Engenheiro Presente, etc."}, {"id": 289, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "A dependência deverá buscar atendimento alternativo com fornecedores locais e pagamento via CDA-Pequeno vulto, visto a sua região estar desassistida de contrato com fornecedor carro oficina.\nSe houver dificuldade, retornar a OS para auxiliarmos na busca de fornecedores locais.\n"}, {"id": 290, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Boletim TAAs Recicladores - demanda sob condução dos CESUP REDE Plataforma."}, {"id": 293, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "\nÉ dever da contratada levantar os serviços necessários, independente do desejo do gestor do imóvel. A aprovação da execução dos serviços é que será negociada entre gestor, Super e engenharia BB.\n"}, {"id": 295, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": " IN 416-1  Gestão de Segurança em Ambientes de Negócios\n\n10.1.2.2. Em dependências que não contam com serviços terceirizados (abastecimentos de TAA ou recolhimento de envelopes), seu uso é vedado e a porta deve ser lacrada, por meio da instalação de anteparo pelo lado interno, de forma a impossibilitar sua abertura.\n\nDesse modo, proceder com a execução do anteparo interno para lacrar o acesso da carenagem:\n\n1 - Fixação de madeirite, na mesma cor da carenagem e rente a esta, lado interno;\n\n2 – Instalação de um sistema simples de tranca com 2 hastes metálicas de aço, passantes transversalmente no meio das partes superior e inferior, sobre a vedação de madeirite.\n\nOrçamento dos serviços:"}, {"id": 301, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "(OS 190079655) Prezada Cristiane, \n\nConforme conversamos hoje 24/09/2019 via telefone, por gentileza anexar fotos da rota acessível que leva até os banheiros acessíveis da dependência e fotos dos banheiros, para verificarmos se há inconsistências.\nAnexar também o pedido de prorrogação da notificação (assunto tratado nas OS's 190079019 e 190075924).\nInformamos que não há exigências/referencias na NBR 9050 para instalar piso tátil e direcional dentro do banheiro. \n\nEncaminharemos a notificação do procon e o pedido de prorrogação  à equipe da Disec/Disae, para que eles efetuem consulta ao jurídico para uma revisão e/ou esclarecimentos técnicos de como atender o parágrafo 2 do artigo 1 \"...A sinalização a que se refere o caput deste artigo também deverá ser feita no interior dos banheiros adaptados, guiando as pessoas com deficiência visual até o lavatório e ao vaso sanitário...\".\n\nDúvidas, estou à disposição."}, {"id": 302, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "[Ontem 11:24] Carolina de Sousa\n    \nOrientações para reforma e manutenção de mobiliário e equipamentos de uso (não contratuais de carro oficina) IN 336-1Suprimento de Bens Móveis e Materiais Item 3.2 Reforma e Manutenção de Mobiliário e Equipamentos de Uso:\n3.2. Reforma e Manutenção de Mobiliário e Equipamentos de Uso\n3.2.1. Disposições Gerais\n3.2.1.1. A reforma e manutenção de mobiliário e equipamentos de uso é permitida para todas as Unidades do Banco e tem prioridade sobre a compra do bem novo, sempre que o valor da reforma, incluindo impostos e fretes, for igual ou inferior ao limite de 50% do preço do bem novo.\n3.2.1.2. A reforma e manutenção deve obedecer aos padrões e especificações visuais do Banco, conforme disposto na [IN: 322-1] Projetos e Especificações de Mobiliário, de Equipamentos de Uso e de Utensílios.\n3.2.1.3. A etiqueta de identificação dos móveis, contendo número universal, deve ser mantida após a reforma.\n3.2.1.4. Os serviços devem ser contratados, preferencialmente, com empresa coletiva ou individual.\n3.2.1.5. Os serviços poderão ser realizados por autônomo desde que o valor da proposta seja inferior à apresentada pelos demais participantes, considerando a contribuição patronal e esteja em conformidade com a disposição normativa de Contratação de Autônomos e Cooperativas -[IN: 1154-1].\n3.2.1.6. O transporte poderá ser feito pelos meios já existentes nas dependências ou ter o custo incluído no preço da reforma.\n3.2.1.7. O material necessário à reforma pode ser adquirido pela própria dependência encarregada do serviço ou pelo contratado. Nas duas situações o custo do material deverá ser considerado no preço dos serviços para decisão quanto à compra de bem novo ou reforma.\n3.2.2. Orçamento - Reforma e Manutenção de Mobiliário e Equipamentos de Uso\n3.2.2.1. A realização dos serviços está condicionada à existência de orçamento ORTAD no prefixo da Unidade responsável pela despesa. Para a contratação observar o enquadramento orçamentário constante do procedimento desta instrução normativa.\n3.2.3. Formas de Contratação\n3.2.3.1. Pela própria Unidade - enquadrada como Pequenas Despesa de Pronta Entrega e Pagamento, desde que atenda às disposições normativas de Compras e Contratações e os valores previstos na Tabela de Itens de Despesas de Pequeno Vulto da [IN: 1154-1].\n3.2.3.2. Pelo Cesup Suprimentos - a critério da Unidade, conforme previsto na [IN: 1154-1]:\n3.2.3.2.1. Contratação Direta\n3.2.3.2.1.1. Pequenas Despesas de Pronta Entrega e Pagamento\n3.2.3.2.1.1.1. Compras e Contratações nas Dependências\n3.2.3.2.1.1.1.1. A dependência pode continuar demandando o Cesup Suprimentos com solicitações que envolvam valores superiores a R$1000,\n<https://teams.microsoft.com/l/message/19:3bcfc78418ab487a986f123c2a1037d8@thread.skype/1579703076588?tenantId=ea0c2907-38d2-4181-8750-b0b190b60443&amp;groupId=3d96c642-ba72-488f-8eb6-28f6be268ca4&amp;parentMessageId=1579703076588&amp;teamName=Atendimento Carro Oficina - 9101&amp;channelName=Geral&amp;createdTime=1579703076588>"}, {"id": 306, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "14.29 - Sinalizacao - Pictogramas Diversos em Acrilico: Fornecimento e instalacao/substituicao de pictogramas em acrilico, para identificacao de terminais de autoatendimento, sinalizacoes de emergencias, acessos, internas e externas, conforme especificacao Limit - na foto 2.2 comprova-se 6 unidades"}, {"id": 310, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "À Dependência,\n- Informamos que esta adequação é paliativa e encaminhamos Parecer de Benfeitorias necessárias ao CESUP Patrimônio/Gestão de Uso de Imóveis para solicitar ao proprietário  reforma geral cobertura. (ver email anexado na aba documentos).\n- Orientamos solicitar mensalmente os serviços de limpeza de calha (entre outros) escopo do seu contrato de limpeza:\nContrato: 201674190172 LIDERAN?A Limpeza e Conserva??o LTDA"}, {"id": 313, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "À dependência,\n\nFoi acionada manutenção preventiva OS 190090566 para sua dependência. Por gentileza na vistoria da preventiva pedir para a construtora indicar no relatório qual (ais) parede (s)  internas a agência gostaria de alterar a cor.\n\nQuando receber o relatório e orçamento da preventiva, farei a análise da alteração de cor alinhada com o padrão visual definido na IN 739.\n"}, {"id": 58, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Encaminhamos demanda para análise, inclusão de layout (terminais leves)  e gravação de agrupamento (quando for o caso de investimento), e autorização de serviço para o carro oficina."}, {"id": 314, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "À dependência,\n\nFoi acionada manutenção preventiva OS 19009457 para sua dependência. Por gentileza na vistoria da preventiva indicar tais problemas para que seja lançado no relatório técnico e no orçamentos."}, {"id": 59, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Encaminhamos demanda para análise, inclusão de layout (balcão de atendimento e novo posicionamento dos TCC)  e gravação de agrupamento (quando for o caso de investimento)"}, {"id": 315, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "À Dependência,\nInformamos que foi anexado pelo CESUP Plataforma o layout do mapa tátil para que tenham condições de efetuar o pedido via Sislog. (Ver anexos na aba documentos). \n> Registre sua solicitação no aplicativo Sislog, com o PBMS 99.05.020.070.002. Informe na solicitação que o layout está sendo encaminhado em (data) por e-mail à Bens4 (7419).  Encaminhe o layout do mapa tátil para o prefixo 7419 através do email: cesup.bens.consum@bb.com.br a/c equipe Bens4, com o nº da solicitação Sislog.    \n\nObs.: Trata-se de placa que deve ser confeccionada por empresa especializada e homologada (Atas de Registro de Preço para sinalização)."}, {"id": 316, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "À Dependência:\n\nConforme conversado, via telefone, com  a Angelita (prefixo 2757) informamos que devido a ausência de contrato de carro-oficina vigente para a sua região e por se tratar de serviços emergenciais, orientamos que a dependência deverá buscar atendimento alternativo com fornecedores locais e pagamento via CDA-Pequeno vulto.\n\nSe houver dificuldade, retornar a OS para auxiliarmos na análise do orçamento."}, {"id": 62, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Encaminhamos para verificação de serviço em garantia (Lâmpadas de LED) "}, {"id": 318, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "À Plataforma,\n\nFavor definir os serviços a serem executados (arquitetura e elétrica) para orientar o fornecedor e demandar o acionamento ao CESUP Suprimentos OU acionar o fornecedor para  execução de relatório de vistoria e orçamento para sua análise (também via CESUP Suprimentos)."}, {"id": 66, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Encaminhamos para análise e condução do serviço por não se tratar de manutenção. Necessária análise de layout para inclusão de novas mesas de atendimento.          \nPara aprovação, retornar ao CESUP Suprimentos e informar se o pagamento será via ORTAD ou ORFIX (incluir agrupamento)."}, {"id": 322, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Ao CESUP Plataforma, \nEncaminhamos demanda para condução visto que trata-se intervenções maiores que caracterizam como reforma de conservação predial (orçado na preventiva R$230.558,26 sem as intervenções de benfeitorias necessária na cobertura).\nNo relatório técnico é identificado problemas graves com infiltrações nas paredes e forros identificado por dimensionamento errôneo de calhas. Falta de disjuntor de media tensão na subestação, etc.\n"}, {"id": 68, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Sr. Assessor (a), favor incluir anotação com seu parecer, indicando aprovação/indeferimento do (s) serviço (s) solicitado (s). Caso seja necessário envio de projeto/ layout, favor anexar o arquivo nessa OS."}, {"id": 69, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Retornamos o chamado por não tratar-se de manutenção\nInstalação de pontos novos devem ser dimensionados, orçados e autorizados pelo CESUP Plataforma."}, {"id": 325, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Ao Cesup Plataforma,\nPara condução. Trata-se de reforma de adequação com o desenvolvimento de soluções para atendimento às normas de acessibilidade. \nEm 04/10/2019 fiz contato telefônico com a Gerente Cilce. Ela  me informou que há notificação da promotoria pedindo adequação na porta alternativa (ao lado da PGDM). Referente a este assunto, ela me avisou que solicitou atendimento ao CESUP Plataforma via email.\n\nAlém dos problemas com os pisos e conjunto vidraçaria/PGDM/Portas, as carenagens do TAA \"acessível\" está em desacordo com os normativos internos e técnicos. Demais inconformidades, deverão ser levantados.\n"}, {"id": 327, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Ao CESUP Suprimentos,\nAcionar fornecedor para adequação na sala de autoatendimento. A demanda consiste em remanejar o posicionamento do balcão de informações da SAA e TDS-Terminal Dispensador de senha e serviços correlatos para viabilização. Ver layout comentado disponibilizado na aba documento.\nUtilizar os itens e quantitativos estimados:\n> 2.4 - Demolicao de pisos em geral (ladrilho hidraulico, camada de enchimento, ceramica, porcelanato, marmore, granito, pedra e madeira) - Manual - 3,33m²\n> 10.1 - Regularizacao de base ou contrapiso - 3,33 m²\n> 10.14 - Piso em Porcelanato - 3,20m² (conforme padrão existente)\n> 13.12 - Deslocamento ou remanejamento de mobiliario dentro da agencia - 4 un\n> 19.3 - Ponto eletrico simples novo - Custos fixos - 2 un\n> 19.4 - Ponto eletrico simples novo - Custos Variaveis - 30m\n> 19.10 - Ponto logico/alarme simples - Custos Fixos - 2 un\n> 19.11 - Ponto logico/alarme simples - Custos Variaveis - 30m\n\nObservações:\n> O Piso tátil de alerta a instalar deverá ser orçado para pagamento via CDA. Especificação Podotátil 25x25cm Eliane TEC (cor azul).\n> Conforme solicitação da fiscalização, anexar à RAT o croqui com  a distância e o caminho da execução (novos pontos de elétrica e lógica).\n> incluir fotos das fases de execução e conclusão do serviço."}, {"id": 328, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Ao Cesup Suprimentos,\nAcionar fornecedor para atendimento emergencial. Não havendo risco grave eminente, elaborar relatório técnico e orçamento precificado, apontando suas causas e serviços solução dos danos."}, {"id": 73, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Ao CESUP Plataforma, \nEncaminhamos demanda para condução dessa plataforma visto não se tratar de manutenção predial e que envolvem questões de segurança, novas instalações e/ou alteração de características originais, bem como intervenções maiores que caracterizam reforma de ID. \n"}, {"id": 330, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Ao CESUP Suprimentos,\nAutorizamos executar os serviços deferidos na aba orçamento e conforme ao layout do piso tátil anexado na aba documentos.\nArquivo:\n2726-TIMON-MA - layout piso tátil.pdf\n\nObs.: Não será executado a instalação de piso tátil externo. Para atender esta adequação recomendamos solicitar ao CESUP Plataforma  Belém - cesup.platbelem.pa@bb.com.br.\n"}, {"id": 77, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Encaminhamos OS para análise e responsabilização da empresa que causou os danos relatados.\nCaso seja necessária nova instalação via carro oficina, deverá esta plataforma orçar e aprovar o serviço por se tratar de instalação de pontos novos."}, {"id": 78, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Conforme disposto na IN 328, encaminhamos aos cuidados deste CESUP PLATAFORMA para análise e providências, visto haver uma solicitação para alteração do layout original."}, {"id": 79, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "A equipe de fiscalização da manutenção foi dimensionada para atender exclusivamente a chamados de manutenção preventiva e corretiva. Chamados que necessitem de análise e alteração de leiaute e inclusão de pontos novos devem ser analisadas pela plataforma para a devida atualização dos projetos. "}, {"id": 335, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Ao Fornecedor,\nAprovamos os serviços deferidos na aba orçamento valor R$10.216,09.\nInformamos que mesmos após reiterações de correções do relatório alguns serviços não foram incluídos e justificados.\n\nPedimos que na execução do serviço se faça o levantamento para manutenção da pintura externa e da \"grade em rolo\". Pela foto do relatório aparece com pichações.\n\nRetonar OS para retificar a aprovação.\n\nObs.:  Problemas identificados informei também (via telefone) o Eng. Leonardo (Megatec)"}, {"id": 80, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Este atendimento não pode ser acompanhado pelo CESUP Patrimônio. A equipe de fiscalização da manutenção foi dimensionada para atender exclusivamente a chamados de manutenção preventiva e corretiva. Chamados que necessitem reinvestimento e inclusão de pontos novos devem ser analisadas pela plataforma para a devida atualização dos projetos. "}, {"id": 81, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Este atendimento não pode ser acompanhado pelo CESUP Patrimônio.\n\nChamados que necessitem reinvestimento e inclusão de pontos novos devem ser analisadas pela plataforma para a devida atualização dos projetos. "}, {"id": 342, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Deferimos a adequações dos pontos de elétrica e lógica partindo dos pontos existentes para viabilizar o uso do balcão de informações da SAA, conforme layout desenvolvido em 2018 (reforma geral) e conforme especificação do detalhamento do mobiliário (ver aba documentos).\nAcionar os itens:\n19.1 - Ponto eletrico duplo novo - Custos Fixos - 01 un\n19.12 - Manutencao de Ponto Logico/Telefonico /alarme/cftv - 01 un\n19.5 - Ponto eletrico - Manutencao - 01 un\n19.8 - Ponto logico duplo novo - Custos Fixos - 01 un"}, {"id": 87, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "conforme consta na IN 327-1  Condução de Obras de Engenharia, item 1.4.3.1. O Cesup Rede/Plataforma é responsável por conduzir, assessorar e acompanhar o desenvolvimento dos projetos destes eventos. Após análise de segundo nível verificamos a necessidade de elaboração de projetos conforme descrito abaixo: "}, {"id": 343, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Deferimos a fixação do TCC e adequações dos pontos de elétrica e lógica partindo dos pontos existentes.\nAcionar itens: \n14.11 - Fixacao de suporte de TCC em parede ou teto (fixar na parede/pilar no mesmo local do antigo TCC - Altura 2,30m)\n1x19.3 - Ponto eletrico simples novo - Custos fixos\n19.4 - Ponto eletrico simples novo - Custos Variaveis (distancia do ponto atual até o novo ponto - aproximadamente 3m)\n19.94 - Patch Cord flexivel Cat5e / 2,5m (ou 19.93 conforme necessidade).\nObs.: Passar o Patch cord pela canaleta do ponto elétrico.\n\n\nConforme solicitação da fiscalização, anexar à RAT o croqui com  a distância e o caminho da execução."}, {"id": 344, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Deferimos a fixação dois TCC's (um na laje/cobertura - ambiente caixas e outro na parede - parede atendimento) e adequações dos pontos de elétrica e lógica. \nAcionar itens: \n14.11 - Fixacao de suporte de TCC em parede ou teto (fixar na parede no mesmo alinhamento do TCC já instalado) \n14.11 - Fixacao de suporte de TCC em parede ou teto (fixar na laje/cobertura no local do TCC antigo (de pedestal)  - Altura 2,30m)\n2x19.3 - Ponto eletrico simples novo - Custos fixos \n19.4 - Ponto eletrico simples novo - Custos Variaveis (executar pontos a partir dos pontos elétricos mais próximos já existentes) \n2x19.10 - Ponto logico/alarme simples - Custos Fixos  \n19.11 - Ponto logico/alarme simples - Custos Variaveis (distancia dos pontos ao rack)\nObs.: Passar o Patch cord pela canaleta do ponto elétrico.\n\nConforme solicitação da fiscalização, anexar à RAT o croqui com  a distância e o caminho da execução."}, {"id": 345, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Demanda trata junto com OS 190068254 e 190068250.\nO pagamento do deslocamento e chamado deferido na OS 190068254 ."}, {"id": 346, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Demandas com verificação de não conformidade na agencia. Ex. Ausencia de divisorias de privacidades, TAA sem as carenagens acessíves, etc"}, {"id": 347, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Elaborar consulta ao protocolo (modulo apoio) com objetivo de acompanhamento das fases do acionamento de ARP até a formalização do contrato. Esta consulta permitirá efetuar a gestão desse serviço no power BI.\n\nIndicar no painel de notificação quando houve o numero do contrato para que o assessor demandante efetue a contratação de aditivo (ex. aditivo de itens não precificados em ARP) e outros procedimentos devidos."}, {"id": 348, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Encaminhamos para condução e adequação do projeto pois a proposta anexada nesta demanda e o projeto disponível na mapoteca não atendem à NBR 9050."}, {"id": 93, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "\"conforme consta na IN 327-1  Condução de Obras de Engenharia, item 1.4.3.1. O Cesup Rede/Plataforma é responsável por conduzir, assessorar e acompanhar o desenvolvimento dos projetos destes eventos. Após análise de segundo nível verificamos a necessidade de elaboração de projetos conforme descrito abaixo: \n\nInstalações elétricas - Iluminação externa - projeto para instalação de refletores.\n\nQuando o projeto estiver atualizado, solicitamos anexá-lo a esta OS para darmos andamento à solicitação.\"\n"}, {"id": 349, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Entrado em contato com o Procon Assessor Thiago. Pedimos orientações e esclarecimentos para: como proceder quando a legislação pede soluções não previstas na NBR (como por exemplo:..\"A sinalização a que se refere o caput deste artigo também deverá ser feita no interior dos banheiros adaptados, guiando as pessoas com deficiência visual até o lavatório e ao vaso sanitário\"...\nEle ficou de conversar com o coordenador do Procon e pediu para eu retornar o contato em 23/08/2019 às 14h."}, {"id": 94, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Encaminhamos para análise e atualização dos projetos devido a alteração de dotação da dependência.\n\nQuando os projetos estiverem atualizados, solicitamos anexá-los a esta OS para darmos andamento à solicitação."}, {"id": 95, "categoria": "ELÉTRICA", "tipo": "Encaminhado à plataforma", "tag": "", "texto": "Encaminhamos para análise e atualização dos projetos devido a solicitação de incremento de infraestrutura e criação de pontos novos.\n\nQuando os projetos estiverem atualizados, solicitamos anexá-los a esta OS para darmos andamento à solicitação."}, {"id": 351, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Gradil para cercar jardim (problema andarilhos, drogados e cachorros)"}, {"id": 353, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Há vários tipos de placas e adesivos para sinalização e comunicação visual. Veja na IN 323-1, qual é a configuração que você precisa, e complete os detalhes no pedido pelo SISLOG - 12 solicitando o PBMS Genérico 99.05.020.70002\nDê uma olhada no Guia de solicitação SINT."}, {"id": 354, "categoria": "CIVIL", "tipo": "", "tag": "", "texto": "Imóvel locado ---> provavelmente construído pelo proprietário para ocupação do BB.\nC
